note = "The page relay's side of the gateway. Every request needs `Authorization: Bearer <relay key>`, compared in constant time: 403 `Unavailable` without it (also for /stream without an Upgrade header), 404 `Unavailable` for an unknown path with it. POST /start marks the stream started and sends `ready` to the client: {ok: true}, or {stop: true} once stopped. GET /input waits at most 20 ms for a frame: {data: <base64 frame>}; or {endInput: true} once the client has ended its input and the queue is empty, repeated until the relay posts /ended, and {endInput: false} otherwise; or {stop: true, reason}. POST /ack means the page accepted one input frame: the client gets `credit` with a running inputSequence, answer {ok: true}; an ack with nothing outstanding stops the stream. POST /ended means the page has taken the end of input: `input-ended` goes to the client, answer {ok: true}. POST /output {frames: [<base64>...], phase}: at most 128 frames, each the canonical base64 of exactly one frame; each is passed to the client as a `frame` descriptor plus its binary, waiting up to 2 s for room in the 8-frame output window; a `phase` of `stopped` or `failed` ends the stream; the answer is {stop: <true|false>}; a malformed body stops the stream and answers {stop: true}. POST /close ends the stream as `renderer-ended`, answer {ok: true}. These requests come from the playwright session process (page.request), not from the page's own network stack. The mock relays in audio-stream.test.ts:7 and scripts/audio-duplex-ffmpeg-smoke.ts:12 speak exactly this. Six small JSON routes, but they share state with the WebSocket side, and the 20 ms and 2 s waits have to behave the same."

