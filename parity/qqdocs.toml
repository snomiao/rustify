note = "Doubles in JavaScript's number format, index-like keys first, a repeated key keeping its first place and last value, JavaScript's escapes. The digits of a number are worked out from the definition in ECMAScript (the fewest that read back, the closest, the even one of two equally close) and no longer taken from Rust's own formatting, which takes the upper of two equally close spellings: the verification found 1459077941253781.25 written …81.3 where JavaScript writes …81.2. Checked by hand against bun on 3.2 million doubles. A string holding half a surrogate pair, a key `__proto__` and nesting deeper than 256 go back."

