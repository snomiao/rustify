[[feature]]
name = "codehost serve [dir]"
status = "missing"
ts = "src/cli/commands/serve.ts:76"
note = "Serves a workspace root: joins the token's room as a `root` server, starts `code serve-web` in the dir, bridges browser data channels to it, answers the provisioning routes (github.com is the default git host) and loads the agent-yes, preview and meta plugins. Options: -t/--token (required), --name (default the hostname), --signal, -d/--daemon, --port, --approve auto|confirm, --allow (repeatable). An explicit dir is resolved against the current directory and remembered; with no dir the remembered root is used and created if missing, else `no workspace root configured.` and two more stderr lines, exit 1. An explicit dir that does not exist is not created: serve remembers it, writes daemon.json, prints and opens the connect URL, and fails only when `code serve-web` is started there (bun is assumed to throw on a missing working directory; read, not run), which ends as a handler error with exit 1; the next bare serve creates it. With -d the daemon is started in the missing directory. In the foreground it runs until Ctrl-C; with -d it starts the daemon, announces the connect URL and exits 0 or 1."

[[feature]]
name = "remembered workspace root"
status = "missing"
ts = "src/cli/config.ts:41 rememberedRoot; src/cli/config.ts:47 rememberRoot; src/cli/commands/serve.ts:135; src/cli/commands/setup.ts:111"
note = "`serve <dir>` always saves the resolved dir as `root` in ~/.codehost/config.json, before the risky-root question; `setup <dir>` saves it only when the dir is not a git repo. A bare serve or setup reuses it and prints `no dir given — serving remembered workspace root <dir>` (setup: `using`). There is no fallback to ~/ws or to the current directory."

[[feature]]
name = "risky workspace root warning and confirmation ($HOME or /)"
status = "missing"
ts = "src/cli/commands/serve.ts:33 confirmRiskyRoot; src/cli/commands/serve.ts:54 rootWarning"
note = "serve and setup warn on stderr when the root is exactly the home directory (`warning: serving your HOME directory as the workspace root …`) or `/` (`serving the filesystem root …`). When stdin and stdout are both terminals they ask `serve it anyway? [y/N]`; anything but y or yes prints `aborted` and exits 1. Without a terminal they warn and go on, which is what a daemon does at every restart. `dev` has no such check."

