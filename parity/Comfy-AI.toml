# Parity ledger for Comfy-AI (npm package comfy-ai, command `comfy-ai`).
# Format and rules: parity/README.md.
#
# Written by reading the code at aa56999 (1.2.2), 2026-11-27, on the
# project's branch build/rustify-pipeline, whose crate (rs/) only hands every
# command back; read this ledger with `rustify audit Comfy-AI --at <that
# worktree>`. Nothing was run beyond --help: the only invocations were
# `comfy-ai --help`, a bare `comfy-ai` and `comfy-ai pair not-a-url`, in a
# throwaway home and directory, by hand and through the install smoke test.
# No daemon was started, no port was bound, no pairing URL was fetched and no
# test exists to cite, so every entry is `missing` and every note comes from
# the source.
#
# What was read, in full: ts/cli.ts, ts/config.ts, ts/protocol.ts,
# ts/serve.ts (1,017 lines), package.json, README.md and release.yml; and,
# for --help and --version, the parts of dist/cli.js (built at that commit
# with `bun run build`) that come from yargs 18.0.0 and y18n. Not in scope
# (keep_ts in projects.toml): ts/extension/, ts/userscript/ and ts/ui/, the
# browser extension and userscript, which run in a browser; and
# ts/mock-spa.ts, a development stand-in for the browser tab that the package
# does not ship. The browser panel connects to a PTY server at
# ws://localhost:7681/ws by default, which `comfy-ai serve` does not provide;
# package.json's description ("WebSocket PTY server CLI") is older than the
# bridge.
#
# How it fits together. The published command is dist/cli.js (`npm view
# comfy-ai bin`), a `bun build --target bun` bundle of ts/cli.ts with yargs
# inside it. `comfy-ai serve` is a relay daemon on 127.0.0.1:7437: browser
# tabs of the ComfyAI SPA connect to /spa, the CLI's other commands connect
# to /ctl, and GET /pair/<code> turns a code the tab shows into a token the
# CLI keeps in ~/.config/comfy-ai/state.json. The binary hands every
# invocation to dist/cli.js, unchanged, before it prints anything.
#
# Rust-only behaviour, with no TypeScript counterpart, for the owner to bless
# or remove (from the scaffold): COMFY_AI_NO_NATIVE=1 hands every invocation
# back; COMFY_AI_PACKAGE_ROOT tells the binary where the package is;
# RUSTIFY_HANDBACK_TRACE makes it say on stderr that it handed back.

reconciled = "aa56999"

# ───────────────────────────── The command ─────────────────────────────

[[feature]]
name = "comfy-ai (CLI entry point, run by bun)"
status = "missing"
ts = "package.json:7 bin; package.json:30 build:cli; ts/cli.ts:1; ts/cli.ts:273"
note = "The bin is ./dist/cli.js, built by `bun build ts/cli.ts --target bun` (release.yml runs the whole `bun run build`); its first line is `#!/usr/bin/env bun`. It needs bun: Bun.file, Bun.write, Bun.serve and `for await (const line of console)` have no node equivalent. yargs 18.0.0 is bundled into the file, so the installed yargs dependency is not what runs; the @xterm dependencies are for the browser builds only. yargs with script name `comfy-ai`, usage `$0 <command> [options]`, the nine commands in the order serve, pair, list, tail, attach, send, eval, kill, logout, then demandCommand(1), strict(), help(), version() and a fail() handler. Before the program, bun does what porting.md lists (.env files from the current directory, bunfig.toml, package.json and tsconfig.json above it)."

[[feature]]
name = "--help (global and per command)"
status = "missing"
ts = "ts/cli.ts:354; ts/cli.ts:275"
note = "yargs-generated help on stdout, exit 0: the usage line, `Commands:` with each command's describe text, `Options:` --help and --version (seen). Per command (`comfy-ai serve --help`) the command's positionals and options with types and defaults (`[number] [default: 7437]`, `[default: \"http://127.0.0.1:7437\"]` for list's --daemon, which follows COMFY_AI_DAEMON). Wrapped to the terminal's width, at most 80 columns. Always English in the bundle: y18n looks for its locale files at `../../../locales` from dist/cli.js (that is `<node_modules>/locales/`), finds none and falls back to the built-in strings, whatever LC_ALL, LC_MESSAGES, LANG or LANGUAGE say (read in dist/cli.js, not run under another locale). A trailing `help` word is yargs's (porting.md); not run."

[[feature]]
