# Parity ledger for bunto (command `bunto`). Format and rules: parity/README.md.
#
# Written by reading, 2026-11-27, at dec02fd (the head of main; the branch
# build/rustify-pipeline adds only the crate in rs/ and a workflow, so the
# TypeScript is the same there). Read in full: cli.ts, index.tsx,
# bunPMCommand.ts, notneed.ts, globWatch.ts, globMapFlow.ts,
# createIgnoreFilter.ts, nil.ts, arrayDiffs.tsx, mapReads.ts,
# promiseWithResolvers.ts, wait.ts, logError.ts, import-helpers.ts,
# builtins.ts, PartialUnion.ts (test-data/sub/*.ts are empty), package.json,
# bunfig.toml; the order in which yargs 17.7.2 (the version bun.lock pins)
# answers --help, validates and runs a handler (build/lib/command.js,
# yargs-factory.js); and bin/cli.js as `bun run build` bundles it at dec02fd.
# For the published release, index.ts and globflow.ts of e59f19b, from which
# 1.4.18 was published, were read too.
#
# Nothing was run beyond --help: `bunto --help`, `bunto i --help`,
# `bunto --version` and one usage error (`bunto --nope`), with bun from an
# empty directory with HOME, USERPROFILE and XDG_CONFIG_HOME pointing at a
# throwaway one, and the same help commands and usage error through rustify's
# install smoke test. The default command, `install` and `remove` were not
# run: they scan the current directory and start `bun install` and
# `bun remove` there. No test exists (`bun test || true`), so no proof is
# cited.
#
# How the two fit together. The Rust binary is meant to be the installed
# command; today it hands every invocation to bin/cli.js, a bundle of cli.ts
# that is a build product (not in git). So every feature here is `missing`.
#
# For the owner, before anything is ported:
# - main has never been published. Its semantic-release run failed, and npm's
#   1.4.18 is e59f19b. Between the two, index.ts became index.tsx and
#   bunAuto() was rewritten around @snomiao/glob-watch, unfinished: as read,
#   every command but help and version throws `ReferenceError: getDeps is not
#   defined` (index.tsx:50). The working scan of 1.4.18 is still in
#   index.tsx as useBunAuto(), which nothing calls and the bundle leaves out.
#   A port has to match one of the two; which one is the owner's decision.
#   The notes below say what each does.
# - package.json's exports, module and types name ./index.ts, which main no
#   longer has (and `files` ships only the root's .ts), so `import "bunto"`
#   from a release of main would fail.
# - Files that nothing reachable from cli.ts imports, and that have no
#   feature of their own: arrayDiffs.tsx, mapReads.ts, promiseWithResolvers.ts,
#   wait.ts, logError.ts, import-helpers.ts, builtins.ts, PartialUnion.ts,
#   createIgnoreFilter.ts, globMapFlow.ts. The audit counts them among the
#   784 lines to replace.
#
# Rust-only behaviour, with no TypeScript counterpart, for the owner to bless
# or remove (all from the hand-back helper, rs/src/js_fallback.rs v5):
# BUNTO_NO_NATIVE=1 hands everything back; BUNTO_PACKAGE_ROOT tells the
# binary where the package is; with RUSTIFY_HANDBACK_TRACE set it writes
# `rustify: handed back to the JavaScript` to stderr first; a binary without
# its package beside it says so and fails. Handed back, bin/cli.js starts with
# the runtime its first line names (bun), or node when there is no bun, and
# under node the bundle cannot run (it imports `bun`).

reconciled = "dec02fd"

# ───────────────────────────── Commands ─────────────────────────────

[[feature]]
name = "bunto / bunto auto (the default command)"
status = "missing"
ts = "cli.ts:13; index.tsx:38 bunAuto"
note = "Flags: -w/--watch (default false), --dry (false), -r/--remove (true), -i/--install (true); `-r` and `-i` are these flags here, while `r` and `i` alone are the commands. At dec02fd bunAuto() reads only `watch`: it starts three glob watchers on the current directory (see `watching`) and then throws ReferenceError at index.tsx:50, which yargs reports (see `errors a command throws`); exit 1, by reading. In 1.4.18 it scans once and acts: prints `[Bun Auto] v<version>`, `* Package <file>` for every package.json, `+ <file>0<deps as JSON>` for every source file (the `0` is index.tsx:243's `${+\" \"}`), `[Bun Auto] Watching... (-w=false to turn off watching mode)` when --watch is on (nothing is watched), runs the installs, then the removals, and prints `[Bun Auto] All done!`. With no flags that removes every dependency it judges unused."

