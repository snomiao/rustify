# The pipeline for a package whose commands stay JavaScript while its native
# binaries ride along in the platform packages ("bins": {}, "extra": [...]).
# The JavaScript finds its binary with templates/npm/native-binary.mjs, on all
# six platforms. Kept apart from ci.yml because both would upload artifacts of
# the same names within one run.

name: ci-extras

on:
  pull_request:
    paths-ignore: ["docs/**", "parity/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "parity/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-extras-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    uses: ./.github/workflows/rust-npm-build.yml
    with:
      # The toy's sources, as a crate inside the package's directory. The
      # package has no `files` list, so the packer must leave the crate out.
      manifest: tests/e2e/toy-extras/rs/Cargo.toml
      # toy-helper is built everywhere and shipped on Windows only
      # (extraPlatforms in the fixture's package.json).
      bins: toy toy-helper
      package: tests/e2e/toy-extras/package.json
      js-build: cp .rustify/templates/npm/native-binary.mjs tests/e2e/toy-extras/
      # `toyjs` is JavaScript; it prints what the native binary it found prints.
      smoke: toyjs --version
      # Starts with `--` on purpose: such a text has to survive as well.
      smoke-expect: --version"]
      # The toy echoes the first variable, and never prints the forbidden
      # text. The second is one the smoke test removes when it gives the
      # commands a home directory of their own: set here, it has to win.
      smoke-env: |
        RUSTIFY_PACKAGE_ROOT=from-smoke-env
        XDG_STATE_HOME=from-smoke-env
      # `package-files` lists what was installed as the package: no crate.
      # `where` says which variables hold the given text.
      smoke-extra: |
        toyjs probe => root=from-smoke-env !> no native binary
        [7] toyjs exit 7 => args=["exit", "7"]
        toyjs package-files => cli.mjs !> Cargo
        toyjs where rustify-smoke- HOME USERPROFILE => HOME:inside USERPROFILE:inside
        toyjs where from-smoke-env XDG_STATE_HOME XDG_DATA_HOME => XDG_STATE_HOME:inside XDG_DATA_HOME:unset
