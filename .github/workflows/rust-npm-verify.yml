# Reusable workflow: after publishing, install the release from the real npm
# registry on every OS and run it. Call it from the same run as
# rust-npm-build, after the publish job:
#
#   verify:
#     needs: [build, publish]
#     uses: snomiao/rustify/.github/workflows/rust-npm-verify.yml@releases/v1
#     with:
#       smoke: mycli --version

name: rust-npm-verify

on:
  workflow_call:
    inputs:
      smoke:
        description: "Command that must exit 0 and print the released version"
        required: true
        type: string
      smoke-expect:
        required: false
        default: ""
        type: string
      smoke-extra:
        description: "More commands, one per line, as for rust-npm-build: `<command> [args] => <text it must print>`, with the same markers (`[<exit code>]`, `[native]`, `[handback]`, `[real-home]`)"
        required: false
        default: ""
        type: string
      smoke-env:
        description: "Environment for the smoke commands, one NAME=value per line, as for rust-npm-build. Pass the same here, so that a line marked `[native]` is answered the way it was before publishing."
        required: false
        default: ""
        type: string
      registry:
        required: false
        default: https://registry.npmjs.org
        type: string
      scripts-ref:
        description: "Use the packer and smoke test from another ref of rustify. Default: the commit this workflow file was loaded from, so the two always match."
        required: false
        default: ""
        type: string

jobs:
  verify:
    name: verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.scripts-ref || job.workflow_sha }}
          path: .rustify
          sparse-checkout: templates/npm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Users run whatever bun they have: the latest, not the project's pin.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: npm-dist
      - name: Install from the registry and run
        shell: bash
        env:
          SMOKE: ${{ inputs.smoke }}
          EXPECT: ${{ inputs.smoke-expect }}
          REGISTRY: ${{ inputs.registry }}
          EXTRA: ${{ inputs.smoke-extra }}
          SMOKE_ENV: ${{ inputs.smoke-env }}
        run: |
          set -- --dist npm-dist --run "$SMOKE" --registry "$REGISTRY"
          if [ -n "$EXPECT" ]; then set -- "$@" "--expect=$EXPECT"; fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then set -- "$@" --also "$line"; fi
          done <<< "$EXTRA"
          while IFS= read -r line; do
            if [ -n "$line" ]; then set -- "$@" --env "$line"; fi
          done <<< "$SMOKE_ENV"
          # The registry can take a moment to serve a version it just accepted.
          for attempt in 1 2 3 4 5; do
            node .rustify/templates/npm/smoke.mjs "$@" && exit 0
            sleep 20
          done
          exit 1
