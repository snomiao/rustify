# ───────────── Proxying ─────────────

[[feature]]
name = "tunneled HTTP proxy to the local server"
status = "missing"
ts = "src/tunnel/host.ts:145 doHttp; src/cli/tunnel.ts:12; src/tunnel/protocol.ts:11 Op; src/tunnel/client.ts:149"
note = "At HttpReqEnd the daemon replays the request against http://127.0.0.1:<port><path> without following redirects (a 3xx passes through), then streams head, body and end back. Upstream statuses such as 404 pass through, requests on different stream ids run concurrently, and an unreachable upstream gives an Error frame. The local server is reached at 127.0.0.1 only. There is no way to cancel one stream: no opcode for it, the page's response stream has no cancel handler and WsClose applies to WebSockets only. When the consumer goes away (an iframe navigates, a fetch is aborted, an EventSource on an `ay serve` tail closes) the daemon keeps reading the upstream body and sending it, through the channel's queue and its 4 MiB window, until the body ends or the channel closes. A cancel opcode would be a compatible addition, but not exact parity. Needs a streaming HTTP client that neither follows redirects nor decompresses, and that treats headers as bun's fetch does. tunnel.test.ts: GET, a POST body and a response larger than a frame, 404, concurrency, an unreachable upstream."

