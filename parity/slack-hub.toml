[[feature]]
name = "send <target> <message>"
status = "partial"
ts = "ts/cli.ts:2471 cmdSend + dispatch ts/cli.ts:6662"
rs = "rs/src/main.rs:420 + rs/src/slack.rs:104 send"
note = "Both post chat.postMessage with text plus one markdown block, and both have --channel-id and --user-id. Different or absent in Rust: the confirm flag is --confirm, not --code (see the gate); the target must start with # or @ (TS also takes raw ids, permalinks and aliases); success prints `✓ Sent (ts: …)` where TS prints `✓ Sent: <permalink>`; an empty message is not refused; none of TS's other flags (--as-bot, --broadcast, --no-mentions, --to, --any-thread, --json, --fix-urls, --allow-url-adjacent); no sent-log record or message metadata. Rust runtime errors print as `Error: …`; TS maps Slack error codes to guidance."

[[feature]]
name = "confirm-hash safety gate (--code)"
status = "partial"
ts = "ts/cli.ts:1267 requireCode + ts/cli.ts:1167 safetyCode"
rs = "rs/src/main.rs:445"
note = "Rust gates only `send`, and differently: flag --confirm (TS --code on every gated command); hash = sha256(last 5 plain channel messages as ts:text + message), TS = sha256(channel id, thread ts, last message text, message as it will post, acting user id) so a code is bound to destination and identity; Rust prints the preview only when stderr is a terminal, TS always prints it on stdout; messages are `Rerun with --confirm=` / `Confirm hash mismatch. Expected:` vs `Rerun with --code=` / `Code mismatch (got …, expected …)`. Absent: the From: identity line, the destination label, thread-tail preview, terminal-control stripping of names. TS gates: send, reply, outbox flush, ask, poll, edit, tick, delete, upload, schedule send/rm, pinlog new/set/note, channel create/rename/invite, drafts edit/delete, todos add/done/edit/rm, lists create/add/set/share."

