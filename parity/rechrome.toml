note = "The gate in front of the browser, run by the client, by the daemon on the request, and once more when the action code is built. Upload object: only the keys name, contentType and data (an extra key such as hostPath is refused), name exactly `input.wav`, contentType exactly `audio/wav`, data canonical base64: non-empty, length a multiple of 4, decoding to 1..2097152 bytes and encoding back to the same text (so no newline, no missing padding, no URL-safe alphabet, no `data:` prefix, no stray bits in the last group). WAV: 44..2097152 bytes; `RIFF` at 0, `WAVE` at 8, the RIFF size field exactly length - 8 (one trailing byte is refused); chunks walked from offset 12, each with a complete 8-byte header and its data and odd-length pad byte inside the file; exactly one `fmt ` chunk of length 16 or 18 (18 only with a zero extension size), before `data`; format tag 1 (integer PCM) with 16 bits or 3 (IEEE float) with 32 bits; 1 or 2 channels; sample rate 8000..96000; block align = channels x bits / 8; byte rate = rate x block align; exactly one `data` chunk, non-empty, a whole number of frames; other chunks are skipped (an odd-length JUNK chunk with its pad byte is accepted, without the pad refused); at most rate x 30 frames (30 s exactly is accepted, one frame more is not); in a float file every sample must be finite (NaN and both infinities refused). WAVE_FORMAT_EXTENSIBLE, 8, 24 and 32-bit integer and more than two channels are refused here although the page's own parser would take them. Works on a view into a larger buffer (the byte offset is respected). Every rejection is `audio bridge: invalid PCM WAV` or `audio bridge: invalid audio upload`, neither ever shown. Pure byte checks with fixed bounds. Tests: audio-bridge.test.ts:142, :163, :188, :211."

