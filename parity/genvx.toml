[[feature]]
name = "plaintext store (--no-encrypt)"
status = "partial"
ts = "src/cli.ts:79; src/index.ts:558 resolveRemoteFiles"
rs = "rs/src/sync.rs pull_pairs; rs/src/args.rs"
note = "In the TypeScript `--no-encrypt` changes nothing: yargs reads it as `encrypt = false` and the program looks at an option named `no-encrypt`, so a key is still required and files are still encrypted. Rust takes the flag and likewise ignores it (cases `config: --no-encrypt does not lift the need for a key`, `push: --no-encrypt still encrypts`). Reading a plaintext store while a key is set is covered too, including the TypeScript's failure on new files (`ENOENT … .env.enc`). The spellings that do switch encryption off (`--noEncrypt`, `--no-encrypt=true`) go back, so writing plaintext is not ported."

