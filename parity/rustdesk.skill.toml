[[feature]]
name = "OCR backends: RDS_OCR, --lang, ocr/ocr.py, ocr/ocr-mac.py"
status = "verified"
ts = "src/ocr.ts:34 resolveBackend; src/ocr.ts:41 langArg; src/ocr.ts:104 runOcr; src/ocr.ts:128 ocrBuffer; src/ocr.ts:76 normalizeBoxes; ocr/ocr.py; ocr/ocr-mac.py"
rs = "rs/src/ocr.rs"
proof = "rs/parity.json (ocr: …, status: …); rs/parity/proof.sh"
note = "Backend: --ocr, else RDS_OCR (paddle or vision, any case; another value is ignored), else vision on macOS and paddle elsewhere. --lang for vision maps ja, en→en-US, zh/ch→zh-Hans and passes others on (an empty list gives ja,en-US); for paddle only the first language counts, en, ja→japan, zh/ch→ch, others passed on, ch when empty. The PNG is written to <temp>/rds-ocr-<pid>.png, which is never removed (a case shows it left), and `python3 <package>/ocr/<script> <png> <lang>` is run; the cases' python3 is a stand-in that checks the PNG's bytes. Paddle boxes are pixels, Vision boxes are fractions scaled by the PNG size; all rounded; confidence 1 when it is not a number. Failures: `OCR (<backend>) failed: <stderr, else unknown error>` (a signal included), `OCR (<backend>) produced non-JSON output: <first 200 units>`, `OCR script missing: <path>`, and without python3 bun's `Executable not found in $PATH: \"python3\"`, exit 1. A script whose output passes bun's mebibyte goes back before the first act (the JavaScript runs OCR again); after it (connect) it is `OCR (<backend>) failed: spawnSync python3 ENOBUFS (stdout or stderr buffer reached maxBuffer size limit)` when it was stopped, as in bun. A language named like a member of Object.prototype goes back; RDS_OCR is compared with two ASCII words, so any value is answered. The Python scripts stay as they are."

[[feature]]
name = "text matching (--contains, --nth)"
status = "verified"
ts = "src/ocr.ts:155 matchText; src/ocr.ts:169 boxCenter; src/connect.ts:46 findAny"
rs = "rs/src/ocr.rs match_text, box_center, find_any; rs/src/js.rs to_lower, lowercase_unsure; rs/src/unicode.rs"
proof = "rs/parity.json (click: …); rs/src/compare.rs lower_case_and_white_space_as_bun_has_them; rs/src/js.rs lower_case_comes_from_the_table; bun rs/unicode.gen.mjs --check"
note = "Trimmed and lower-cased with JavaScript's toLowerCase (full Unicode case mapping), exact by default, substring with --contains; --nth is 1-based; several matches without it take the first and warn. The centre is rounded with Math.round (halves go up). The lower case of each character comes from rs/src/unicode.rs, which rs/unicode.gen.mjs records from bun (1,488 lower cases, the code points its Unicode 17 assigns; its --check runs first in proof.sh), never from Rust's own tables, which follow the toolchain that builds the binary: a binary built with Rust 1.100 (Unicode 18) answers as one built with 1.97. rs/src/compare.rs compares every code point the binary answers with bun. In click, text goes back after OCR when it holds a capital sigma (whose lower case depends on its neighbours), a character of the blocks whose case pairs came with Unicode 14 or later (Cyrillic Extended-C of U+1C89 added: the one code point outside them whose lower case differs between Unicode 13, Python 3.9's tables, and bun's 17), a code point the table's Unicode does not assign (U+AB6C, which Unicode 18 makes a capital), or one where the building toolchain's tables disagree with the table (with Rust 1.100: 20 code points, U+A7DD, U+A7E2 and the 18 of the fourth pass, all of them unassigned in Unicode 17 anyway). connect's and status's own lookups always match by substring and try their candidate texts in order; their texts are ASCII, kana and CJK, which none of those characters lower-cases to in any runtime, so they are answered whatever is on screen (a Greek or Glagolitic remote desktop: v and r cases; 40,000 generated texts against bun in rs/src/compare.rs)."

