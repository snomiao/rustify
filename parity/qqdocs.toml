[[feature]]
name = "the call counter: ~/.qqdocs/usage.json, its lock, the inferred tier"
status = "verified"
ts = "src/index.ts:1685 loadUsage; src/index.ts:1694 localDateStr; src/index.ts:1722 withUsageLock; src/index.ts:1748 incrementUsage"
rs = "rs/src/usage.rs; rs/src/clock.rs; rs/src/env.rs fixed_zone"
proof = "rs/parity.json: the home directory compared in every case; the `ls:` cases on counting, pruning, the tiers and the lock; the `zone:` and `x machine: TZ=` cases the binary answers (34: UTC, Etc/UTC and every Etc/GMT±N), and, on Linux, `usage: the system's zone when TZ is not set`"
note = "Rust counts when the command has succeeded, the TypeScript after each call; the file is the same in the end. The count is kept per local day, which Rust works out by arithmetic for the zones that are a fixed number of hours from UTC (see the next entry for all others). For those, `usage calibrate` under bun and under the binary wrote the same file under all 28 of those zone names at 24 hours of the day, with the clock shifted by a preloaded library (672 runs by hand, over three calendar days, the binary answering every one). A counter file of another shape than the program writes goes back. Rust-only: on the first call ever the TypeScript waits two seconds for a lock file it cannot create (no ~/.qqdocs yet); Rust does not wait. Where the TypeScript's own count depends on timing, the cases do not compare it: two calls at once on that first run overwrite each other's count (`read`, `sync`: handed back), and when one of two calls at once fails the process ends while the other's count is still being written (lost, or a lock file left behind). The verification measured a third: with about a thousand calls at once (`ls -n 1000 --dates`) the TypeScript's lock gives up after two seconds and loses counts (946 of 1001), where Rust counts all."

[[feature]]
name = "the local day in a zone that is not UTC: every zone named after a place"
status = "missing"
ts = "src/index.ts:1694 localDateStr"
rs = "rs/src/env.rs fixed_zone"
note = "Found by the verification. JavaScript takes the local day from the zone data inside its runtime (ICU, in bun), not from /usr/share/zoneinfo; the two are of different releases and disagree wherever a zone's rules changed in between. For America/Vancouver, bun 1.4.0 and tzdata 2026b are an hour apart, and between 07:00 and 08:00 UTC the binary (which then read the system's files) counted calls on another day than the TypeScript. The binary cannot know which release a user's bun carries, so it now answers only where the zone is a fixed number of hours from UTC by its very name: TZ set to UTC, Etc/UTC, Etc/GMT+1…+12 or Etc/GMT-1…-14, or, on Linux, TZ not set and /etc/localtime a link to UTC or Etc/UTC (with /etc/timezone, if there is one, saying the same; on macOS TZ has to be set, see \"the zone of a Mac without TZ\"). Everything else goes back before anything is looked at, for every ported command, since each of them reads or writes the counter (43 cases): Asia/Shanghai, Europe/London, any other place; TZ in another notation; no link at /etc/localtime; and Windows altogether. This is the common case for a person's own computer: there the binary answers nothing yet. For the owner to decide: accept the system's zone files as the source of the day (one hour off, for part of the day, wherever the two data sets differ), or count by UTC day on both sides."

