[[feature]]
name = "audio stream client on the socket (connectPcmStream): hello, credit, ordered output acknowledgement, end reasons"
status = "missing"
ts = "audio-stream-client.ts:11 connectPcmStream; audio-stream-client.ts:22; audio-stream-client.ts:35; audio-stream-client.ts:42; audio-stream-client.ts:92; audio-stream-client.ts:110; package.json:67"
note = "The client half of the protocol, which is what `rech audio stream` does on the socket. It is also an export of the audio-stream-client.ts/.js files shipped in the npm package, connectPcmStream(ticket, consume, signal) giving {write, endInput, cancel, done}; no document names it as an interface, but a port that stops shipping that file removes the import. It opens the socket with no Origin header, sends `hello` on open (or cancels if already aborted), and waits up to 5 s for `ready`, which must repeat the ticket's input, output and inputWindowBytes; the starting credit is the whole window. `credit` must be exactly one frame and may not lift the credit above the window. A `frame` descriptor must arrive one at a time with sequence equal to the next expected, byteLength of one frame, sampleOffset = sequence x rate / 50, sourceId equal to the ticket's destination and destinationId equal to the ticket's source, and the next message must be a binary of that length. Frames are handed to the consumer strictly in order, and `output-ack {sequence}` is sent only after the consumer has finished with the frame, not when it was queued. `input-ended` is accepted and ignored; `closed {reason}` ends the stream with that reason; any other message, any broken rule or a consumer error makes the client send `cancel` and end as `cancelled`. write(frame): exactly one frame (`audio stream: invalid frame`), never two at once (`audio stream: concurrent input writes`), waits for credit, and fails with `audio stream: input closed` after endInput or a close. endInput sends `end-input` once (`audio stream: input write pending` while a write is waiting). cancel sends {type: `cancel`} when the socket is open. `done` gives the gateway's reason, or `cancelled`, `connection-error` (socket error), `disconnected` (closed without a `closed` message), or `slow-consumer` when received frames are not consumed within 2 s of the close. Before `ready`, any close fails the connect with `audio stream: connection closed`; the 5 s timer cancels first, so its own text `audio stream: handshake timed out` is never the error raised. An asynchronous state machine with strict ordering rules. Tests: audio-stream.test.ts:31 (output before EOF, half-close), :68 (a stalled consumer cannot block cancel), :100 (a delayed consumer still gets every frame before `done`)."

