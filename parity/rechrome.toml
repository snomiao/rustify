note = "feedWav(base64) parses the WAV again in the page with its own rules: wider on format (integer PCM of 8, 16, 24 or 32 bits or 32-bit float, 1-8 channels, 8-192 kHz, canonical base64, exact RIFF size, one fmt and one data chunk) and narrower on size (decoded size frames x channels x 4 at most the buffer limit, every sample finite and within -1..1). It builds an AudioBuffer, connects a buffer source only to the virtual microphone's destination - never to the speakers, with no decodeAudioData and no microphone fallback (audio-bridge-browser.test.ts:322 and :337: malformed input creates no AudioContext) - and starts it at max(now, end of the queue), so clips play back to back; a 16-bit sample is value/32768 (16384 becomes 0.5). The decoded bytes count as bufferedBytes until the clip ends, when its samples are zeroed and released (test :322: 640 bytes for 160 mono frames, 0 afterwards). Rejections: `Audio bridge wav.` for a bad or oversized file, bridge unaffected; more than 30 s queued (the caller gets `Audio bridge input-overflow.`) or 128 clips outstanding (`Audio bridge buffer-overflow.`): the bridge fails with code `input-overflow`; decoded size not fitting in the remaining buffer: `Audio bridge buffer-overflow.` and the bridge fails with code `buffer-overflow` (test :351); `Audio bridge busy.` while another feed is being set up; `Audio bridge stopped.` after stop or failure. Runs in the page: stays JavaScript."

