[[feature]]
name = "every command on Windows"
status = "missing"
ts = "bin/rustdesk-skill.ts"
rs = "rs/src/main.rs"
note = "On Windows the binary hands every invocation back before it does anything; none of the port is compiled there. The cases ran on a Windows 11 machine (the workflow is set to run them on win32-x64 too) and show that each reaches the JavaScript through the binary and behaves as bin/rustdesk-skill.ts run directly does (301 cases); 252 are skipped there: those that need a stand-in found on PATH (bun finds programs by PATHEXT and never runs rs/parity/run.sh's shell scripts, so playwright-cli by its name, python3 and xclip would be the machine's own), those on a pseudo-terminal, those whose stdout is a pipe made with mkfifo or /dev/full, and those whose report is more than the runner's own pipe takes there. The project's own test `file is created with mode 600` fails on Windows (no POSIX modes), as it did before the port."

