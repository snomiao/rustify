note = "Prints the `version` of the first package.json found walking up from the directory above the last `node_modules` in dist/cli.js's own path, or from the current directory when that path has no node_modules (a checkout); `unknown` when that package.json has no version or none is found. So an install with `bun i -g` reads ~/.bun/install/global/package.json, which has no version, and prints `unknown`; under `npm i -g` the walk starts at the prefix's lib/ and most likely finds nothing (`unknown`); in a development checkout it prints the version of whatever project the current directory is in. Read in dist/cli.js (yargs 18's esm shim and pkgUp), not run. Exact parity includes the `unknown`."

[[feature]]
