[[feature]]
name = "what bun does before the program"
status = "partial"
ts = "cli.ts:1"
rs = "rs/src/runtime.rs Runtime::startup; rs/src/runtime.rs bun_runs"
note = "bin/cli.js starts with `#!/usr/bin/env bun`. The binary imitates none of what bun, or the system as it starts bun, reads first; it answers only where that changes nothing, and hands back, before printing, where it could. Handed back: a `.env`, `.env.local`, `.env.development` or `.env.development.local` in the current directory (bun loads them; seen with YARGS_DISABLE_WRAP=1, which unwraps the help), a bunfig.toml there (a `preload` runs code first), ~/.bunfig.toml or $XDG_CONFIG_HOME/.bunfig.toml (bun 1.4.0 does not read those to run a file; handed back all the same), any BUN_* variable but BUN_INSTALL, __BUN*, NODE_*, MIMALLOC_*, ICU_* and YARGS_* variables (YARGS_DISABLE_WRAP unwraps the help, YARGS_MIN_NODE_VERSION makes yargs-parser throw), SIMDUTF_* (with SIMDUTF_FORCE_IMPLEMENTATION=1, fallback or anything the processor does not have, bun 1.4.0 and 1.4.2 on x64 hang and 1.4.5 stops with exit 134), the variables of the system's loader and libraries (glibc's ld.so reads LD_* and GLIBC_TUNABLES for bun and writes for LD_PRELOAD of a missing library, LD_AUDIT, LD_DEBUG, LD_SHOW_AUXV and a tunable it does not know, while the Linux binary is static musl and reads none; macOS's dyld reads DYLD_*, libmalloc Malloc* (MallocStackLogging writes two lines for bun and for /usr/bin/env, MallocScribble one on a terminal for every process, the binary included) and the Objective-C runtime OBJC_* (OBJC_HELP writes a page); glibc's MALLOC_* go back too, except MALLOC_ARENA_MAX, and macOS's MallocNanoZone, which are often set in a profile and were seen to change nothing), a current directory that has been removed (bun throws), a package directory bun cannot load from (`?` in its path, `\\` outside Windows), on Windows a TEMP or TMP that is not a directory (bun hangs there), and a bun on PATH that does not answer `bun --version` with a version from 1.1.13 up to, not including, 2.0.0 and nothing else, with exit 0, within 10 s (rs/src/runtime.rs bun_runs: none on PATH; a version manager's shim with no bun behind it, which bin/cli.js gets as `No version is set for command bun`, exit 126; a bun of another system or C library; a bun 1.0 or 2). That last question is asked of every native answer, last, by starting the bun on PATH once with its output kept: it costs a bun start of a few milliseconds (on a loaded Linux machine the binary answered `--help` in 5 to 16 ms, bin/cli.js in 96 to 135 ms; the install smoke test measured 6 ms). Seen to change nothing, and answered natively: package.json, tsconfig.json and jsconfig.json that are not JSON, here or above (bin/cli.js is a `// @bun` bundle), `.env.production`, `.env.test`, `.env.example`, a `.env` or bunfig.toml of the directory above, stdin, JSC_* variables, COLUMNS, an empty or relative HOME, a TMPDIR that is not there. Cases `gate: …` and `verify: …`; the variables of dyld come into the cases through rs/parity/run.sh's X_SET, as the runner's sh and env, protected programs on macOS, take them out of what they pass on. How common: a project that keeps a `.env` file gets every native answer handed back there. Not repairable by handing back, for the owner: on macOS dyld writes for the binary itself before its first line (DYLD_PRINT_LIBRARIES: its own list of libraries, then bun's), libmalloc too on a terminal, in the binary's name (MallocScribble: `bunto(<pid>,…) malloc: enabling scribbling …`), and with DYLD_INSERT_LIBRARIES of a missing library dyld stops the binary (exit 134), where bin/cli.js, started by /usr/bin/env, which macOS protects and which takes every DYLD_* away, never sees the variable; and the hand-back starts bun directly, not through /usr/bin/env, so on macOS bun gets the DYLD_* that bin/cli.js would not, and the lines env itself writes (`env(<pid>) MallocStackLogging: …`; on Linux env's ld.so line for LD_PRELOAD) are missing."

[[feature]]
name = "help, version and usage errors on a terminal"
status = "partial"
ts = "cli.ts:60"
rs = "rs/src/runtime.rs stdout_is_plain; rs/src/runtime.rs stderr_is_plain"
note = "yargs wraps its help to process.stdout.columns when stdout is a terminal under 80 columns, and bun makes console.error red when stdout or stderr is a terminal. On Linux and macOS the help and the version are native on a terminal at least 80 columns wide (TIOCGWINSZ), and handed back under that or when the width is not known; a usage error on a terminal is handed back. On Windows a console as stdout hands the help and the version back, and an error on a console too (no terminal there to prove anything on). Proven by the cases `tty: …` (80 columns, and 60, 79, 80, 200 set with stty) and by the whole file run with stdout and stderr on a terminal, on Linux and macOS. So `bunto --help` typed at a terminal is native on Linux and macOS, and not yet on Windows."

