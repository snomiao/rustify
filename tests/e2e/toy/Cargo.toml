[package]
name = "rustify-e2e-toy"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "toy"
path = "src/main.rs"

# Stands for a helper binary that only some platforms ship.
[[bin]]
name = "toy-helper"
path = "src/helper.rs"

# Stands for a JavaScript runtime in tests/handback.rs: prints its arguments.
[[bin]]
name = "toy-argv"
path = "src/argv.rs"

[workspace]
