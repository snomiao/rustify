# Parity ledger for slack-hub. Format and rules: parity/README.md.
#
# First full pass, written by reading the code (nothing was built or run):
#   TypeScript  ts/cli.ts main() (the yargs command tree, lines 5930-8914) and
#               the modules it calls
#   Rust        rs/src/main.rs and rs/src/slack.rs, in full
#
# search (slack-hub#119) and news (#120): `verified` means
# tests/parity.test.ts shows it. That test runs every case once per
# implementation in a fresh HOME against a fresh mock (tests/mock.ts) and
# compares stdout, stderr, the exit code, every
# request (with its Authorization and Cookie headers) and every file left
# behind; it runs in rustify's parity job against the binary just built, and a
# missing binary fails it. The shared machinery search needed (credentials,
# dotenv, the cache, errors, the message line) is complete but proven only
# through search and news, so those entries stay `partial`.
#
# The first Rust versions of read, thread, news, send and dump were moved to
# rs/src/legacy.rs, unreachable: the binary hands those commands back, so they
# are `missing` (parity/README.md). Their notes keep what that code did.

reconciled = "e315b19"

