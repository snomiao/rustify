status = "missing"
ts = "src/shared/repo.ts:95 parseDeepLink; src/shared/repo.ts:306 resolveRepoTarget; src/shared/repo.ts:352 resolveDevTarget; src/shared/repo.ts:369 resolveHostTarget; src/shared/repo.ts:389 pickRoomMatch; src/web/discovery.tsx:433; src/web/discovery.tsx:180"
note = "The path selects a workspace: `/<git-host>/<owner>/<repo>[/tree/<branch>]` on any machine, the same under `/<user>@<machine>` pinned to it (and provisioned there), `/<user>@<machine>/<path>` for a folder, `/<user>@<machine>` alone for that machine's settings. The legacy forms /gh/, /git/<host>/, /host/<hostname>[/<path>], /dev/<path> and `?machine=` are still parsed, because daemons of many versions print them. A repo link resolves to a repo daemon with the same key, then to a root daemon that listed the checkout, then to the preferred or deepest root with a path made from its layout; a machine pin never falls back; a folder link matches a served cwd or a listed workspace; a settings link matches a root daemon by hostname. Without a token the page uses its history, or searches every saved room for 6 seconds, preferring an exact match. The address bar is the source of truth: while it names a workspace that is not connected the page dials again when the roster changes and every 5 seconds, which is how a restarted daemon is found. src/shared/repo.test.ts pins the parsing and the resolution. Candidate to stay TypeScript; the CLI has to print paths this grammar accepts."

