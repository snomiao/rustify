# ──────────────── Situations the binary hands back (native elsewhere) ────────────────

[[feature]]
name = "lock show: answers the binary does not read as bun does"
status = "missing"
ts = "src/index.ts:62 postJson"
rs = "rs/src/http.rs; rs/src/client.rs show"
proof = "rs/parity.json lock: a redirect … lock: a 1xx before the answer"
note = "Handed back after the GET, so the server is asked twice (it only reads) and the user waits for both: a redirect, a Content-Encoding, a status line or header bun may read otherwise (an empty reason phrase, a status outside 200-599, a line that is no header, a 1xx), a body shorter than its length or a connection closed before the answer, an answer that has not come whole within 30 s (the binary's read timeout; bun waits longer: measured with an answer after 32 s, the TypeScript asks once and takes 32 s, the binary asks twice and takes 64 s, and prints the same), a body that is not UTF-8 or starts with a byte order mark, JSON with a number that is not an integer up to 2^53 (JavaScript's formatting is not ported beyond those) or half a surrogate pair, a 423 whose holder, label or expiry JavaScript cannot convert. A winrpc server's /lock answer is plain JSON, and its numbers are integers as long as the UI lock file holds integers: but `expiresIn` is worked out from that file's expiresAt, and the file is shared with other programs on the machine (entry `cross-process UI lock file`), whose pid and host the answer repeats as well. If one of them writes a fraction there (expiresAt as a float, a pid of 1.5), every `winrpc lock` against that server goes back after its GET, and asks twice, for as long as the file stays so. Another server at the URL may give any of these."

