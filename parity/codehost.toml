# Parity ledger for codehost (commands `codehost` and `ch`). Format and rules:
# parity/README.md.
#
# First full pass, 2026-11-27, written by reading the code at cfba919 (v0.40.0)
# in a clean read-only checkout. Nothing was run: not codehost, not a test, no
# daemon, no installer; nothing was installed and no network service was
# contacted (the signaling server at signal.codehost.dev is live and has real
# peers). Every note comes from the source and from what the tests assert; no
# test was seen to pass, so none is cited as a proof.
#
# What was read. Four readers each read a slice and listed what they found
# (about 330 findings, many seen from two or three sides); they are merged here:
#   commands  src/cli/index.ts, the ten files of src/cli/commands/, config,
#             registry, workspaces, init, daemonize, self-update, open-url, git,
#             proc, tempenv and their six test files, package.json, the release
#             and deploy workflows, README.md, CLAUDE.md, TODO.md, docs/, public/
#   daemon    rtc-daemon, run-server, provision-server, approver, oxmgr,
#             oxmgr-heal, fallback-daemon, vscode, vscode-install, tunnel, the
#             three plugin modules, src/server.ts, src/terminal-ws.ts
#   wire      src/tunnel/, src/shared/, src/provision/, packages/ws-provision/
#   web       src/web/, src/App.tsx, src/components/, worker/, the vite configs
# The merger then read line by line, before writing, the 45 files of the daemon
# and wire slices (the hand-over did not confirm them as read in full), and
# also every file under src/cli that is not a test, daemonize.test.ts,
# registry.test.ts, tempenv.test.ts, worker/index.ts, worker/room.ts,
# src/web/sw.ts, rtc-client.ts, room-client.ts, tunnel-host.ts, config.ts and
# history.ts, src/tunnel/transport.ts and rtc-datachannel.ts, public/, both
# workflows and package.json. One file on the hand-over list does not exist at
# this commit: src/provision/index.test.ts (the library's tests are
# packages/ws-provision/src/index.test.ts and git-auth.test.ts).
# Resting on one reader only, not re-read by the merger: src/web/discovery.tsx
# (1,981 lines; searched, not read), conn-broker.ts, conn-shared-worker.ts,
# tunnel-websocket.ts, src/components/Terminal.tsx, src/App.tsx, docs/ and
# TODO.md (searched), CHANGELOG.md, and the bodies of config.test.ts,
# init.test.ts and workspaces.test.ts (their test titles were read).
# Not in the checkout at all: node_modules. Two dependencies decide
# user-visible behaviour, @snomiao/daemon-kit (the TEMP/TMP repair, the pm2
# helpers) and oxmgr. Their versions 0.2.0 and 0.4.0 were read in bun's install
# cache on the reading machine, which matches package.json's ranges but is not
# the checkout; the notes that rest on them say so.
#
# Second pass, the same day and under the same rules: two critics listed the
# surface again from other angles (one by commands, environment reads,
# subprocesses, files and exits; the other by test titles, routes, wire
# messages and compatibility remarks). Their findings were merged, each one
# confirmed in the code or turned down, and the ledger brought up to them:
# four new entries, 33 existing ones extended or corrected. Claims that rest
# on a dependency read in bun's cache (yargs 17.7.2, daemon-kit 0.2.0, the docs
# in bun-types 1.4.5) or on runtime behaviour that was assumed, not run, say so
# in their notes.
#
# How it fits together. `codehost serve|dev|expose` is one foreground process
# (src/cli/run-server.ts). It starts the local target (`code serve-web` on a
# loopback port under /vs/<peerId>; for expose an existing port), joins the
# token's room on the signaling Worker over a WebSocket as a `server` peer, and
# answers the WebRTC offers of browser tabs. Every data channel a tab opens
# gets a tunnel host (src/tunnel/host.ts) that replays framed HTTP requests and
# WebSockets against the local port; `serve` first offers each request to its
# own routes under /__codehost/ (provisioning, provision-config, plugins).
# The page (src/web, served from codehost.dev by Cloudflare Pages, never by the
# daemon) is the other peer: its Service Worker turns /vs/<peerId>/* into
# tunnel requests. The Worker (worker/) only keeps the room roster and relays
# signals. `-d` and `setup` re-launch the same foreground command under a
# process manager: oxmgr (an npm dependency with a native binary), else pm2 or
# a Scheduled Task on Windows, else a background supervisor (unref'd, not
# detached). Machine state is under ~/.codehost; a served root keeps its
# provisioning hook in <root>/.codehost. packages/ws-provision is a separate library, exported as
# codehost/provision, of which the commands use only the git credential probes.
#
# Status. codehost has no Rust code, so every feature below is `missing`.
# Nothing is `dropped`: that is the owner's decision.
#
# Grain. One entry per command, per file the program keeps, per route, and per
# behaviour with its own module or test file. Minor flags and the environment
# variables that only switch one feature are in that feature's entry (the
# variable is in the entry's name). Tunnel frames are grouped by exchange
# (request, response, WebSocket open, messages, close, error), each opcode
# named. What only runs in the browser has one summarising entry per area, at
# the end. The legacy web terminal, which no command starts, has six entries.
# Repository tooling has no entries: the package.json scripts (cli, dev,
# dev:server, dev:signal, build, build:lib, deploy:signal, deploy:pages, start,
# test, typecheck), the release workflow (semantic-release publishes to npm on
# every push to main with no build, typecheck or test step) and the deploy
# workflow (page and Worker to Cloudflare on every push to main), the vite
# configs, portless.json and the three tsconfigs. What they mean for the
# published package is in the `npm package contents` entry.
#
# Candidates to stay TypeScript (the owner decides; nothing is `dropped`):
#   - the codehost.dev page: src/web, src/main.tsx, src/style.css, index.html,
#     the Service Worker, the SharedWorker, the page half of the tunnel
#     (src/tunnel/client.ts, rtc-datachannel.ts); runs in a browser
#   - the embeddable room client (src/web/room-client.ts, dist/room-client.js)
#   - the signaling Worker (worker/, already keep_ts)
#   - the shared modules the page and the Worker import, which therefore stay
#     whatever the daemon is written in: src/shared/signaling.ts,
#     signaling-client.ts, rtc.ts, token.ts, repo.ts, tags.ts and
#     src/tunnel/protocol.ts, transport.ts. A Rust daemon needs its own copy of
#     the daemon's part and both copies must be kept in step
#   - the five package.json exports and @snomiao/ws-provision: TypeScript
#     source that other JavaScript programs import (agent-yes's `ay ws` is
#     named as a consumer); a binary cannot satisfy an import
#   - the provisioning library behind codehost/provision (provision,
#     createBranch, forkWorktree, statusOf, watchStatus, parseSpec,
#     parseSource): no codehost command calls it; its default setup script runs
#     through Bun Shell
#   - the self-heals of npm native addons: node-datachannel (nothing to repair
#     once a Rust build links its own WebRTC stack) and oxmgr's binary inside
#     node_modules
#   - the pm2 backend on Windows (pm2 is a JavaScript program driven through
#     @snomiao/daemon-kit)
#   - help and usage-error text, which yargs writes and translates by locale
#   - the installers public/install.sh and install.ps1: already shell, they
#     change only with the install method
#   - the legacy web terminal (src/server.ts, src/terminal-ws.ts, src/App.tsx,
#     src/components/Terminal.tsx): whether it is part of the product at all
#
# Traps for an exact port, found while reading:
#   - every command, `--help` and `open --print` included, first loads the
#     native node-datachannel addon: index.ts imports serve, which imports
#     run-server, which imports rtc-daemon, whose top level loads it. A failed
#     load starts a download (prebuild-install) before any argument is parsed.
#     A Rust command has no such step, and the TypeScript may be run as the
#     reference only where the addon is already in place
#   - the running executable is taken to be bun and the script to be
#     src/cli/index.ts: the daemon command line (`<execPath> <argv[1]> serve
#     ...`), the supervisor command, the Scheduled Task .cmd, pm2, oxmgr
#     (`<execPath> node_modules/oxmgr/bin/oxmgr.js`), prebuild-install, oxmgr's
#     installer and the self-update (`<execPath> add -g codehost@<v>`). Those
#     command lines are already stored on users' machines (oxmgr's table,
#     ~/.codehost/daemons.json, tasks/*.cmd, pm2's dump) and keep starting bun
#     and the TypeScript entry until each daemon is launched again; a release
#     that moves src/cli/index.ts breaks them at their next restart
#   - oxmgr, prebuild-install and pm2 are found through node_modules
#     (require.resolve); self-update finds the package through the script's
#     own directory, and --version through yargs's own location (see that
#     entry). A native binary has neither
#   - a Rust copy of the shared modules is a second implementation of
#     JavaScript semantics: string length in UTF-16 units and JavaScript's \s
#     (token policy), encodeURIComponent's escape set (room URL, #t=,
#     user@machine), JSON.stringify leaving out undefined (absent fields are
#     omitted, never null), TextDecoder's lossy decoding. Two patterns use
#     lookaheads that the Rust regex crate does not have (src/shared/repo.ts:259,
#     packages/ws-provision/src/index.ts:163)
#   - the daemon decides whether its metadata changed by comparing JSON text,
#     so key order is behaviour; the room keeps about 2 KB per peer and a
#     larger hello makes the daemon vanish from the roster without an error
#   - the tunnel's HTTP client is bun's fetch: `decompress: false` (a bun
#     extension), no redirects followed, and its header casing and joining,
#     its statusText and its error strings (`proxy error: <text>`) reach the page
#   - the room token is stored and printed in clear: ~/.codehost/config.json,
#     daemon.json, the argv in daemons.json, the process command line
#     (`--token=`), on Windows the pm2 launcher
#     ~/.daemon-kit/launchers/<name>.cmd (never removed), the `room token:` and
#     `connect:` lines and so every daemon log. All files
#     are written with default permissions
#   - deployed daemons run many npm versions, and the page and the Worker are
#     deployed on every push to main, independently of npm: the signaling and
#     tunnel protocols allow additive changes only (CLAUDE.md)
#
# Found while reading (read, not run; under exact parity each is reproduced
# unless the owner decides otherwise):
#   - `codehost update` returns early when any `code` is on PATH, although
#     serve rejects a system `code` that cannot serve-web and uses the managed
#     one (commands/update.ts:12, vscode-install.ts:58)
#   - `serve <dir>` remembers the dir before the risky-root question, so
#     answering N to the HOME warning still leaves HOME remembered
#     (commands/serve.ts:138, :151)
#   - the daemon label splits the dir on `/` only: a Windows path becomes the
#     whole label, `/` gives codehost-server, the hostname fallback cannot be
#     reached (daemonize.ts:50); `expose -d` is named after the current
#     directory, not the port (commands/expose.ts:66)
#   - self-update accepts an npm global install but upgrades with
#     `<bun> add -g`, and compares versions as strings (self-update.ts:34, :37, :73)
#   - `list` can print the fallback daemons and then `No codehost daemons
#     running.` (commands/list.ts:22, oxmgr.ts:180)
#   - an approval prompt whose client has left stays on screen, and the next
#     line typed answers the next client in the queue (approver.ts:98, :142)
#   - comments promise `logon resurrect` for the pm2 backend; the code only
#     has pm2 save its list (fallback-daemon.ts:11, :106)
#   - a malformed tunnel frame throws inside an async handler that nobody
#     awaits (tunnel/host.ts:96, :109)
#   - the readiness wait throws without stopping the `code` it started
#     (vscode.ts:60); the managed binary is moved out of the temp directory
#     with a rename (vscode-install.ts:192), which fails across filesystems
#     under Node's semantics
#   - provisioning: neither the HTTP method nor the `host` parameter is
#     checked, a malformed config.yaml turns the allowlist off, the timeout
#     kills only the script's own process, the credential hint always probes
#     github.com
#   - the one-line installers run `codehost setup` with no dir: on a fresh
#     machine, outside a git repository, setup exits 1 (`no workspace root
#     configured.`) right after installing, although README says the
#     installer starts a server (public/install.sh:80, commands/setup.ts:71)
#   - the Ctrl-C / SIGTERM handlers exist only once VS Code has answered
#     (run-server.ts:87, :236), and a VS Code that exits after that goes
#     unnoticed while the daemon stays in the room (vscode.ts:60)
#   - `codehost open git@github.com:o/r` is taken for a `<user>@<machine>/`
#     path, not a repository (commands/open.ts:75)
#   - serve's proxy plugins receive the tunnel's forced `accept-encoding:
#     gzip` and probably relay bodies that bun has already inflated under a
#     `content-encoding: gzip` header (tunnel/host.ts:176, plugins/preview.ts:34)
#   - a signal sent while the signaling socket is reconnecting either vanishes
#     or, during CONNECTING, probably throws uncaught (signaling-client.ts:273)
#   - README.md is behind the code: its CLI section lists five of the ten
#     commands, says serve defaults to the current directory and that daemon
#     mode needs `npm i -g oxmgr`, and gives the frame limit as 16 KiB (64 KiB
#     in src/tunnel/protocol.ts:42). docs/provisioning.md calls the
#     .codehost/setup.sh hook future work and places setup-repo.sh in
#     src/provision/. README's development command `serve . -t test` is
#     refused by the token policy (README.md:118); the token it gives as an
#     example of what is rejected, `Str0ng-Token-99`, passes the policy and is
#     the tests' valid token (README.md:59); it says only setup self-heals the
#     native module that a bare bunx cannot fetch, but every command does
#     (README.md:51). docs/provisioning.md:114 says a hostile input cannot
#     escape ~/ws, which holds only for specs that came from the parsers.
#     packages/ws-provision/README.md:17 passes `wsRoot: "~/ws"`, which is not
#     expanded (it clones under a relative directory named `~`). TODO.md lists
#     ideas (serve --login, port-forwarding subdomains, docker up, presence)
#     that are not implemented and have no entries here

reconciled = "cfba919"

# ═════ The program ═══════════════════════════════════════════════════════════

# ───────────── Entry, parsing, help ─────────────

[[feature]]
name = "codehost (CLI entry point, run by bun)"
status = "missing"
ts = "src/cli/index.ts:17; package.json:12 bin"
note = "The bin `codehost` is ./src/cli/index.ts itself, a TypeScript file starting with `#!/usr/bin/env bun`: no build step, bun must be on PATH, node cannot run it. yargs with the script name fixed to `codehost` and the usage line `codehost <command> [options]` registers setup, init, serve, dev, expose, open, list, stop, update and the hidden __supervise, in that order. Its first import repairs TEMP/TMP; its imports then load the native WebRTC addon before any argument is parsed (see the header), for every command. Bun-only APIs are used throughout (Bun.which, Bun.spawn, Bun.sleep, Bun.listen, Bun.write, Bun.CryptoHasher, import.meta.dir)."

[[feature]]
name = "ch (second command name)"
status = "missing"
ts = "package.json:13"
note = "A second bin name for the same ./src/cli/index.ts. Help and usage still say `codehost`, because the script name is fixed."

[[feature]]
name = "no command, unknown command, unknown option, missing required option (exit 1)"
status = "missing"
ts = "src/cli/index.ts:30 demandCommand; src/cli/index.ts:31 strict"
note = "A bare `codehost` (`Specify a command, e.g. `codehost serve``), an unknown command or option, a missing required option (`Missing required argument: token`) or a value outside --approve's choices makes yargs print the help and the message on stderr and exit 1. yargs translates its own messages (`Missing required argument`, `Unknown argument`, `Invalid values`) by the locale (see --help), not codehost's demandCommand text. An error thrown inside a command's handler has its own entry. A failed native load is not one of them: it happens while the modules load, before yargs exists, and bun reports it without help (see `node-datachannel native module self-heal`). The wording and layout are yargs 17's; not verified by running."

[[feature]]
name = "error thrown inside a command: the command's help, a blank line, the error with its stack (exit 1)"
status = "missing"
ts = "src/cli/index.ts:35; src/cli/vscode.ts:84; src/cli/vscode.ts:99; src/cli/vscode-install.ts:47"
note = "Every handler is async. When its promise rejects, yargs 17.7.2 (read in bun's cache: build/lib/command.js:214-222, build/lib/usage.js:27-71) writes the failing command's full help to stderr, an empty line, then console.error of the Error object, which bun prints with its stack, and exits 1. Reached by: VS Code not ready in time or exited before it was ready, CODEHOST_CODE_BIN naming a missing file, no VS Code manifest and nothing cached, a failed archive download or checksum, a served directory that does not exist (see serve and dev), and `update` when its download fails. Under a daemon this help text lands in the log at every failed start, and the exit 1 is what oxmgr's on-failure, pm2 and the supervisor restart on. Read, not run."

[[feature]]
name = "--help / -h (help language: LC_ALL, LC_MESSAGES, LANG, LANGUAGE)"
status = "missing"
ts = "src/cli/index.ts:32; src/cli/index.ts:17"
note = "yargs-generated help, global and per command (`codehost serve --help`): each command's describe line, positionals, options, defaults, choices and the `ls` alias; `__supervise` is hidden. Exit 0. yargs translates its built-in headings and its own error messages into the language of the first of LC_ALL, LC_MESSAGES, LANG and LANGUAGE that is set, cut at the first `.` or `:`, default en_US (yargs-factory.js:1072-1080 in bun's cache), so the TypeScript's own output differs between machines and environments. Candidate to stay JavaScript."

[[feature]]
name = "--version"
status = "missing"
ts = "src/cli/index.ts:34"
note = "Prints the version yargs finds, exit 0. yargs 17.7.2 does not look in codehost's own directory: it starts from the directory above the last `node_modules` in its own path (lib/platform-shims/esm.mjs:24) and reads the first package.json found walking up from there, printing `unknown` when that has no version (yargs-factory.js:1082-1117; both read in bun's cache). That is codehost's package.json (0.40.0 at this commit) in a development checkout and wherever yargs sits in codehost's own node_modules. After `bun add -g codehost` with yargs 17 hoisted to ~/.bun/install/global/node_modules it is ~/.bun/install/global/package.json, which has no version, so it would print `unknown`, and probably likewise under bunx; on the reading machine another global package hoists yargs 18, so codehost's yargs 17 is nested and the version comes out right. Read, not run. A release stamps package.json (semantic-release), so a compiled-in version has to be kept equal to it, and exact parity would include the `unknown`."

[[feature]]
name = "option syntax accepted on every command (yargs parsing rules)"
status = "missing"
ts = "src/cli/index.ts:17; src/cli/daemonize.ts:86"
note = "yargs 17 parses `--flag value` and `--flag=value`, the short forms -t, -d, -f, -h, `--no-daemon`, camel-case spellings (`--newToken`), a repeatable and greedy `--allow` (it takes the bare words that follow it, a positional dir included), and `--port` as a number. A value that starts with `-` has to be given with `=`, which is why the daemon command line always uses `--flag=value`. From knowledge of yargs, not verified by running."

# ───────────── Commands ─────────────

[[feature]]
name = "codehost setup [dir]"
status = "missing"
ts = "src/cli/commands/setup.ts:27; src/cli/commands/setup.ts:108; src/cli/commands/setup.ts:132"
note = "One-shot onboarding. Picks the dir (explicit, else the current directory if it is inside a git work tree, else the remembered root, else three stderr lines and exit 1), asks about a risky root, resolves and prints the room token, makes sure a VS Code CLI exists (`checking VS Code…`, `using VS Code: <bin>`), scaffolds <dir>/.codehost when the dir is not a git repo (printing `scaffolded <dir>/.codehost (config.yaml + setup hook — edit freely)` when anything was written; this also creates a dir that does not exist yet) and remembers an explicit root, then always starts a background daemon (`dev` for a git repo, `serve` otherwise). It closes with an empty line, `✓ server \"<name>\" is live, serving <dir>`, the connect URL, an empty line, `try it:` and three lines `  · on that page this machine appears as a host — Connect opens VS Code`, `  · paste any github.com repo URL there — it clones into your workspace and opens` and `  · another machine? run the same installer there, then “+ Add” its token on the page` (curly quotes), the GitHub auth line and `manage: codehost list · codehost stop <name>`; every line but the empty ones starts with `[codehost] `. Options: -t/--token, --new-token, --name, --signal, --port, --approve auto|confirm, --allow (repeatable). Exit 1 on an invalid token, on `aborted`, or when the daemon could not be launched. It reports the server as live without checking that it registered, and `inside a git work tree` is true for any subdirectory of a repository."

[[feature]]
name = "setup: room token resolution (-t, saved token, --new-token, generated)"
status = "missing"
ts = "src/cli/commands/setup.ts:157 resolveToken"
note = "An explicit -t is trimmed, checked against the token policy and saved to ~/.codehost/config.json. Otherwise the saved token is reused, unless --new-token. Otherwise a token is generated and saved, and `generated a new room token (saved to ~/.codehost/config.json)` is printed. The saved token is not re-validated when it is reused."

[[feature]]
name = "generated room tokens"
status = "missing"
ts = "src/shared/token.ts:66 generateToken"
note = "24 characters, each a cryptographically random byte taken modulo a 59-character alphabet (upper case without I and O, lower case without l, digits 2-9, `-` and `_`), followed by the fixed suffix `aA1-`: 28 characters in all. A token may therefore start with `-`."

[[feature]]
name = "room token policy and rejection messages"
status = "missing"
ts = "src/shared/token.ts:42 validateToken; src/shared/token.ts:16 TOKEN_REQUIREMENTS; src/cli/commands/serve.ts:124"
note = "serve, dev, expose and `setup -t` trim the token and reject it unless it is 12 to 256 characters (JavaScript string length), has no whitespace (JavaScript's \\s), mixes at least 3 of lowercase, uppercase, digits and other characters, and is not one of changeme1234, password1234, codehost1234, letmein12345 ignoring case. On rejection two stderr lines and exit 1: `[codehost] <reason>` and `[codehost] room token requires: at least 12 characters, no spaces, mixing at least 3 of: lowercase, uppercase, digits, symbols`. The reasons: `token must be at least 12 characters`, `token must be at most 256 characters`, `token must not contain whitespace`, `token must mix at least 3 of: lowercase, uppercase, digits, symbols`, `token is too common; choose a unique secret` (reachable only through a case variant such as Changeme1234, since the listed strings have two character classes). The page and the Worker enforce the same function; `open` does not validate. No test file."

[[feature]]
