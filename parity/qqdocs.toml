note = "Method, address, Content-Type, Authorization and body are compared and equal. Not the same, and not compared: User-Agent, Accept-Encoding, Connection (see the top of this file). The client is ureq with rustls and Mozilla's roots, as bun brings its own roots; no proxy, no redirects. Never run against the real service."

[[feature]]
name = "errors from the service, and trying again with a back-off"
status = "partial"
ts = "src/index.ts:65 fetchWithRetry; src/index.ts:111; src/index.ts:1625 computeRetryDelayMs; src/index.ts:1637 parseRetryAfterMs"
rs = "rs/src/mcp.rs fetch, request, retry_delay"
note = "Reproduced only where the TypeScript catches the error and goes on: the dates of `ls --dates` and the title of `read` (35 cases the binary answers). There a JSON-RPC error, a status that is not 2xx, an answer that is not a JSON object and a result without content are the failure they are in the TypeScript (with the call counted or not as there), and 408, 425, 429, 500, 502, 503 and 504 are asked again up to four times, after the seconds Retry-After names or half a second doubled each time plus up to a quarter at random. Everywhere else the error ends the command and the TypeScript reports it in bun's words: Rust makes one attempt and hands the invocation back, and the JavaScript starts over (18 `service:` cases, and one or more per command). What that costs: the JavaScript repeats every call the binary had already made, so the service sees those twice plus the binary's one failed attempt, and only the JavaScript's calls are counted in usage.json. For a command of one call that is one request more; for `read` by title or `canvas read --all` it can be several calls that count against the day's quota twice. Common whenever the quota is used up or the token is wrong. Also handed back, in every place: no connection, a redirect, a Retry-After that is a date, a body that starts with a byte order mark."

