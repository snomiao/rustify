note = "Any of the four files bun loads from the current directory has to be in the plain subset (KEY=value, quoted or not, comments), whether or not it holds the token. `$VAR`, escapes, `export`, values over several lines, the same key twice, or a variable such as NODE_ENV, TZ, HOME, a proxy or QQDOCS_*: the invocation goes back (22 cases). Projects with elaborate .env files are common, so running qqdocs inside one may see no speed-up."

