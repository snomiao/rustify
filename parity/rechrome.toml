note = "With a valid bearer returns {share: <share label or absent>, profiles: [{key, name, registered}]} for the profiles this key may use (every registered profile for the management key); the name comes from Chrome's profile cache."

[[feature]]
name = "GET /sessions"
status = "missing"
ts = "serve.ts:814; serve.ts:763 liveSessions"
note = "With a valid bearer returns {sessions: [{session, profile, client, owner?, lastUsed, live}]}, newest first; the management key sees every session with its owner, any other key or device only its own; `live` means the session's .sock file exists in the CLI socket directory. Used by `rech session ls`."

[[feature]]
name = "GET /files/<path>"
status = "missing"
ts = "serve.ts:827; serve.ts:332 isUnderDir; serve.ts:854"
note = "With a valid bearer serves a file from ~/.rechrome/output as raw bytes. 403 `Forbidden` when the decoded path leaves the output directory (also through a symlink, checked on the real path), when the listener's profiles may not read it, when a device asks outside its own <profile output>/d-<device id>/ folder, or when the file is on the never-serve list; 404 `Not found` when missing. A request for .yml, .yaml, .json, .md, .txt or .log waits until no /run writing to that folder is in flight, then returns the text with known secrets and password lines masked (404 if the file was withheld meanwhile). Path containment must hold on Windows and through symlinks. Tests: serve.spec.ts:8, fill-secret.integration.test.ts:208."

[[feature]]
name = "POST /redeem"
status = "missing"
ts = "serve.ts:796; shares.ts:256 redeemInvite"
note = "Only an invite credential may call it (otherwise 400 {error: 'Only an invite link can be redeemed.'}). Body {name}: mints a device (its id derived from its new rech1_device_ token; the name stripped to word characters, space, dot, @ and -, 40 characters, default `device`; approved unless the share requires approval), reloads the shares at once so the device's room opens, logs `share <label>: invite redeemed by device <id> (<name>)` (with `, waiting for approval`), and returns {token, device: {id, name, approved}, share, profiles}; a refused redemption is 403 {error}. Writes under the shares lock."

[[feature]]
name = "share credentials on the HTTP API (invite or device)"
status = "missing"
ts = "shares.ts:184 credentialForBearer; shares.ts:239 authorizeCredential; serve.ts:779; serve.ts:746"
note = "A bearer that is not the listener's own key is matched in constant time against every share's invite and device bearers. An invite may only /ping and /redeem; a device may use what its share allows once approved; a share is refused on a transport it does not name (`not offered on this connection`); a refusal returns JSON {status: 1, stdout: '', stderr: '[rech] <message>', error, pending} with the refusal's HTTP status. An accepted credential narrows the request to the share's profiles and tags its sessions `share:<share id>:<device id>`. The listener's own key keeps working. The access check: it must agree exactly. Tests: shares.test.ts, share-webrtc.integration.test.ts. When a device credential is used, its lastSeen in shares.json is updated at most once every 10 minutes per device, under the shares lock; a failed write is only logged."

# ───────────── Running a command ─────────────

[[feature]]
name = "browser commands are run by the vendored playwright-cli, under node"
status = "missing"
ts = "serve.ts:1319; rechrome.ts:2959"
note = "Every browser command is a child process of the vendored playwright-cli fork, run under node and never bun (the extension relay's WebSocket handshake hangs under Bun), in the output folder with stdin closed; the daemon only builds argv, env and cwd for it. The CLI and its patched playwright-core stay JavaScript (vendor/ is unpacked from vendor-src/ at install; no browser download). What it writes itself is its own, for example the .bridge.jsonl connection diagnostics under ~/.cache/ms-playwright/bridge or PLAYWRIGHT_MCP_BRIDGE_LOG_DIR (README.md:715). What a Rust daemon has to port is the spawn."

[[feature]]
name = "PLAYWRIGHT_CLI and which playwright CLI the daemon uses"
status = "missing"
ts = "rechrome.ts:2882 resolvePlaywrightCli; rechrome.ts:2858 playwrightCliIsUsable; serve.ts:344 splitCommand; serve.ts:722"
note = "PLAYWRIGHT_CLI (a full command string) wins, then `lib/playwright-cli/playwright-cli.js` in a checkout, then `vendor/playwright-cli/playwright-cli.js` from the npm tarball, then the bare `playwright-cli-multi-tab` on PATH. A lib/ or vendor/ entry counts only if `playwright-core/lib/tools/cli-client/program` resolves from it (Node module resolution through an exports map), so a half-built submodule falls through; on Windows the result is prefixed with `node `. The command is split into argv on whitespace, with double-quoted segments kept whole so that an interpreter path with spaces survives. The candidate paths are relative to the JavaScript package root. Tests: resolve-cli.test.ts, rechrome.spec.ts:204."

[[feature]]
name = "playwright CLI child environment and socket directory (PLAYWRIGHT_SOCKETS_DIR)"
status = "missing"
ts = "serve.ts:233 playwrightCliEnv; serve.ts:263 tmpSocketRoot"
note = "Every CLI child gets only PATH, HOME, USERPROFILE, TMPDIR, DISPLAY, XDG_RUNTIME_DIR, DEBUG, PWDEBUG, the call's overrides and PLAYWRIGHT_SOCKETS_DIR. On macOS the socket directory is forced to PLAYWRIGHT_SOCKETS_DIR or /tmp/pw-<uid>, created 0700, and refused (`Refusing unsafe Playwright socket directory: ...`) if it is a symlink or owned by someone else. Sessions' sockets are `<PLAYWRIGHT_SOCKETS_DIR or TMPDIR/pw-<8 hex of sha1(user or 'default')>>/cli/<session>.sock`, which has to match the vendored CLI's own rule. Test: serve-sockets.test.ts."

[[feature]]
name = "tab-group name and extension mode for the CLI child (PLAYWRIGHT_MCP_CLIENT_NAME, PLAYWRIGHT_MCP_EXTENSION)"
status = "missing"
ts = "serve.ts:44 shortClientLabel; serve.ts:1275"
note = "The child gets PLAYWRIGHT_MCP_CLIENT_NAME = the client's label shortened for the tab strip (at most 7 characters): `host/owner/repo#<basename>@<branch>` gives the first 3 letters of each joined by `:` (`mai:fea`), a legacy `.../repo/tree/branch` URL gives `rep:bra`, `host:/path/to/dir` gives `dir`, anything else is cut to 7 characters; and PLAYWRIGHT_MCP_EXTENSION=1 whenever extension id and token are present. Test: rechrome.spec.ts:276."

[[feature]]
name = "profile name or email resolved to a Chrome profile folder on the daemon"
status = "missing"
ts = "serve.ts:372 resolveProfileDirectory; serve.ts:360 ProfileResolutionError; serve.ts:1203"
note = "On the management listener PLAYWRIGHT_MCP_PROFILE_DIRECTORY may be an email, display name or folder. `Default` and `Profile N` pass through; a registered profile uses the folder recorded in ~/.rechrome (never Chrome's own files, which macOS may guard); otherwise Chrome's Local State (macOS, Linux and Windows locations) is searched for a matching name, user_name or gaia_name (logged as `profile resolved: \"a\" → \"b\"`). If Local State exists but cannot be read the command is refused with status 1: `[rech] cannot find the Chrome folder for profile \"X\": <path> is unreadable (...). Refusing, so Chrome does not create a new empty profile named \"X\".` plus the fixing commands; a missing Local State lets the name through unchanged. Test: serve.spec.ts:201."

[[feature]]
name = "open without a registered profile is refused (no silent headless browser)"
status = "missing"
ts = "serve.ts:1218"
note = "`open` (with or without a URL) without extension id + token and without a managed user-data-dir returns status 1: `[rech] profile \"<p>\" has no extension token on this machine, so rech would open a separate headless browser instead of your Chrome. Refusing.` plus `Register it: rech setup --profile \"<p>\"`, or `[rech] no Chrome profile selected...` plus `Pick one: rech --profile <email> open <url>, or add ?profile=<email> to RECHROME_URL`; both end with `Registered here: <keys>` or `No profiles are registered here yet: rech setup`. With an extension id and token in the request env, open goes through. Test: headless-guard.test.ts."

[[feature]]
name = "open on the daemon: about:blank by default, a stale session socket removed first"
status = "missing"
ts = "serve.ts:1191; serve.ts:1305"
note = "A bare `open` gets `about:blank` appended so that the extension's connect page is not left showing. When the command is still `open` (not rewritten to goto), a leftover `<session>.sock` in the CLI socket folder is deleted and logged as `Removed stale socket: <path>`."

[[feature]]
name = "open on a session that already has tabs: the tab list, or goto"
status = "missing"
ts = "serve.ts:1236; rechrome.ts:2359"
note = "Before `open`, the daemon runs `tab-list` on the session (5 s limit). If tabs exist, a bare `open` returns the tab list with stderr `[rech] session \"<id>\" already has open tabs:` and `existingSession: true`, and `open <url>` is rewritten to `goto <url>` to reuse the live browser. The client, on `existingSession`, reruns `open <url>` as `goto <url>` itself (for older daemons) and for a bare open prints `[rech] session already has open tabs — listing existing tabs instead of opening a new window`."

[[feature]]
name = "60-second command timeout; POST requests are not cut off before it"
status = "missing"
ts = "serve.ts:1319; serve.ts:114 RUN_IDLE_SECONDS; serve.ts:1539"
note = "After 60 s the CLI child is killed and the reply is status 1 with stderr `Command timed out after 60s`. POST requests get an idle limit of 150 s (the client's 70 + the 60 s maximum recording + 20) in place of the server's default 10 s."

[[feature]]
name = "a silent extension handshake failure is reported as an extension timeout"
status = "missing"
ts = "serve.ts:215 inferSilentExtensionFailure; serve.ts:1352"
note = "When an `open` with extension credentials exits non-zero with no stdout or stderr after roughly the handshake timeout (PWMCP_TEST_CONNECTION_TIMEOUT, default 30000 ms, minus 1 s), the daemon supplies stderr `Extension connection timeout after <N>ms. Automatic recovery retry failed; reload the Playwright MCP Bridge extension at chrome://extensions and retry.`; real stderr and fast failures are left alone. A pure function; test: serve.spec.ts:56."

[[feature]]
name = "output files listed in the reply (files)"
status = "missing"
ts = "serve.ts:1421; serve.ts:1502"
note = "File names ending in png, jpg, jpeg, pdf, json, yml or yaml mentioned in the command's output are returned in `files` when they exist under the work folder, or by basename under `.playwright-cli/` or `.playwright-cli-multi-tab/`; paths use forward slashes and carry the profile/device prefix so that a Windows daemon can serve a POSIX client."

[[feature]]
name = "browser downloads go to the client once, are logged, then deleted on the host"
status = "missing"
ts = "serve.ts:156 reportedDownloads; serve.ts:146 DOWNLOADED_LINE; serve.ts:1443; serve.ts:841; serve.ts:112"
note = "A download is recognised only from a `- Downloaded file <name> to \"<path>\"` line inside the CLI's own `### Events` section and only under `.playwright-cli/` or `.playwright-mcp/`, written during this command, a regular file inside the work folder (page text that imitates the line, or a symlink out of the folder, is neither forwarded nor deleted). It is added to the reply's `files` and logged as `download: {listener, name, size, sha256, kept}`. The host copy is streamed to the first /files request and deleted when fully sent or when the client hangs up, or after 10 minutes if never fetched; a listener with keepDownloads keeps it. Tests: serve-downloads.test.ts, share-all.integration.test.ts:189."

[[feature]]
name = "`npx playwright-cli` renamed to `rech` in output"
status = "missing"
ts = "serve.ts:1495"
note = "Every `npx playwright-cli` in stdout and stderr is replaced by `rech` before the reply is sent."

# ───────────── Shares on the daemon ─────────────

[[feature]]
name = "shares.json reload every second, expiry and revocation"
status = "missing"
ts = "serve.ts:1611; serve.ts:1644"
note = "Shares are read again every second, independently of listeners; time-based expiry counts as a change. Sessions owned by a revoked share, an expired share or a removed device are closed with the CLI's `close` and logged (`closed session <id> of <label>: its share was revoked or its device removed`). A bad file keeps the previous shares (`shares.json rejected: ...` at startup, `shares.json reload rejected; previous shares retained: ...` later)."

[[feature]]
name = "WebRTC rooms kept open per share credential"
status = "missing"
ts = "serve.ts:1635; shares.ts:290 webrtcCredentials"
note = "For every live share credential (the invite and each device) the daemon keeps one room open on each WebRTC listener the share names (a saved one, the built-in default or the legacy `webrtc`), with that listener's signal server and STUN/TURN servers, labelled `<share>/<device> via <listener>` or `<share> (invite) via <listener>`; shares over sockets only are skipped. A used or expired invite keeps its room so that a taker hears `already used` or `expired`, not `host offline`. Logs `webrtc: listening for N share credential(s) in M room(s)`. Test: rtc-listeners.test.ts:83."

