proof = "rs/parity.json; rs/parity/args.mjs; rs/parity/proof.sh"
note = "Native on Linux, macOS and Windows (proven on each; parity-platforms runs the cases on linux-x64, darwin-arm64 and win32-x64; rs/src/runtime.rs platform_is_proven makes it native on linux-arm64, darwin-x64 and win32-arm64 too, where the pipeline runs only the smoke lines, not the cases): yargs 17's four texts (the top level, which the default command reached without its name shows too; `auto`; `install`; `remove`), exit 0, for every command line of plain words and flags that asks for help: --help or -h anywhere, or `help` as the last word, with yargs's two parses modelled (an option the top level does not know takes the next word as its value, so `--dry help` is the default command's help and `i help -w foo` an error). Seen: the top-level help lists the commands auto [default], remove [aliases: r], install [aliases: i], three examples, and of the options only -v, -h and `--dry [boolean] [default: dry run mode]`; `bunto i --help` shows `bunto install`. LANG, LC_ALL, LC_MESSAGES and LANGUAGE change nothing while the locale is a plain name in a short path (y18n finds no translations beside the package); a longer or odder one goes back, see `the help in the user's language`. Each native answer first asks the bun on PATH for its version (see `what bun does before the program`). Handed back: see `help, version and usage errors on a terminal`, `what bun does before the program`, `the help in the user's language` and `spellings of the command line only yargs reads`."

