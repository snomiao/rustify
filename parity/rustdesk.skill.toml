[[feature]]
name = "in a JavaScript project: package.json, tsconfig.json or jsconfig.json here or above; bunfig.toml"
status = "partial"
ts = "bin/rustdesk-skill.ts:1 #!/usr/bin/env bun"
rs = "rs/src/runtime.rs plain_project_file"
proof = "rs/parity.json (runtime: project file: …, runtime: package.json here, runtime: tsconfig.json here); rs/parity/proof.sh"
note = "bun reads package.json, tsconfig.json and jsconfig.json in the current directory and every directory above it, and bunfig.toml here and in the user's configuration, and says on stderr what it does not like in them (seen: a syntax error, `Duplicate key`, a `type` it does not know, a bad `paths` pattern). The binary answers when each of those files is plain: strict JSON, an object, no name given twice at any depth, in package.json a type of module or commonjs if any and no exports, imports or browser, in the others no extends and no paths, jsxFactory, jsxFragmentFactory or importsNotUsedAsValues in compilerOptions (17 cases: typical files here and above, in a git repository). Anything else goes back, valid or not: comments and trailing commas (common in a tsconfig.json), exports in a package.json, an extends, and any bunfig.toml. So inside many real projects users still get the JavaScript."
