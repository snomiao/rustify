# Parity ledger for qqdocs. Format and rules: parity/README.md.
#
# Written with the port, on the project's branch build/rust-port (the crate
# is rs/ there; read this ledger with `rustify audit qqdocs --at <that
# worktree>`). The TypeScript was read in full at ea064c4 and is untouched:
# bin/qqdocs.ts, src/index.ts, src/env.ts, src/config.ts.
#
# How the two fit together. The Rust binary is meant to be the installed
# command. It answers the commands that only read (and `usage`), in the plain
# spellings of their arguments; every other invocation goes to bin/qqdocs.ts,
# which bun runs as before. Status here is what the binary does on its own,
# so what goes back is `missing`.
#
# Where the binary answers at all. Only on a machine it can vouch for, and
# that is a small part of the machines today. All of these have to hold:
# - the machine is Linux or macOS, not Windows;
# - neither standard output nor standard error is a terminal;
# - the machine's zone is UTC by name: TZ is UTC, Etc/UTC or Etc/GMT±N, or,
#   on Linux only, TZ is not set and /etc/localtime links to UTC (on macOS
#   the binary takes the zone from TZ alone);
# - there is no package.json, tsconfig.json or jsconfig.json in the current
#   directory or in any directory above it;
# - no proxy, NODE_* or BUN_* variable, no bunfig.toml, and any .env file and
#   config.yaml in the plain forms.
# So: CI jobs, containers and servers that run in UTC, outside a JavaScript
# project, on Linux or macOS. A person's own computer, set to the zone they
# live in, gets the JavaScript for every command, as does any command run
# from inside a JavaScript or TypeScript project, and every command on
# Windows. Each of these has its own entry below with the reason; the second
# and third were added after an independent verification showed the binary
# answering differently there.
#
# Per system. Linux x64 and macOS arm64: native as above, and proven there by
# the parity job, which runs the cases on linux-x64, darwin-arm64 and
# win32-x64. A `verified` below holds for those two. Linux arm64 and macOS
# x64 run the same code and are native too, but only the install test runs
# there. Windows x64 and arm64: every invocation is handed back; the parity
# job on win32-x64 shows that it is (see "the ported commands on Windows").
#
# What stays in the JavaScript, and why. Every command that creates, changes
# or deletes something. The TypeScript reports a failed call through yargs:
# the command's help, then the error as bun prints it, with a source excerpt
# and a stack trace of the installed files. That text cannot be reproduced,
# and after a write the invocation can no longer be handed back (the
# JavaScript would write a second time). For a command that reads, handing
# back is safe: nothing has been printed, counted or stored, and the
# JavaScript asks the service again (see "errors" for what that costs).
#
# Proofs. The parity job runs them on linux-x64, darwin-arm64 and win32-x64
# (parity-platforms), through rs/parity/proof.mjs, against the binary built
# for each. Seen passing by hand on 2026-11-27, at build/rust-port 83c419c,
# with the runner of rustify's releases/v1:
# - Linux x64 (glibc build), bun 1.4.0, node 20: everything below.
# - macOS arm64, bun 1.4.4. node is bun on that Mac, so there the runner and
#   the stand-in ran under bun, where CI runs them under node 24.
# - Windows x64, node 24.8, bun 1.4.2, Git for Windows' bash for the lines.
# What they are:
# - rs/parity.json (written by rs/parity.gen.mjs; `--check` in the job): 910
#   cases through rustify's parity runner, TypeScript against TypeScript
#   first, then TypeScript against the binary. 304 of them, named `x …`, were
#   written by the verification. No case reaches the service:
#   rs/parity/with-mock.mjs runs each side against a stand-in on 127.0.0.1
#   that answers from the case's own script and records every request. The
#   TypeScript, whose endpoint is a constant, is pointed there by a bun
#   preload (rs/parity/seam.ts) that also ends the process on any other
#   address (on Windows through BUN_OPTIONS; `with-mock.mjs --check` fails
#   the job unless bun loads it); the binary by QQDOCS_PARITY_MCP_URL.
#   Compared: stdout, stderr, the exit code, every request (the body byte for
#   byte, Content-Type, the token, which calls went out at the same time) and
#   everything under the home directory (names, modes, contents; listed by
#   rs/parity/home.mjs). Normalised: the two timestamps the program writes
#   itself (`cachedAt`, `syncedAt`). Six cases leave the home directory out:
#   in five the TypeScript's own count there depends on timing (see "the call
#   counter"), in one HOME is empty.
#   Linux: 910 of 910 the same, both ways. macOS: 910 of 910, both ways.
#   Windows: 905 of 905 the same, both ways (at 0986ece, the cases as now but
#   for the probe that ages three lock files); the five cases that make a
#   symbolic link are skipped there. At 83c419c the job's command on Windows
#   gave 902 of 905 the same: in three cases Git Bash wrote "could not find
#   /tmp" into an `after` line of one side, as other people's Git Bash
#   processes on that machine share its mount table; run again, all three
#   were the same.
# - the same cases with `--handback QQDOCS_PACKAGE_ROOT=bin/qqdocs.ts`, which
#   shows who answered, each case as its mark says for the system it runs on.
#   Linux: 567 answered by the binary, 343 handed back. macOS: 566 and 344
#   (`usage: the system's zone when TZ is not set` goes back there, see "the
#   zone of a Mac without TZ"). Windows: 0 and 905, 5 skipped. Of the 343
#   handed back everywhere, 255 go back at once (a command that is not
#   ported, a spelling that is yargs's, a state of the machine) and 88 after
#   the stand-in answered with something the binary leaves to the
#   TypeScript; those compare which requests were made, not how many. A
#   `verified` below rests only on cases the binary answered. On Linux the
#   TZ case is answered only where the machine's own zone is UTC, as on this
#   machine and on the Linux runners of CI.
# - `cargo test` in rs/: 28 unit tests (one of them the hand-back helper's
#   own) and rs/tests/handback.rs (13 tests with the binary alone and a
#   stand-in bun, Unix only) for what the cases cannot set up. All pass on
#   Linux and macOS; on Windows the 28.
# - run once by hand, on Linux, not part of CI: number_to_string against
#   bun's own spelling of 3.2 million doubles (ties, powers of two and their
#   neighbours, subnormals; no difference); the argument gate against the
#   project's own yargs chain on 120,000 generated command lines (the
#   verification's harness; 26,424 taken by the binary, no difference);
#   `usage calibrate` under every zone name the binary answers for at 24
#   shifted hours of the day (672 runs, the same file each time; see "the
#   call counter").
# Found on the Mac, and repaired in the cases, not in the binary: GNU `stat
# -c` and `touch -d` do not exist there (three cases were BROKEN, and the
# modes compared nothing); and the stand-in, under bun, answered a closed
# connection of a held request with "200 OK" (bun's res.destroy()), so one
# case differed and one was answered by the binary. with-mock.mjs now closes
# the socket itself, the same under node and bun.
#
# Not covered by any proof: the real service (never contacted), a terminal,
# Linux arm64, macOS x64 and Windows arm64 (only the install test runs
# there), the musl build the pipeline ships (built in CI only; this machine
# has no C compiler for it; the parity job runs whatever the pipeline built
# for linux-x64), bun versions other than 1.4.0, 1.4.4 and 1.4.2, and the
# runner under node on a Mac (CI does that).
#
# Rust-only behaviour, with no TypeScript counterpart, for the owner to bless
# or remove:
# - QQDOCS_NO_NATIVE=1 hands every invocation back (the template's way out).
# - QQDOCS_PACKAGE_ROOT tells the binary where the package is.
# - RUSTIFY_HANDBACK_TRACE set to anything not empty makes the binary write
#   `rustify: handed back to the JavaScript` to stderr when it hands back
#   (hand-back helper v5; the install test's [native] and [handback] marks
#   read it). The JavaScript is started without the variable.
# - QQDOCS_PARITY_MCP_URL replaces the endpoint, for the parity cases. It is
#   compiled into the release binary, because the cases run against the
#   binary that ships. Only `http://127.0.0.1:<port>/…` is accepted; with any
#   other value a ported command prints one line and exits 2 without
#   contacting anything. Whoever can set it in a user's environment makes
#   the binary send that user's token, in clear text, to a port on the same
#   machine. And it is the binary's alone: when a command is handed back
#   while it is set, the JavaScript knows nothing of it and asks the real
#   service (the cases prevent that with a bun of their own on PATH, and on
#   Windows with BUN_OPTIONS).
# - A binary without the npm package beside it answers what it would hand
#   back with one line and exit code 1.
# - A panic before anything was printed or written hands the invocation back.
# - What the service can see: the binary's requests carry
#   `User-Agent: qqdocs/<version>` and `Accept-Encoding: gzip`, where bun
#   sends `User-Agent: Bun/<version>`, `Accept-Encoding: gzip, deflate, br,
#   zstd` and `Connection: keep-alive`. Method, address, Content-Type,
#   Authorization and body are the same (compared in every case).
# - A command that is handed back after it has asked the service asks again
#   from the start in the JavaScript, and the binary's own calls are not in
#   usage.json (see "errors").
# - The first call ever does not wait two seconds (see "the call counter").

reconciled = "ea064c4"

