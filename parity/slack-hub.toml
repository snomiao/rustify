# Parity ledger for slack-hub. Format and rules: parity/README.md.
#
# First full pass, written by reading the code (nothing was built or run):
#   TypeScript  ts/cli.ts main() (the yargs command tree, lines 5930-8914) and
#               the modules it calls
#   Rust        rs/src/main.rs and rs/src/slack.rs, in full
#
# No feature is `verified`. tests/parity.sh only runs `bun run test`;
# tests/parity.test.ts compares stdout for two invocations (`news --limit 5`,
# `search deploy --count 10`), skips the comparison unless
# rs/target/release/slack exists (CI never builds it), and as the two
# implementations stand their output for both cases differs. It is not a proof
# of anything yet.
#
# In every `partial` note: Rust takes its token only from SLACK_MCP_XOXP_TOKEN,
# has no -w/--workspace, no session cookie and no rate-limit waiting. Those are
# tracked once, under "Credentials and identity" and "Cross-cutting", and not
# repeated per command.

reconciled = "e315b19"

