status = "missing"
ts = "audio-stream-client.ts:129; audio-stream-client.ts:133; audio-stream-client.ts:143; audio-stream-client.ts:151; audio-stream.ts:54; audio-bridge.ts:33; docs/audio-duplex.md"
note = "Mints a stream on the daemon like the pipe form, but instead of connecting writes the ticket to a file for another local program (typically a web page on the given origin) and returns at once. `--ticket-file <path>` must be given exactly once and as two arguments: the `=` form is not recognised and ends as an option error. Messages inside the client: `audio stream: duplicate ticket path`, `audio stream: ticket path required`, `audio stream: ticket file required only for ticket mode` (ticket mode without the flag, or the flag without ticket mode). The file is created exclusively (an existing path fails), mode 0600, holding the ticket JSON on one line with no trailing newline, and is synced to disk. On success stderr gets `audio stream: private one-use ticket saved; expires in 30 seconds`; exit 0, nothing on stdout. If the file cannot be written the client sends `audio stream stop` (errors ignored) so that the minted stream does not linger, then fails (`audio stream: private ticket could not be saved`). --client-origin is optional in the code although the usage shows it as required; the default `null` means a client that sends no Origin header. A value must be an exact origin as a URL's origin prints it (no path, no trailing slash, lower-case host, no default port) and be https, or http on localhost, 127.0.0.1 or [::1]. --rate, --channels and --max-seconds are accepted as in the pipe form. Every failure shows only the generic audio failure line, exit 1. The other program has 30 s to connect and authenticate; if none does, the stream ends as `capability-expired` and the bridge stays `ready`."

