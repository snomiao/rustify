[[feature]]
name = "rech audio drain --dir <client-dir>"
status = "missing"
ts = "rechrome.ts:2236; audio-bridge.ts:186; audio-bridge-client.ts:59; audio-bridge-client.ts:63; audio-bridge-client.ts:68; audio-bridge-server.ts:200; audio-bridge-browser.ts:949 drain; audio-bridge-files.ts:12 saveAudioDrain"
note = "Collects what the page has recorded so far and appends it to local files; capture keeps running. `--dir <d>` or `--dir=<d>` is required. One invocation is one batch: request `audio drain`; a reply without `audioOut` means nothing to hand over and the line is {action: 'drain', ...the seven status fields} (no directory, no files). With `audioOut` (stdout {id, phase, pending: true}) the client saves the batch under <d>/<bridge id>/ (see the file entries), sends `audio ack <receipt>`, and prints {action: 'drain', id, phase, pending: false, directory, files}, without the counters: directory is the absolute <d>/<bridge id>, files lists every stream file saved there so far as {path, bytes} with its total size. `pending: true` is never printed. If saving fails no ack is sent (audio-bridge-client.test.ts:34, --dir pointing at a file) and the daemon keeps the batch: the next drain gets the same batch with the same receipt. If the ack fails after a successful save, the next drain gets the batch again, saving it is recognised as a repeat, and it is acknowledged then. The page buffers at most 2 MiB (shared with queued input), so a capture with several streams has to be drained while it runs or the bridge fails with `buffer-overflow`. Each stream's chunks are 250 ms fragments of one continuous WebM recording: only their concatenation in order is a playable file. Every failure is the generic line, exit 1. Use the same --dir for every drain and stop of one bridge."

[[feature]]
name = "rech audio stop [--dir <client-dir>]"
status = "missing"
ts = "rechrome.ts:2236; audio-bridge.ts:187; audio-bridge-client.ts:60; audio-bridge-client.ts:69; audio-bridge-client.ts:73; audio-bridge-server.ts:193; audio-bridge-browser.ts:971 stop; audio-bridge-browser.ts:615 stopState"
note = "Ends the bridge's generation and collects everything left. `--dir` is optional, default <project>/.rechrome/audio. Request `audio stop`: the page stops (waits up to 2 s per recorder for its final data, stops queued input and the virtual microphone tracks, closes its audio contexts; the page stays silent and cannot capture again without a new install), then the daemon drains. The client looks at up to 5 replies: one with `audioOut` is saved, acknowledged and followed by an `audio drain` request; the first reply without `audioOut` ends it. So an older batch that was never acknowledged is delivered first and the final fragments after it, in order (audio-bridge-client.test.ts:27: `first` + `last` end up in one file, two acks, every request carrying the same `-s=`). Result line: {action: 'stop', ...the seven status fields of the last reply}, plus directory and files when anything was saved; with nothing captured, the status alone. After a fifth saved batch the client sends one more drain, does not read its reply and fails (generic line); anything the daemon still holds is kept for `rech audio drain --dir <same dir>`. Stop is what lets the session be reused: the daemon marks the stop confirmed and, once a drain comes back empty (the stop's own drain counts), the bridge is retired and `audio install` is accepted again. Stopping twice is harmless. A session whose page can no longer answer for its generation cannot be stopped (see the daemon entry)."

