[[feature]]
name = "audio status fields and the 14 `unsupported` codes"
status = "missing"
ts = "audio-bridge.ts:9 AUDIO_UNSUPPORTED_CODES; audio-bridge.ts:316 statusKeys; audio-bridge-browser.ts:278 status; audio-bridge-browser.ts:153; audio-bridge-browser.ts:311 fail"
note = "What scripts read from every audio result line. phase: ready (installed), capturing (recording, or a PCM stream is on), stopped, failed. bufferedBytes: captured bytes not yet drained plus the decoded size (frames x channels x 4) of fed clips that have not finished playing, against one limit of 2 MiB. droppedBytes: capture bytes refused after an overflow, after a failure or after a stream was finalised. streamCount: recorders, one per AudioContext whose output was redirected (at most 16). queuedSeconds: fed audio not yet played, 0..30. unsupported: a sorted list, both a capability notice and the reason of a failure; the allow-list is checked by the daemon and by the client, so a page can never put free text there. When each code appears (read from the page code): existing-graph - always (connections made before install cannot be found); html-autoplay - whenever the browser has HTMLMediaElement.prototype.play, so always in Chrome (browser-started autoplay is muted, not captured), also when `Audio` cannot be wrapped; html-media-element - no play() to wrap, or an element could not be routed; media-devices - no navigator.mediaDevices; audio-node - AudioNode connect or disconnect cannot be wrapped; audio-context - no AudioContext, a 17th redirected context, 128 tracks reached when a context's output is redirected, or the virtual context would not resume; drm-media-element - an element with mediaKeys was played; media-recorder - MediaRecorder missing, no WebM support, a 17th stream, or a recorder error; recorder-timeout - a recorder did not finish within 2 s of stop; buffer-overflow - the 2 MiB buffer or the PCM output queue (65536 bytes) overflowed; connection-overflow - a 257th redirected connection; capture-data - a fragment was not a Blob or could not be read; track-overflow - 128 tracks reached at a getUserMedia call; input-overflow - 128 clips outstanding or more than 30 s queued. These also put the bridge in phase failed and stop it: audio-context in its overflow and resume cases, media-recorder, recorder-timeout, buffer-overflow, connection-overflow, capture-data, track-overflow, input-overflow; the others are notices. Rust needs only the allow-list and the numeric bounds: the values are produced in the page."

