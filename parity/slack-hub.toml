note = "Served natively for `search <query>` with --count/-n N (a plain decimal), --json, -w/--workspace NAME (also as --name=value) and --as-user, after the command in any order. Handed back: every other shape (usage errors, --help, -n10, --json true, repeated flags, global flags before the command); `slack @<who>`; a settings.yml in the global or the nearest .slack-hub/ scope (the middleware reads identities with bun's YAML parser, which no crate matches); the .env files bun loads from the cwd, a cwd bunfig.toml, BUN_OPTIONS; proxy and CA variables; files the JavaScript would fail to read (profiles.json of another shape, a lockfile, dotenv file or cache.json it cannot read); and, before anything is printed, a response the JavaScript would fail on in its runtime's words (no connection, not JSON, a TypeError in the newline repair, a mention id a RegExp cannot hold). The proof compares against ts/cli.ts. The published dist/cli.js differs from it: bun reads the `// @bun` bundle as Latin-1, so its non-ASCII literals print as mojibake and its `•` marker regex misses; native search prints what ts/cli.ts prints."

