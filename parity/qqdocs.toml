note = "On macOS the binary takes the zone from TZ only: with TZ not set, every ported command goes back there. Reading the zone /etc/localtime links to, as on Linux, has not been compared with bun on a Mac set to UTC (the Mac the port was tried on is in Asia/Tokyo, and there the one case with TZ unset went back while it said the binary answers). `usage: the system's zone when TZ is not set` says \"handback\" for darwin, and the parity job on darwin-arm64 shows it. TZ=UTC, Etc/UTC and Etc/GMT±N are answered on a Mac as on Linux (the `zone:` and `x machine: TZ=` cases there). Few Macs are set to UTC, so this costs little: a Mac in a place's zone goes back in any case (see \"the local day in a zone that is not UTC\")."

