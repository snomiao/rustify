[[feature]]
name = "session name: RDS_SESSION_NAME, git or folder default, prompt, .env.local"
status = "missing"
ts = "src/session.ts:97 resolveSessionName; src/session.ts:35 sanitizeSessionName; src/session.ts:48 gitDefaultSessionName; src/session.ts:74 upsertEnvLocal"
note = "RDS_SESSION_NAME (trimmed) wins, sanitised: runs of characters outside [A-Za-z0-9._-] become one `-`, repeated `-` collapse, leading and trailing `-` go. Otherwise the default is `<repo>/<branch>` from `git rev-parse` (repo alone on a detached HEAD), else the current folder's name, sanitised. Unless stdin and stdout are both terminals: a note on stderr naming the default, once per playwright-cli call, so several times in one command (read, not run); exit 6 when no default exists (the root directory). When both are: two prompts (the name, editable; whether to save it, Y by default), an empty name is exit 6, and `RDS_SESSION_NAME=<name>` is written into ./.env.local (replacing an existing line, else appended, trailing blank lines dropped), with a message, or a warning when it cannot be written. Asked only once per process. Covered in part by test/unit.test.ts (`session name`)."

