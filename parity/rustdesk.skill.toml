# Parity ledger for rustdesk.skill (npm package rustdesk-skill, commands
# `rustdesk-skill` and `rds`). Format and rules: parity/README.md.
#
# First pass, 2026-11-27, written by reading the code at c759994. Every line
# of the TypeScript was read: bin/rustdesk-skill.ts and the seven files of
# src/ (1,317 lines), with test/unit.test.ts, the two OCR scripts in ocr/,
# package.json, README.md, SKILL.md and CLAUDE.md. Nothing was run beyond
# --help: the only invocations were the install smoke test of the branch
# build/rustify-pipeline (`--help`, `connect --help`, no command, an unknown
# command), with a home directory of its own, all answered by yargs before
# any command runs. No browser, no playwright-cli, no OCR, no test, and
# nothing was contacted. No test was seen to pass, so none is cited as a
# proof. A statement that is a deduction from the code, not something a test
# asserts, says `read, not run`.
#
# How it fits together. Every command except `list` drives a browser tab
# through Microsoft's `playwright-cli` (@playwright/cli), started once per
# step with `-s=<session>` so that separate invocations share one tab on
# https://rustdesk.com/web/. The RustDesk web client is a Flutter canvas, so
# the program reads it by screenshot and OCR (a Python script in ocr/:
# PaddleOCR, or macOS Vision) and acts by coordinates. State: passwords and
# recent IDs under ~/.config/rustdesk-skill (RDS_CONFIG_DIR), the session
# name in the environment or ./.env.local, screenshots in the temp directory.
# The package has no `exports` and no library entry; the commands are the
# whole interface.
#
# Status. The crate on build/rustify-pipeline hands every invocation back to
# bin/rustdesk-skill.ts, so every feature below is `missing`. Nothing is
# `dropped`: that is the owner's decision.
#
# For the owner. Almost every command spends its time in playwright-cli and
# Python, which a Rust binary would still start; a port saves the start of
# bun and yargs per invocation, not the work. `list` and the argument
# errors are the only paths that touch neither.
#
# Rust-only behaviour, from the hand-back helper (no TypeScript counterpart;
# to be blessed or removed): RUSTDESK_SKILL_NO_NATIVE=1 hands everything
# back; RUSTDESK_SKILL_PACKAGE_ROOT tells the binary where the package is.

reconciled = "c759994"

