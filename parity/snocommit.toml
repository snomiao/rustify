# ─────────────────────── Shared by every step ───────────────────────

[[feature]]
name = "git commands echoed, their output passed through"
status = "verified"
ts = "src/index.tsx:6 snorun"
rs = "rs/src/sh.rs run, collect, Decoder; rs/src/color.rs; rs/src/commit.rs Plan::carry_out"
proof = "rs/parity.json: every case (stdout and stderr), run a second time with stdout and stderr a terminal (rs/parity/proof.sh, every byte, Linux and macOS), the `terminal:` cases, the `bytes:` and `limits:` cases; the crate's tests of the decoder and of the limit (rs/src/sh.rs)"
note = "Every git command is printed to stdout as `> <command>` in blue before it runs, and its stdout and stderr are passed through as they come, so diffs, logs and git's own errors show; the child gets pipes, and a stdin that is never written or closed. What is passed through is exec's text, not the bytes: exec reads both pipes as UTF-8 (setEncoding), so each ill-formed part of what git, a hook or the remote prints arrives as U+FFFD (EF BF BD), and a character split between two reads is put together again. exec also counts each stream in bytes of that text and, once one has given more than 1 MiB (maxBuffer), closes both pipes and sends the shell SIGTERM: the piece that crossed the limit is still passed on, nothing after it, and what the shell had started dies of a broken pipe when it next writes. Exactly 1,048,576 bytes pass (case). The binary does the same: it reads the pipes in the order they became readable and as long as a read fills 64 KiB (libuv's way, epoll on Linux, kqueue on macOS), decodes as node's StringDecoder does (compared with from_utf8_lossy at every cut in the crate's tests), counts, and kills. Where the kill falls depends on timing on both sides; the cases look at its outcome (no commit, no push, the summary missing) and at the text up to it with long runs of the same character folded. On one terminal shared by stdout and stderr, two lines git writes to the two at nearly the same moment come in either order in the TypeScript itself (the verifier's merge with a conflict: 1 of 8 runs against itself); that case stays on pipes in the terminal run. The colour is chalk's: supports-color for stdout (a terminal; TERM=dumb; CI and the services it names; COLORTERM; TERM_PROGRAM; TERM's patterns), all ported (cases: blue, TERM=dumb, no TERM, COLORTERM, CI alone, CI on GitHub Actions, only stdout a terminal, only stderr). Handed back: FORCE_COLOR, TF_BUILD and TEAMCITY_VERSION set, and a colour flag among the arguments (`--no-color` and its kin, which supports-color reads from the command's own arguments). Commands run through /bin/sh -c, as node's exec runs them; their exit codes are ignored."

[[feature]]
name = "errors end the program as unhandled rejections"
status = "missing"
ts = "src/cli.ts:5"
note = "Handed back on purpose, everywhere: cli() is called as `cli().then()`, so every throw reaches the runtime as an unhandled rejection: node prints the file and line, the source line with a caret, the error and its stack and `Node.js v<version>`, and exits 1 (for a thrown string: node's ERR_UNHANDLED_REJECTION text naming it); bun prints its own report. The paths of the installed files are part of that text, so it cannot be reproduced, and the binary decides before it stages anything whether one would come (or, for the service's errors and the schema, after its one request, with nothing staged or printed)."

[[feature]]
name = "repository states the binary does not reproduce"
status = "missing"
ts = "src/index.tsx:48; src/index.tsx:67"
note = "Handed back before anything is staged (7 `git:` cases of the port, 6 of the verifier's, 11 since): not a git repository, a bare one, or a start inside .git (the TypeScript's git commands fail and it prints `No files staged to commit.`), an index lock (another git at work), a split index (a copy would share its shared part), a temp directory inside the work tree (the copy would be among the changes), and a copy of the index that cannot be made. Also every way git has of running a program of the user's while it adds, shows the status or diffs, since the binary does those twice, first on its copy of the index (git would run the program for the copy as well, with GIT_INDEX_FILE naming it): a post-index-change hook (the hooks directory, core.hooksPath included), any hook.* setting (hooks in git's configuration, git 2.54), a clean, smudge or process filter, a textconv or command diff driver, diff.external, core.fsmonitor, log.showSignature, any trace2.* setting, wherever git reads its configuration (the repository, ~/.gitconfig, includes, GIT_CONFIG_* variables; one `git config --get-regexp`), GIT_TRACE* and GIT_EXTERNAL_DIFF in the environment, and a submodule in the index, also an embedded repository `git add` has just taken in (git status runs a status of its own inside it, with that repository's own hooks and filters). Before the verifier's cases, a clean filter and a hook in the configuration ran for the copy: the filter's file in the work tree made the binary stop with exit code 1 and the files staged where the TypeScript commits. Rare, except one: `git lfs install` writes filter.lfs.* into ~/.gitconfig, so on a machine with git-lfs set up every invocation goes back, whether or not the repository uses it (case)."

[[feature]]
name = "what node and bun act on around the program"
status = "missing"
ts = "src/cli.ts:1 (#!/usr/bin/env node)"
note = "Handed back (9 `runtime:` cases): any NODE_*, BUN_* (BUN_INSTALL* excepted, case), MIMALLOC_* or ICU_* variable; HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY in either case, SSL_CERT_FILE, SSL_CERT_DIR; OPENAI_* other than OPENAI_API_KEY and OPENAI_BASE_URL (organization, project, logging); a variable that is not UTF-8. Where the JavaScript might run under bun (the `node` on PATH is not node itself: missing, a symbolic link to bun as on the Mac here, a shim script, or bun's own file under the name node, hard-linked or copied, which the binary tells apart by running that node once with `-e` and asking `typeof Bun` and `process.versions.bun`, only where one of the files below is present; before the verifier's cases a hard link or copy was taken for node), also .env, .env.local, .env.development, .env.development.local or bunfig.toml in the current directory, a ~/.bunfig.toml or $XDG_CONFIG_HOME/.bunfig.toml, any tsconfig.json or jsconfig.json in the current directory or above it, and a package.json there with more than name, version, description, license, author and private (bun reports what it cannot parse or does not expect on stderr); and a repository with a hook (an executable file in git's hooks directory, core.hooksPath included, git's samples aside): bun's exec, unlike node's, leaves the pipes open when it kills a command past 1 MiB, so a hook printing that much may still finish under bun and its commit be made, by timing (on the Mac here, with /bin/sh forking git, a pre-commit hook's commit was made and pushed on a terminal, not into files), and how much a hook prints is known only when it runs. Which cases go back where node is bun is a matter of the runtime, not of the system's name (GitHub's macOS runner has node itself): such cases carry `handbackWhereNodeIsBun`, which rs/parity/lanes.mjs turns into a hand-back for the system it runs on when its node is bun (12 cases). Cases under bun on every system (rs/parity/with-mock.mjs puts bun first on PATH as node, as a symbolic link, and with PARITY_RUNTIME=bun-hardlink as a hard link): native with no such file and with a plain package.json, handed back with a .env, a package.json bun complains about, a tsconfig.json, a bunfig.toml. So in a JavaScript project with node absent, or bun as node, the commands go back; with node they do not."

