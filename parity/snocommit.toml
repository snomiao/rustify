note = "Native, and not proven: no case may reach the real service, so every case gives OPENAI_BASE_URL (rs/parity/with-mock.mjs refuses anything but 127.0.0.1) and the HTTPS path never runs in a test. The client is ureq with rustls and Mozilla's roots (node and bun bring their own roots too), no proxy (a machine with proxy variables is handed back), no redirects, one attempt, a 600-second timeout as the SDK's. Everything but a 200 whose one Content-Type is application/json and whose body is UTF-8 JSON with a non-empty content is handed back before anything is printed or staged, so a connection, certificate or service failure costs the user the time of one attempt and one request more, never a wrong answer. This is the common setup: until it is proven, the binary's native path is exercised only against a server on 127.0.0.1."

