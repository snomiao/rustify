# ═════ The daemon (rech serve) ═══════════════════════════════════════════════

# ───────────── Start-up, lifetime, housekeeping ─────────────

[[feature]]
name = "rech serve (the daemon)"
status = "missing"
ts = "serve.ts:668 serve; rechrome.ts:5193 command; rechrome.ts:5214; serve.ts:690"
note = "Runs the daemon in the foreground (normally under oxmgr; `bun run serve` is the same): checks the Windows session, moves legacy data, gets or creates the connection URL (key and port, default 13775 on 127.0.0.1), makes ~/.rechrome/output its work directory, starts the orphan check, the isolated-session reaper and the TLS check, opens the listeners and follows listeners.json and shares.json. Startup logs `Connection credentials remain in local configuration; listener changes reload automatically`. The core of the port: listeners, shares, WebRTC and one JavaScript CLI child per command. The daemon runs the source directly, so a change needs `oxmgr restart rechrome`; restarting it does not touch Chrome. ~/.rechrome/output is created at startup; every CLI child runs under it and everything /files serves must resolve inside it."

