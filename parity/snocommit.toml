note = "Prints `Generating commit message with gpt-4o...`, then one chat completion (z-chat-completion over the openai SDK) with the model gpt-4o, a strict JSON schema {type: one of the six, scope, title of 1 to 72 code units, body of 1 or more, is_BREAKING_CHANGE} and one system message: the current directory, the suggested type, the suggested scope as `(<scope>)` (`none` for `.`; `(-)` and `(@)` for those two), the description, the recent commits, the status lines and their diffs in a ```diff block, and the format. The binary writes that body as JSON.stringify does, the schema as z.toJSONSchema writes it, and sends it with Authorization, Content-Type and Accept as the SDK does, to OPENAI_BASE_URL + /chat/completions (cases with a slash at the end, without /v1, a longer path). The message is `<type><(scope)><! when breaking>: <title>`, a blank line and the body; an empty scope leaves out the parentheses, one already in parentheses keeps a single pair (cases for `(core)`, `core)`, `(`, a field more, JSON with space around it, 72 units with an emoji, a line separator, the model's own type). Handed back after the one request (the JavaScript then asks again; 20 cases compare the requests as a set): anything the SDK or zod throws at (next entries), a scope with a line feed, and a message the shell would not take literally (see \"command lines the shell would run\"). Handed back before it: an OPENAI_BASE_URL other than empty or `http://127.0.0.1:<port>[/path]` (case with spaces around it)."

