# Parity ledger for bunto (command `bunto`). Format and rules: parity/README.md.
#
# First written by reading, 2026-11-27, at dec02fd (the head of main; the
# branch build/rustify-pipeline adds only the crate in rs/, its parity cases
# and a workflow, so the TypeScript is the same there). Read in full: cli.ts,
# index.tsx, bunPMCommand.ts, notneed.ts, globWatch.ts, globMapFlow.ts,
# createIgnoreFilter.ts, nil.ts, arrayDiffs.tsx, mapReads.ts,
# promiseWithResolvers.ts, wait.ts, logError.ts, import-helpers.ts,
# builtins.ts, PartialUnion.ts (test-data/sub/*.ts are empty), package.json,
# bunfig.toml; the order in which yargs 17.7.2 (the version bun.lock pins)
# answers --help, validates and runs a handler (build/lib/command.js,
# yargs-factory.js, validation.js, yargs-parser); and bin/cli.js as
# `bun run build` bundles it at dec02fd. For the published release, index.ts
# and globflow.ts of e59f19b, from which 1.4.18 was published, were read too.
#
# Then ported, 2026-11-28, on build/rustify-pipeline: what yargs answers
# without running a command (the help, the version, an unknown argument) is
# answered by the binary on Linux, macOS and Windows; every command line that
# reaches a command's handler is handed back. Everything was run: bin/cli.js
# (bundled by bun 1.4.0) in a throwaway home, with a `bun` first on PATH that
# notes and does not run installs and removals (rs/parity/shim/bun), and the
# registry of the project cases pointed at a closed port.
#
# The proof, `sh rs/parity/proof.sh <parity.mjs> <binary>` (what the
# workflow's parity job runs on linux-x64, darwin-arm64 and win32-x64, with
# the binary the pipeline built for each; on Linux the static musl one):
# - rs/parity.json (920 cases, written by rs/parity.gen.mjs): TypeScript
#   against the binary, and the --handback check. On Linux 691 are answered
#   by the binary and 226 handed back as marked (3 skipped); on macOS 690 and
#   229 (1 skipped); on Windows 668 and 207, with 45 skipped (a terminal, a
#   symbolic link, a removed directory, a `bun` that is a shell script, what
#   Git Bash's sh does with LD_PRELOAD and a missing HOME, a command line past
#   32767 characters, a `#` in a path, a TEMP bun hangs on, and simdutf's
#   values bun hangs on). On Linux and macOS the whole file passes again
#   with stdout and stderr on a terminal (--tty stdout,stderr);
# - rs/parity/args.mjs: 1500 more command lines, bin/cli.js against the
#   binary (1172 answered, the same; 83 handed back exactly where bin/cli.js
#   runs a handler; 245 outside the words modelled, handed back);
# - cargo test: the argument model, the gates' helpers (a TEMP bun cannot use
#   on Windows, a package path bun cannot load, the version, the variables
#   that go back, the locale's file, what `bun --version` says), and
#   rs/tests/handback.rs, which runs the binary with no bun on PATH, with a
#   bun that cannot be run, that fails, says another version or hangs on
#   --version, without bin/cli.js, and with BUNTO_NO_NATIVE.
# Passed at 4e4f613, the branch's head, on: Linux x64 with bun 1.4.0
# against the static musl binary; macOS 27 arm64 with bun 1.4.4; Windows 11
# x64 (Git Bash, a clone with core.autocrlf=true) with bun 1.4.2. At 73ae4cf,
# which differs from it in a comment only, also on Linux with bun 1.4.5
# against the musl binary and with bun 1.4.0 against a glibc build, and on
# macOS and Windows as above. (Before the repair, at 6339eb9, the 793
# cases of then had passed with bun 1.4.5 on macOS and Windows too; after it,
# no other bun was at hand there.) A Windows machine under load cannot always
# start a program (it ends with STATUS_DLL_INIT_FAILED), and two such
# failures compare alike: run.sh and args.mjs start such a program again.
# Before the cases, 5007 command lines were compared the same way by hand on
# Linux (all agreed). The help, version and error texts were also the same
# under bun 1.1.13, 1.1.17, 1.1.21, 1.1.45, 1.2.23, 1.3.14 and 1.4.5, by
# hand, on Linux.
#
# Verified independently, 2026-11-28, and repaired on the same branch. Every
# proof reproduced, and the argument model held (10800 more command lines);
# four states of the machine did not, and go back now (the verifier's 92
# cases are in rs/parity.json as `verify: …`, marked where they go back):
# - a locale longer than a path may be (y18n gets ENAMETOOLONG for
#   `<locale>.json` and rethrows it: bin/cli.js crashes from about 4080
#   letters on Linux, 1000 on macOS);
# - SIMDUTF_FORCE_IMPLEMENTATION (bun 1.4.0 and 1.4.2 on x64 hang, 1.4.5
#   stops);
# - the variables of the system's loader and libraries (glibc's ld.so for
#   bun, while the Linux binary is static musl; macOS's dyld, libmalloc and
#   Objective-C runtime);
# - a `bun` on PATH that does not run (a version manager's shim, exit 126).

# How the two fit together. The Rust binary is meant to be the installed
# command. It answers natively what rs/src/cli.rs models, in the states of the
# machine rs/src/runtime.rs lets through, and hands everything else, before
# it has printed anything, to bin/cli.js, a bundle of cli.ts that is a build
# product (not in git).
#
# For the owner:
# - main has never been published. Its semantic-release run failed, and npm's
#   1.4.18 is e59f19b. Between the two, index.ts became index.tsx and
#   bunAuto() was rewritten around @snomiao/glob-watch, unfinished: every
#   command but help, version and a usage error throws `ReferenceError:
#   getDeps is not defined` (index.tsx:50). Now seen, not only read (cases
#   `work: …`): the command's help on stderr, one newline on stdout, bun's
#   report of the error with a source excerpt and the bundle's stack, exit 1;
#   nothing is installed or removed. The working scan of 1.4.18 is still in
#   index.tsx as useBunAuto(), which nothing calls and the bundle leaves out.
#   The binary hands all of that back. Porting the scan means porting one of
#   the two versions; which one, and fixing main first, is the owner's
#   decision.
# - package.json's exports, module and types name ./index.ts, which main no
#   longer has (and `files` ships only the root's .ts), so `import "bunto"`
#   from a release of main would fail.
# - The help says `remove all unnessecery dependencies` (cli.ts:12); the
#   binary prints the same.
# - Files that nothing reachable from cli.ts imports, and that have no
#   feature of their own: arrayDiffs.tsx, mapReads.ts, promiseWithResolvers.ts,
#   wait.ts, logError.ts, import-helpers.ts, builtins.ts, PartialUnion.ts,
#   createIgnoreFilter.ts, globMapFlow.ts. The audit counts them among the
#   784 lines to replace.
#
# Rust-only behaviour, with no TypeScript counterpart, for the owner to bless
# or remove: BUNTO_NO_NATIVE=1 hands everything back; BUNTO_PACKAGE_ROOT tells
# the binary where the package is; with RUSTIFY_HANDBACK_TRACE set a
# hand-back writes `rustify: handed back to the JavaScript` to stderr first; a
# binary without its package beside it says so and fails. Handed back,
# bin/cli.js starts with the runtime its first line names (bun), or node when
# there is no bun, and under node the bundle cannot run (it imports `bun`);
# the binary answers nothing natively when no bun is on PATH, so that case
# looks as it did. `--version` prints the version of the package.json beside
# bin/cli.js, where bin/cli.js prints the one bundled into it: the pipeline
# stamps package.json before it bundles, so the two agree in every package it
# builds, but a bin/cli.js bundled from another package.json would differ.
# Before each native answer the binary starts `bun --version` once, with its
# output kept, to learn that the bun bin/cli.js would run with runs and is
# of the versions proven: a version manager's shim that installs on first
# use would do so then (bin/cli.js would have started it too).

reconciled = "dec02fd"

# ───────────────────────────── Commands ─────────────────────────────

[[feature]]
