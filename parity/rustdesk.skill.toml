status = "missing"
ts = "src/ocr.ts:34 resolveBackend; src/ocr.ts:41 langArg; src/ocr.ts:104 runOcr; src/ocr.ts:128 ocrBuffer; src/ocr.ts:76 normalizeBoxes; ocr/ocr.py; ocr/ocr-mac.py"
note = "Backend: --ocr, else RDS_OCR (paddle or vision, any case; another value is ignored), else vision on macOS and paddle elsewhere. --lang for vision maps ja, en→en-US, zh/ch→zh-Hans and passes others on (an empty list gives ja,en-US); for paddle only the first language counts, en, ja→japan, zh/ch→ch, others passed on, ch when empty. The PNG is written to <temp>/rds-ocr-<pid>.png, which is never removed (read, not run), and `python3 <package>/ocr/<script> <png> <lang>` is run; the scripts are found beside the package, so a port needs the package root. Paddle boxes are pixels, Vision boxes are fractions scaled by the PNG size; all rounded; confidence 1 when missing. Failures: `OCR (<backend>) failed: …`, `OCR (<backend>) produced non-JSON output: <first 200 characters>`, `OCR script missing: <path>`, exit 1. The Python scripts can stay as they are."

