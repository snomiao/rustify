status = "missing"
ts = "webrtc.ts:92 WebrtcHost; serve.ts:1507"
note = "The daemon joins one signal room per (signal server, credential) as host, offers a DataChannel named `rech` to each joining client (at most 8 peers per room, dropped after 30 s without a confirmed handshake) and passes each request to the same handler as HTTP with `Authorization: Bearer <bearer derived from the room's token>`, on a per-WebRTC-listener pseudo listener (host `webrtc`, port 0, no profiles, a random key nobody holds), so every share check applies unchanged; the client address is `webrtc`. In the TypeScript a relay's `peer-leave` notice is effectively ignored (webrtc.ts:151 returns before the branch at 159), so a leaving client is cleaned up only by connection state or the 30 s timeout. Today this is node-datachannel, a native Node addon; Rust needs a WebRTC stack that interoperates with those peers and with browsers, SDP handling included. Tests: webrtc.test.ts, share-webrtc.integration.test.ts."

