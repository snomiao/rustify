# Parity ledger for rechrome (commands `rech` and `rechrome`). Format and rules:
# parity/README.md.
#
# First full pass, 2026-11-27, written by reading the code at c4ef27e in a clean
# read-only checkout. Nothing was run: not rech, not a test, no daemon, no
# browser. Every note comes from the source and from what the tests assert; no
# test was seen to pass, so none is cited as a proof.
#
# What was read. Six readers each read a slice in full; their lists are merged
# here (about 600 findings, many seen from two or three sides):
#   rechrome.ts (5,332 lines) and serve.ts (1,676), every line
#   listeners.ts, shares.ts, webrtc.ts, rtc-channel.ts, e2e.ts, signal-relay.ts,
#   token.ts, secret.ts, extension-token.ts, daemon-manager.ts, scoped-upload.ts,
#   fill-secret.ts, record.ts, redact.ts, invite-page.ts, every line
#   53 of the 62 test files, README.md, CLAUDE.md, package.json
# No slice of that pass held the eight audio modules (audio-bridge*.ts,
# audio-stream*.ts, 2,494 lines), their seven test files,
# windows-session.test.ts, windows-autostart.test.ts or scripts/. They were
# read line by line afterwards, in the third pass below, so by now all 25
# TypeScript sources of the root, all 62 test files and scripts/ are read.
# Not read: secret-rules/gitleaks.toml (only its loader), docs/ (except
# audio-duplex.md, windows-sessions.md and the frame table of
# signal-selfhost.md), skills/, and what projects.toml already sets aside
# (extension/, functions/, signal/, vendor/, vendor-src/, public/, lab/,
# tray/).
#
# Second pass, same day. An independent critic listed the features
# mechanically (command words, flags, environment variables, paths, routes,
# exit codes, test titles) and compared the lists with this file. Each of its
# findings was checked in the code before it went in: three entries added (the
# fixed usage texts, the audio stream wire protocol, the offer/answer/candidate
# frames), nine notes corrected and eight more extended. Still nothing was
# run.
#
# Third pass, same day. Two more readers read, every line, what the first
# pass had left to the merger: one the five audio-bridge modules and their
# five test files; the other the three audio-stream modules,
# audio-stream.test.ts, audio-stream-routing.test.ts, the two Windows test
# files with the code they cover (daemon-manager.ts, and the session, pm2
# logon and status code of rechrome.ts and serve.ts) and every file under
# scripts/. Each finding was checked in the code before it went in: 27
# entries added and 23 corrected. The audio part, 15 entries before, is 41
# now: the in-page bridge, one entry written from test titles, is eight; the
# wire protocol entry is three (ticket, WebSocket endpoint, relay routes);
# drain and stop are one each; the checks with their own test blocks (argument
# grammar, URL rule, WAV admission, browser results, stream options) have
# their own entries. Still nothing was run. What reading cannot show is said
# where it applies: the audio bridge was read as source and through tests
# that use fake browser objects, never seen in a real Chrome; three Windows
# test cases run on Windows only and are skipped elsewhere; a statement that
# is a deduction from the code and that no test asserts is marked `read, not
# run` in its note.
# scripts/ holds repository tooling only, and package.json `files` does not
# ship it: three manual audio smoke checks (the README quotes the command of
# one), the build step of the invite page (see that entry), and the tests of
# upstream-sync.sh and pack-files.cjs. It has no entries of its own. The
# variables RECH_AUDIO_PLAYWRIGHT, RECH_AUDIO_CHROME, RECH_AUDIO_SMOKE_OUT,
# RECH_AUDIO_SMOKE_HTML and PCM_TEST_TICKET are read only there and in
# audio-stream.test.ts, never by rech. projects.toml does not list `scripts`
# under rechrome's `ignore`, so the audit counts its .ts files as TypeScript
# to replace; whether to set them aside is the owner's decision.
#
# How it fits together. `rech <browser command>` is a thin HTTP client: it
# works out the session (the git worktree root) and the Chrome profile, POSTs
# the command to a daemon (`rech serve`, kept alive by oxmgr or pm2) and prints
# the reply. The daemon runs each command as a child of the vendored
# playwright-cli under node, which reaches the user's own Chrome through the
# bridge extension. Listeners say who may reach the daemon (listeners.json);
# shares and invites grant profiles to other machines (shares.json), over a
# listener's socket or over WebRTC through a local bridge process. Machine
# state is under ~/.rechrome; a project keeps its link in <project>/.rechrome.
#
# Status. The Rust crate (rs/src/main.rs, rs/src/js_fallback.rs) has one arm:
# hand the invocation to rechrome.ts. So every feature below is `missing`.
#
# Rust-only behaviour (no TypeScript counterpart; to be blessed or removed):
#   RECHROME_NO_NATIVE     meant to hand every command back to the JavaScript;
#                          read by rs/src/main.rs native(), which nothing calls
#                          yet
#   RECHROME_PACKAGE_ROOT  how the npm launcher tells the binary where its
#                          package is when the binary is not at <package>/bin/
#   a binary with no package beside it prints `this command is not available
#     in the standalone binary yet; install the npm package to use it`, exit 1
#   when bun cannot be started the helper (js_fallback v1) tries
#     `node rechrome.ts`, which cannot work (the file imports from "bun"); when
#     neither starts it prints `cannot run <script>: neither bun nor node could
#     be started (...)`, exit 127
#   on Windows the binary stays alive on Ctrl+C until the JavaScript has exited
#
# Candidates to stay JavaScript (the owner decides; nothing is `dropped`):
#   - the vendored playwright-cli and its patched playwright-core (vendor/,
#     lib/): the daemon only starts it, under node, and it writes its own files
#   - the Chrome extension (extension/, already keep_ts)
#   - code that runs in a browser or inside playwright and so travels as
#     JavaScript text whoever sends it: the invite page (invite-page.ts, built
#     into public/invite.js together with token.ts, e2e.ts and rtc-channel.ts),
#     the in-page audio bridge (audio-bridge-browser.ts, sent with toString();
#     eight entries), the generated snippets of fill-secret.ts, record.ts,
#     scoped-upload.ts, audio-bridge.ts (the install and action programs) and
#     audio-stream-server.ts (the page relay), and the inline scripts of the
#     three HTML pages (link page, setup guide, signal server page)
#   - the one-time install of node-datachannel into ~/.rechrome/webrtc: a Rust
#     build would link its own WebRTC library
#   - help and usage-error text, which yargs writes and translates by locale
#   - signal/cloudflare/worker.ts and functions/ (already keep_ts)
#
# Traps for an exact port, found while reading:
#   - Bun loads the current folder's .env files before rech starts; rech both
#     relies on that and corrects it (see the entry on Bun-loaded values)
#   - many paths hang off the JavaScript install directory (import.meta.dir):
#     the legacy .rech folder, the watched .env.local, the script named in the
#     daemon registration and in the Windows scheduled task, tray/, extension/,
#     secret-rules/, the vendored CLI, package.json for --version
#   - the running executable (process.execPath) is taken to be bun: the bridge
#     is started as `<executable> <script> bridge`, the WebRTC runtime install
#     as `<executable> install` with BUN_BE_BUN=1, and it stands in for `bun`
#     in the daemon registration, the Windows scheduled task and the oxmgr
#     install when bun is not on PATH; none of that holds once the executable
#     is the Rust binary
#   - session keys and session ids are hashes of exact strings; one byte of
#     difference orphans every live browser session
#   - both implementations will share ~/.rechrome files while the port is
#     partial (profiles.yaml as Bun.YAML writes it, listeners.json,
#     shares.json and its lock directory)
#   - the code disagrees with its documents in places: CLAUDE.md says the
#     nearest .env.local overwrites the environment (the code lets the shell
#     win) and describes the token reader before SQLite was added; the /run
#     size error says 3 MiB where the limit is 14 MiB
#   - the audio bridge reaches the page as installAudioBridge.toString(),
#     under Bun the transpiled JavaScript of audio-bridge-browser.ts: a Rust
#     build needs that text as an asset made at build time
#   - two audio outputs are JavaScript's JSON.stringify byte for byte: the
#     result line of `rech audio ...`, and the text whose sha256 identifies a
#     saved batch in manifest.json (key order, how a double prints)
#   - `rech audio stream` works only with the daemon on the same machine, and
#     its exit codes (0 on SIGINT, 1 on a broken stdout pipe) are not what a
#     Rust program does by default

reconciled = "c4ef27e"

# ═════ The program ═══════════════════════════════════════════════════════════

# ───────────── Entry, dispatch, help, exit codes ─────────────

[[feature]]
name = "rech / rechrome executables (Bun entry point)"
status = "missing"
ts = "rechrome.ts:1; package.json:8 bin"
note = "Both npm bin names run rechrome.ts, which starts with `#!/usr/bin/env bun`; loading the file reads the env files at top level (rechrome.ts:199) before any command runs, so a native binary has to do explicitly what Bun did before main. Rust today: rs/src/main.rs has no command of its own and hands every invocation to `bun rechrome.ts` through rs/src/js_fallback.rs. Rust-only, to be blessed or removed: RECHROME_NO_NATIVE, RECHROME_PACKAGE_ROOT, the standalone-binary message (exit 1), the exit 127 message, and the helper's second try with node, which cannot run this file."

[[feature]]
name = "command dispatch: rech's own commands or a browser command"
status = "missing"
ts = "rechrome.ts:4983 RECH_COMMANDS; rechrome.ts:5209 dispatch; rechrome.ts:5252"
note = "The first argument, lower-cased (only the first), is matched against serve, status, listener(s), profile(s), share, connect, session(s), signal, bridge, setup, tray, provision-profile, uninstall; anything else goes to the daemon as a browser command. An own command's error is its message printed whole on stderr, exit 1. Most are one line, but several are blocks: `rech share` without a transport (7 lines), provision-profile without --experimental (4), `isn't shared on any listener yet` (up to 3), the not-connected message thrown by `rech session` (3), and any message that carries a stale-link hint or the tail of a bridge log. serve, signal and bridge keep the process alive; the others close the env-file watcher."

[[feature]]
name = "rech --help / help / -h / no arguments"
status = "missing"
ts = "rechrome.ts:4988 HELP_USAGE; rechrome.ts:4992 HELP_EPILOGUE; rechrome.ts:5260 dispatch"
note = "Usage banner, the command list (bridge hidden), then an epilogue with the browser commands (fill-secret, read-secret, read-cookie, read-storage, read-headers, record, audio, pw, --version), an Environment section and Examples; wrapped at min(110, terminal width); exit 0, no daemon contact (cli.test.ts:247). Layout, wrapping and headings are yargs's, and yargs translates its headings by system locale, so the TypeScript's own output differs between machines. The fill-secret line omits --from-stdin, --totp-from-stdin and --submit that the command's own usage lists. Candidate to stay JavaScript."

[[feature]]
name = "rech <command> --help / -h"
status = "missing"
ts = "rechrome.ts:5040 rechCli"
note = "Each own command and each listener subcommand has yargs-generated option help from the descriptions in rechCli, on stdout with exit 0 (`rech connect -h`, cli.test.ts:312). Same yargs layout and locale dependence as the top-level help. Candidate to stay JavaScript. This covers rech's own commands only; the seven browser commands the client handles itself print fixed texts (next entry), and for every other browser command --help is an ordinary argument sent to the daemon."

[[feature]]
name = "rech fill-secret | read-secret | read-storage | read-cookie | read-headers | upload | audio --help / -h (fixed usage texts)"
status = "missing"
ts = "rechrome.ts:2229; rechrome.ts:2247; rechrome.ts:2267; rechrome.ts:2287; rechrome.ts:2313; rechrome.ts:2323; rechrome.ts:2331; fill-secret.ts:40 FILL_SECRET_USAGE; fill-secret.ts:374 READ_SECRET_USAGE; fill-secret.ts:468 READ_STORAGE_USAGE; fill-secret.ts:615 READ_COOKIE_USAGE; fill-secret.ts:724 READ_HEADERS_USAGE; scoped-upload.ts:63 UPLOAD_USAGE; audio-bridge.ts:26 AUDIO_USAGE"
note = "Seven hand-written strings, not yargs and not translated, so they are the same on every machine. `--help` or `-h` anywhere in the arguments prints the command's text on stdout, exit 0; a usage error of the six other than audio prints `[rech] <error>` and then the same text on stderr, exit 2 (audio has only its generic failure line). The upload text is built from the type list and the size limit, the read-headers text from the default and maximum seconds. This help sits inside the browser-command path, so it is not free of side effects: without RECHROME_URL the not-connected message comes first (exit 1), and before the text is printed the client has resolved the transport (a WebRTC link starts its bridge), --profile, RECHROME_PROFILE and --isolate, run the git identity lookups, read the profile registry (the token self-heal can rewrite profiles.yaml) and printed `[rech] connecting to ...` on stderr. No /run request is made. `record` has no usage text: `rech record --help` goes to the daemon, whose management listener answers `[rech] record: unknown option --help`, status 1."

[[feature]]
name = "usage errors: the command's help, then `rech: <message>`, exit 1"
status = "missing"
ts = "rechrome.ts:5194 demandCommand, strict; rechrome.ts:5201 fail; rechrome.ts:5249"
note = "A parse error (unknown option or command under strict mode, a missing argument also in a nested command such as `rech listener allow share`, a failed check, --project with --global) writes that command's help to stderr, a blank line, then `rech: <message>`; a missing positional is reworded to `missing a required argument; see the usage line above`. Options take `--opt value` and `--opt=value`; values are not turned into numbers except options typed number (--port, --devices). The message texts are yargs's own. Errors thrown by a command's handler pass through with no help above them: the message is printed as it is, one line or a block (see command dispatch)."

[[feature]]
name = "rech --version"
status = "missing"
ts = "rechrome.ts:5257; rechrome.ts:2128 rechromeVersion"
note = "Prints rechrome's version from the package.json beside the script (`unknown` if unreadable), exit 0, without contacting the daemon or printing `connecting to` (cli.test.ts:147). Recognised only as the first argument. playwright-cli's own version is `rech pw --version`. A native binary has to find the package root or embed a version equal to package.json's, which a release stamps."

[[feature]]
name = "exit codes"
status = "missing"
ts = "rechrome.ts:5253; rechrome.ts:5267; rechrome.ts:2255; rechrome.ts:2242; rechrome.ts:2418; rechrome.ts:2260; rechrome.ts:2370; rechrome.ts:3365; rechrome.ts:3884; rechrome.ts:4000; rechrome.ts:4804; serve.ts:707; serve.ts:732; serve.ts:1409"
note = "The client. 0 on success, for --version, the help and the seven fixed usage texts. 1 for an own command's error, a missing RECHROME_URL, a bad --profile or --isolate, a WebRTC bridge that did not start, an unreachable or rejecting daemon, a reply that is not the daemon's, a failed audio command (its usage errors too, where the six sibling commands give 2; `rech audio stream` gives 0 when the stream ends as stopped, cancelled, renderer-ended or duration-limit, and 1 for any other reason or a broken pipe), an unknown tray action, an invalid provision-profile name, and the failures of setup. 2 for usage errors of fill-secret, read-secret, read-storage, read-cookie, read-headers and upload (stdout not being a pipe included). 130 when Ctrl-C is pressed at a `rech setup` prompt in a terminal; 130 (SIGINT) and 143 (SIGTERM) when provisioning is interrupted. A browser command exits with the status the daemon returned; read-secret, read-storage and read-cookie that got no value exit with that status, or 1 when it is 0, and the `Did you mean` hint with that status, or 1 when the reply has none. `rech connect` with a rech1_ link leaves explicitly with 0 or 1, because the WebRTC library's threads would keep the process alive. `rech bridge` exits 0 when it stops idle. The daemon. 0 when an orphaned foreground serve goes idle and after a renewed TLS certificate (at start or at the daily check), so that the process manager restarts it; 1 from the watchdog after consecutive command timeouts. The Rust launcher (no TypeScript counterpart, see the header): 1 for the standalone-binary message, 127 when neither bun nor node could be started; otherwise the JavaScript's status (on Windows 1 when the child ended without one)."

# ═════ Connection and identity (client side, no daemon needed) ═══════════════

# ───────────── RECHROME_URL and the env files ─────────────

[[feature]]
name = "RECHROME_URL: where it is read from (shell, project env files, machine-wide file)"
status = "missing"
ts = "rechrome.ts:166 loadNearestEnv; rechrome.ts:158 inheritedEnvKeys; rechrome.ts:161 rechromeUrlSource"
note = "Every KEY=value line (not only RECHROME_URL) of `.rechrome/.env.local` and then `.env.local`, in each folder from cwd up to the filesystem root, then `~/.rechrome/.env.local`, is loaded into the environment. The first file to set a key wins and a variable inherited from the shell, even an empty one, always wins, across reloads too. Line syntax is rech's own: no `export`, no comment stripping (an unquoted `#key=` survives), one leading and one trailing quote removed. The loader records where RECHROME_URL came from (`environment`, a file path, or nothing) for `rech status` and the stale-link hints. Tests: env.test.ts, env-precedence.test.ts. CLAUDE.md still says the file overwrites the environment; the code and README.md do not."

[[feature]]
name = "values Bun loaded from the folder's .env files count as file values, not shell exports"
status = "missing"
ts = "rechrome.ts:131 parseBunEnvFile; rechrome.ts:148 bunAutoloadedKeys; rechrome.ts:155"
note = "Keys whose current value equals what Bun's own loader would produce from cwd's .env, .env.<NODE_ENV|development>, .env.local and .env.<NODE_ENV|development>.local are not treated as inherited, so `.rechrome/.env.local` still beats `.env.local` and a URL Bun cut at an unquoted `#` is replaced by the full one. Side effect to keep or bless: a key set only in cwd's plain `.env` stays effective, at the lowest priority. Rust has no such autoload, so parity means imitating Bun's cwd .env loading (quotes, the `#` cut, `export`, the NODE_ENV file list) or an owner's decision."

[[feature]]
name = "env file line format rech writes (values with # or spaces are double-quoted)"
status = "missing"
ts = "rechrome.ts:126 envAssignment"
note = "`KEY=\"value\"` when the value contains `#` or whitespace (every connection URL with `#key=`), otherwise `KEY=value`, so other .env loaders keep the fragment. Covered by env-precedence.test.ts."

[[feature]]
name = "RECHROME_URL format and parsing"
status = "missing"
ts = "rechrome.ts:345 parseUrl; rechrome.ts:29 ENV_KEY"
note = "`http(s)://host[:port][/prefix/]?profile=<p>#key=<listener key>`. The key is a rech1_ token's derived bearer, else `#key=` or `#?key=` in the fragment (an empty `#?key=` gives an empty key, not the userinfo), else the legacy `KEY@host` userinfo. extension_id, token, profile, user_data_dir and load_extension are read from the fragment first, then the query; the path becomes the prefix; the port defaults to 443 for https, 80 for http and 13775 for any other scheme, which is then spoken as http. Exact parity rests on WHATWG URL and URLSearchParams quirks (a fragment parsed as a query, non-special schemes, percent-encoded userinfo, parseInt's port fallback). Tests: url.test.ts, rechrome.spec.ts:27, listeners.integration.test.ts:150."

[[feature]]
name = "rech1_ share link used as RECHROME_URL"
status = "missing"
ts = "rechrome.ts:352; secret.ts:34 bearerOf"
note = "When the first `&`-separated piece of the fragment has the shape of a rech1_ token, the client authenticates with the HKDF-derived `rb_...` bearer instead of a key; a token with a bad checksum yields no bearer and falls back to `#key=` or the userinfo."

[[feature]]
name = "API request URLs carry no credentials"
status = "missing"
ts = "listeners.ts:107 serviceUrl"
note = "Every request URL the client builds is `http(s)://host[:port]<prefix><route>`: the key in the userinfo, `?profile=`, `?token=` and the fragment are dropped, and the key travels only as `Authorization: Bearer`. IPv6 hosts and prefixes must come out the same."

[[feature]]
name = "connection URLs rech prints or saves (endpoint, ?profile=, #key= only)"
status = "missing"
ts = "rechrome.ts:371 registeredProfileUrl; rechrome.ts:634 rebaseConnectionUrl; rechrome.ts:381; rechrome.ts:649 listenUrl"
note = "A URL for a registered profile keeps only the service endpoint, `?profile=` and `#key=`; the extension token and id, user data dir and load-extension path stay in the daemon's registry, and fragment-style input gives the same result. The same key and profile can be re-expressed at another base (a listener's publicUrl or a Tailscale Serve route). Tests: url.test.ts, setup-tailscale.test.ts. Changing where a listener binds rewrites only the host, keeping key, port and query; 0.0.0.0 becomes 127.0.0.1, `::` becomes [::1] and other IPv6 addresses are bracketed (setup-network.test.ts)."

[[feature]]
name = "listener link for a profile (?profile= in the query, key in the #fragment)"
status = "missing"
ts = "rechrome.ts:1422 profileConnectionUri"
note = "`<endpoint>/?profile=<p>#key=<key>` built from the configured URL, or from the one listener that allows the profile, or from `--listener <name>`. Errors: `Unknown listener`, `Listener \"x\" does not allow \"p\". Allow it with: rech listener allow...`, `Choose a listener with --listener <name>, or set RECHROME_URL...`, `The connection URL has no daemon key...`. The encoding of query and fragment must match byte for byte. Test: url.test.ts."

[[feature]]
name = "auto-generated management URL and key in ~/.env.local"
status = "missing"
ts = "rechrome.ts:656 getOrCreateUrl; rechrome.ts:117"
note = "When RECHROME_URL is unset or carries no key, rech makes `http://<16-char base64url key>@127.0.0.1:13775` (12 random bytes), sets it for the process and, unless called without persistence (setup's probe), rewrites `~/.env.local` (HOME, not ~/.rechrome) atomically with mode 0600, replacing an earlier RECHROME_URL line and keeping the others. Used by `rech serve`, setup and provision-profile."

[[feature]]
name = "env reload when the install directory's .env.local changes"
status = "missing"
ts = "rechrome.ts:114; rechrome.ts:202 envWatcher"
note = "If `<install dir>/.env.local` exists at start it is watched; on change rech logs `.env.local changed, reloading` and reruns the env walk. One-shot commands close the watcher; serve, signal and bridge keep it. A native binary no longer sits beside the source, so `install dir` needs a decision."

