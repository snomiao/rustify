[[feature]]
name = "what bun does before the program: .env, bunfig.toml, package.json and tsconfig.json up the tree, BUN_/NODE_ variables, proxies"
status = "partial"
ts = "package.json:7 bin"
rs = "rs/src/bun.rs:17 startup; rs/src/bun.rs:88 quiet_for_bun; rs/src/bun.rs proxied"
proof = "rs/parity.json; rs/parity/proof.sh"
note = "60 `startup:` cases. Handed back before anything is printed: a .env, .env.local, .env.development or .env.development.local in the current directory (bun loads them; .env.production, .envrc and a .env in a parent directory are not loaded and stay native), bunfig.toml there or in ~/.bunfig.toml or $XDG_CONFIG_HOME/.bunfig.toml ($XDG_CONFIG_HOME/bun/bunfig.toml and one in a parent directory are not read and stay native), any BUN_ (but BUN_INSTALL*), NODE_, MIMALLOC_ or ICU_ variable, NO_COLOR and FORCE_COLOR together (see the error line), for the commands that connect any HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY, WS_PROXY or WSS_PROXY in any case, and a package.json, tsconfig.json or jsconfig.json in the current directory or any above it unless it is one bun 1.4.0 was seen to read without a word: strict JSON (a JSON-with-comments tsconfig.json, which bun reads silently, also goes back) with no key twice in any object (bun warns `Duplicate key`); in a package.json no `type` other than module or commonjs, no `exports` or `imports`, and a `browser` object only of strings and booleans; in a tsconfig.json or jsconfig.json no `extends`, a jsxFactory and jsxFragmentFactory that are dotted names, importsNotUsedAsValues remove, preserve or error, and `paths` an object of arrays of strings with at most one `*` in each pattern and substitution, every substitution starting with ./ or ../ unless baseUrl is a string. Other fields and other value types bun does not warn about stay native (name, main, browser, bin, dependencies, sideEffects, workspaces of any type; baseUrl, jsx, jsxImportSource of any type; a file that is an array, null or a number). So a command run inside a JavaScript project with an ordinary package.json and tsconfig.json is native; one next to a .env file, or under a tsconfig.json with `extends` or with `paths` such as `src/*` and no baseUrl, is not."

# ───────────────────────────── serve: the daemon ─────────────────────────────

[[feature]]
name = "serve [--port] [--host] [--verbose]"
status = "missing"
ts = "ts/cli.ts:276; ts/serve.ts:77; ts/serve.ts:400"
note = "Handed back on every system (case `serve --port 0 is handed back`), not ported: a long-running Bun.serve daemon whose HTTP and WebSocket behaviour (headers, idle timeout, pings, payload limit) would all need proving. The parity cases use this TypeScript daemon as their stand-in. Starts on --host (default 127.0.0.1) and --port (default 7437), prints on stderr `comfy-ai bridge listening on http://<host>:<port>`, the three endpoints and `Press Ctrl+C to stop.`; --verbose logs `[comfy-ai] session opened <id> <title>`, `session closed <id>`, `cli disconnected`, `pair-request <code> → <id>` (seen in the cases' daemon log)."

[[feature]]
name = "daemon: GET /pair/<code> (claim a pairing code)"
status = "missing"
ts = "ts/serve.ts:127; ts/serve.ts:114 purgeExpiredPairs; ts/serve.ts:65 PAIR_DEFAULT_TTL_MS"
note = "Part of serve (handed back). Seen through `pair`'s cases: 400 `missing code`, 404 `unknown or expired pairing code` (also for a code past its ttlMs), 410 `session for this code is no longer open`, 200 `{ok,sessionId,title,token}` with the tab told `paired`. The token is issued and the code removed before Response.json: a title too deep for JSON.stringify (about 40,000 levels) gives bun's HTML error page with status 500 after the claim (for the owner)."

[[feature]]
name = "daemon: /spa WebSocket (browser tab sessions)"
status = "missing"
ts = "ts/serve.ts:173; ts/serve.ts:227; ts/serve.ts:247; ts/serve.ts:263 handleSpaMessage"
note = "Part of serve (handed back). Upgrades any request to /spa with no token and no Origin check: any page in a browser on the machine can open a session (for the owner). Frames that are not JSON objects with v === 1 are dropped; hello opens a session, event fans out to subscribed /ctl sockets, evalResult goes to the socket that has the opId pending, pair-request registers a code. What a tab sends (title, exitCode, stdout, stderr) is passed on unchecked."

[[feature]]
name = "daemon: /ctl WebSocket (CLI clients, token check)"
status = "missing"
ts = "ts/serve.ts:185; ts/serve.ts:324 handleCtlMessage"
note = "Part of serve (handed back). A token no open session holds is refused with 401 `invalid token`; without a token the socket is accepted, unbound. The session a frame names is not checked against the token: any /ctl client may list, watch, send to, eval in and abort any open session (for the owner). Seen through the client commands' cases against the TypeScript daemon."

[[feature]]
name = "daemon: GET /health and the banner on every other path"
status = "missing"
ts = "ts/serve.ts:211; ts/serve.ts:219"
note = "Part of serve (handed back). `pair` cases ask both: /health answers `{\"status\":\"ok\",\"version\":1,\"sessions\":N}`, any other path the text/plain banner, whose endpoint list shows the --port given (0 for `--port 0`)."

# ───────────────────────────── The client commands ─────────────────────────────

[[feature]]
name = "pair <url>"
status = "verified"
ts = "ts/cli.ts:292; ts/cli.ts:124 cmdPair"
rs = "rs/src/cli.rs:325 pair; rs/src/net.rs:39 get"
proof = "rs/parity.json; rs/parity/proof.sh"
note = "73 `pair:` cases. Native: the refusal of a URL that does not start with `http` after JavaScript's trim (before any request, any text); and a GET to http://localhost or http://127.x.y.z with a plain path, against the TypeScript daemon (a claim with or without a title, a title of 1.1 MB, nested 300 and 1000 levels deep, with a lone surrogate, numbers such as 0.30000000000000004 or 1459077941253781.25 written as JavaScript writes them, an empty title, an unknown, missing, expired or orphaned code, a percent escape, /health, the banner) and a fake server answering 2xx/4xx/5xx JSON objects of every shape (ok, error and the session fields as strings, numbers, null, objects, arrays, keys twice, a lone surrogate in a key, escapes); the state file written as JSON.stringify(…, null, 2) does, with JavaScript's key order and numbers, lone surrogates as \\udxxx, and the daemon URL as URL.toString() writes it. The answer is read to its Content-Length, of any size. Handed back before the request: https, other hosts, a query, an unusual spelling, a path that starts with // (bun's fetch sends //pair/C and ///pair/C as /pair/C), a stdout-only terminal, and on Windows a state file in the current directory. Handed back after the request, where the whole answer shows that no comfy-ai daemon gave out a token (the JavaScript asks again; for a comfy-ai daemon that only reads): anything but a JSON object at a status below 500 (what is not JSON, such as the daemon's banner, an HTML page, a trailing comma or white space, since res.json()'s words for it change with bun's version; JSON that is an array, null or a string; an empty body, a byte order mark or bytes that are not UTF-8, which res.json() reads and no daemon sends); a redirect, an encoded or chunked body, two lengths, a status without a body; anything to a path that is not /pair/…; a failed connection (bun's words). Before the claim the binary checks that the state file can be written. After a claim it never hands back: a connection broken before the whole answer, a 5xx that is not a JSON object (bun's HTML error page where the daemon's handler threw after the claim), a value nested deeper than 1000 levels, or a write that fails after all end with the Rust-only message (the code is used up by then)."

