[[feature]]
name = ".env files bun loads by itself before the program starts"
status = "partial"
ts = "dede.ts:1 (#!/usr/bin/env bun)"
rs = "rs/src/env.rs"
proof = "rs/parity.json cases `bun env: …` (100 answered by the binary, 34 handed back as they should be)"
note = "Not written anywhere in the TypeScript, but real for the published command: .env.development.local, .env.local, .env.development and .env of the current directory (other names under NODE_ENV=production or test) are in process.env. So a DOTENV_KEYS_FILE or DOTENV_PRIVATE_KEY* in one of them is honoured, and every variable in them, the plaintext secrets included, is in the environment of each git dede starts and of the hooks git runs. Rust reproduces which files, their order, and the syntax where a value is literal: KEY=value, quoted values, a # comment, blank lines, CRLF, a repeated name. Not ported, so the invocation goes back: $ anywhere in a value (bun expands, in single quotes too), a backslash in quotes, values over several lines, backticks, a quote inside a bare value, `export`, indentation, names with . or -, a BOM, bytes that are not UTF-8; BUN_ENV, BUN_OPTIONS or NODE_OPTIONS in the environment; a bunfig.toml in the directory or the user's configuration; a .env that sets HOME, PATH, BUN_* or NODE_* (other than NODE_ENV). A directory whose .env or .env.local uses such syntax therefore runs every dede command through the JavaScript, as today. Files bun does not load (.env.production, .env.staging, …) may hold anything."

