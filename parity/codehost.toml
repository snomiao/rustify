status = "missing"
ts = "src/server.ts:22; src/server.ts:25; src/server.ts:28; src/terminal-ws.ts:243 listSessions"
note = "/api/health answers 200 `{ok:true}`. /api/sessions answers a JSON array with one object per terminal session of the process: key, cwd, cols, rows, clients, bufferBytes, startedAt, lastActivity, exited. Every other request is served from ./dist/public relative to the working directory, falling back to its index.html."

[[feature]]
name = "legacy server WebSocket /ws?cwd=&cols=&rows= (terminal attach, cwd validation)"
status = "missing"
ts = "src/server.ts:38; src/terminal-ws.ts:193 validateCwd"
note = "Validates cwd, creates or reuses the session for it (cols default 80, rows default 24) and upgrades the connection. Backslashes become `/`; the path must start with `/` or `<drive>:/` and must not contain `/../`; a directory that does not exist is created with its parents before the shell starts. A bad cwd gets 400 with the message as text (`cwd is required`, `invalid cwd: <raw>`); a request that cannot be upgraded gets 426 `WebSocket upgrade failed`. The `session` parameter that the bundled component sends is ignored."

[[feature]]
name = "legacy terminal sessions: one shared pty per cwd, 1 MiB replay, shell environment"
status = "missing"
ts = "src/terminal-ws.ts:133 getOrCreateSession; src/terminal-ws.ts:189 sessionKeyForCwd; src/terminal-ws.ts:113 bufferPush; src/terminal-ws.ts:59 spawnPty"
note = "The session key is `s_` plus the first 12 hex characters of sha256(cwd). All sockets for one cwd share one shell ($SHELL, else bash, no arguments; at least 10 columns by 2 rows) and all receive its output. A session survives every client leaving and is never reaped; only an exited one is replaced at the next connect. Output is kept up to 1 MiB (whole chunks dropped from the front, at least one kept) and replayed in order to every newly attached socket. The shell inherits the server's environment with TERM=xterm-256color, COLORTERM=truecolor, LANG and LC_ALL=C.UTF-8, ZDOTDIR and PROMPT_COMMAND set."

[[feature]]
name = "legacy terminal WebSocket messages (resize, ping/pong, cwd, input, session ended)"
status = "missing"
ts = "src/terminal-ws.ts:211 handleWsMessage; src/terminal-ws.ts:157; src/terminal-ws.ts:178"
note = "Client to server: text JSON `{type:'resize', cols, rows}` (applied 50 ms later) and `{type:'ping', t}`, answered `{type:'pong', t}`; any other text and every binary frame is written to the shell as input. Server to client: binary frames of the shell's output, text JSON `{type:'cwd', path}` when the shell's directory changes, and at exit the yellow line `[session ended]` as bytes. Input for an exited session is dropped."

[[feature]]
name = "legacy terminal: OSC 7 directory tracking and automatic replies to terminal queries"
status = "missing"
ts = "src/terminal-ws.ts:20; src/terminal-ws.ts:39; src/terminal-ws.ts:72; src/terminal-ws.ts:160; src/terminal-ws.ts:167"
note = "bash gets a PROMPT_COMMAND that prints OSC 7, put in front of an existing one; zsh gets ZDOTDIR=<tmp>/codehost-term-zshrc, whose .zshenv, .zprofile and .zshrc source the user's files and add a precmd hook. An OSC 7 path in the output (URL-decoded) that differs from the session's cwd updates it and is sent as a cwd message. When the output holds the device-attributes query (ESC [ c or ESC [ 0 c) the server writes ESC [ ? 1 ; 2 c back to the shell, and for the cursor-position query (ESC [ 6 n) it writes ESC [ 1 ; 1 R, so that programs do not block while no client is attached."

# ═════ The page and the Worker ═══════════════════════════════════════════════
# One summarising entry per area. All of it runs in a browser or on Cloudflare
# and is a candidate to stay TypeScript; what the daemon owes each area has
# its own entry above. Read by one reader (see the header); the bugs named
# here were read, not run.

[[feature]]
name = "page: Service Worker (/vs/<peerId>/* interception, bootstrap injection, asset caches, CDN rewrite)"
status = "missing"
ts = "src/web/sw.ts:11; src/web/sw.ts:36; src/web/sw.ts:56 cachedStatic; src/web/sw.ts:82 proxyCdn; src/web/sw.ts:96 proxyOverTunnel; src/web/sw.ts:165 injectBootstrap; src/web/tunnel-host.ts:18; vite.sw.config.ts:7"
note = "Registered as /sw.js with scope `/`. Every same-origin request under /vs/<peerId>/ goes to a page tab as a `tunnel-fetch` message (method, the full path with prefix and query, all request headers plus x-forwarded-host, a fully buffered body) and the answer comes back as head, body, end or error messages; with no page open it answers 502 `no codehost page open`, on a tunnel failure before the head 502 `tunnel error: <message>`, and it has no timeout. For HTML navigations it removes the content-security-policy headers and inserts `<script src=\"/__codehost/bootstrap.js\" data-peer data-base>`, a script it serves itself and which replaces window.WebSocket in the iframe; /__codehost/bootstrap.js therefore never reaches the daemon. VS Code's static assets (/stable-<40 hex>/static/) are cached first in `codehost-vs-static-v1` under a key without the peer id, which assumes that daemons do not alter them. Cross-origin GETs to *.vscode-cdn.net are rewritten to the Worker's /cdn route and cached in `codehost-cdn-v1`. Candidate to stay TypeScript."

[[feature]]
name = "page: tunnel client and the WebSocket shim for the VS Code iframe"
status = "missing"
ts = "src/tunnel/client.ts:144 fetch; src/tunnel/client.ts:223 openWs; src/tunnel/client.ts:74 failLane; src/tunnel/rtc-datachannel.ts:4; src/web/tunnel-websocket.ts:12; src/web/tunnel-host.ts:28"
note = "TunnelClient.fetch resolves to a web Response whose body streams as frames arrive, adds the gzip marker when the browser can inflate, pins each request to one channel (the bulk one when it is open) and rejects with the Error frame's message or `stream ended before head`. openWs returns sendText, sendBin and close, always on the interactive channel. When a channel closes, the requests pinned to it fail with `tunnel closed` and, for the interactive one, every WebSocket closes with 1006. The iframe's WebSocket class maps `new WebSocket(url, protocols)` to a WsOpen with the path /vs/<peerId>/<rest>; a refused open gives error, then close 1006 `tunnel open failed`. The browser data-channel adapter drops text messages. A Response is built with a stream body for every status, which browsers refuse for 204, 205 and 304. Candidate to stay TypeScript; the same client is what tunnel.test.ts drives the host with."

