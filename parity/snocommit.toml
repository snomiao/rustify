[[feature]]
name = "commit"
status = "verified"
ts = "src/index.tsx:155 gitCommit"
rs = "rs/src/commit.rs Plan::carry_out, message_safe"
proof = "rs/parity.json: every case that commits; `model:` cases with quotes, !, %, tabs, other scripts and paragraphs; `git: a pre-commit hook that refuses`, `git: a commit-msg hook sees the message and the key`; `limits:` cases (hooks printing 1 MiB exactly, 3 MB, 600,000 bytes that are not UTF-8)"
note = "Prints `Committing with message:`, a newline, a space and the message (console.log with two arguments). Then `git commit -m\"<message>\"` through /bin/sh with only `\"` escaped, echoed so (on a terminal, chalk's blue closed and opened around each line feed). A failed commit is not noticed. A hook whose output passes exec's 1 MiB gets git killed mid-commit (see \"git commands echoed\"): a pre-commit hook printing 3 MB means no commit, the files stay staged, and the pull and push run all the same; a post-commit hook printing 3 MB leaves the commit made and its summary unprinted. The binary does the same (it did not before the verifier's cases). The binary runs the same command line only for a message the shell takes literally inside double quotes: none of `$`, backquote or backslash, and no control character but line feed and tab. The others are handed back (see next entry)."

