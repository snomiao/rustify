proof = "rs/parity.json cases `setup: …` and `recheck2: setup: …` (73 answered by the binary); rs/src/setup.rs tests (package.json before and after, recorded under bun); rs/src/repo.rs tests (the hooks directory against git itself on 25 layouts); rs/perm-compat.sh; rs/tty-compat.py"
note = "Plain git hooks (new, existing, core.hooksPath in the repository's, the user's or the XDG configuration, husky's .husky/_), husky through package.json, the lefthook snippet, linked worktrees, and dede's own refusals on the way. Before its first write it looks at every file and directory the run will read, make or replace, in the hooks directory git will name. That it works out from git's configuration files without asking git, and resolves the way git prints it: a real path, through the git directory a .git file names and a linked worktree's common directory, every symbolic link followed step by step as git's strbuf_realpath_forgiving follows it, parts that do not exist kept as written (rs/src/repo.rs). So where a link decides whether the path ends in /.husky/_, the pre-read strips it where the TypeScript strips it from git's answer; at 2c2a075 it worked on the path as configured, and nine cases of a second check reached `dede: stopped at …` that way. See the next two entries for what goes back. Not covered: the refusal `.gitignore still does not ignore .env*` (no case produces a .gitignore the appended block does not fix)."

[[feature]]
name = "setup where the TypeScript would end in an uncaught error after its first write, or whose git configuration the pre-read does not read"
status = "missing"
ts = "dede.ts:880 setup; dede.ts:913 installHook; dede.ts:406 writeAtomic"
rs = "rs/src/setup.rs foresee_setup; rs/src/repo.rs hooks"
note = "dede.ts updates .gitignore (or a hook, or package.json) first and then meets what makes it end in bun's report of an uncaught error: core.hooksPath naming a file, a link to nowhere or a path through a file; a hook that is a directory or cannot be read; a hooks directory, or the directory it would be made in, that cannot be written; .husky a file or a link to nowhere; a file of another user in a sticky directory. Each of these also where a symbolic link leads there (a .husky, a .husky/_ or a hooks directory that is a link, an absolute or `~/` core.hooksPath through one, a linked worktree's .husky). The binary sees each of these before its first write and hands back (cases `setup: …` and `recheck2: setup: …` marked handback, rs/perm-compat.sh). So does a hooks path git itself would fail on (a part that is a file with more after it, more than 32 links), and a first write that fails anyway; the binary then removes its own temp file, so that what is left is the one the JavaScript leaves. Also handed back, since the hooks directory cannot be worked out with certainty: a git configuration with include or includeIf, a continued line, or core.hooksPath in quotes, with a comment, `..`, `~user` or `%(prefix)`; core.hooksPath in a system-wide configuration; core.worktree or extensions.worktreeConfig; GIT_DIR, GIT_COMMON_DIR, GIT_WORK_TREE or GIT_CONFIG* in the environment (or in a .env file bun loads); a GIT_CONFIG_NOSYSTEM that is no boolean. A system-wide configuration kept somewhere other than /etc, beside the git on PATH or Apple's places is not looked at; if it sets core.hooksPath to a directory that cannot be written, the binary says `dede: stopped at …` after updating .gitignore, where the TypeScript prints bun's report. Rare: setup runs once per clone."

[[feature]]
name = "setup with a package.json that is not plain JSON data"
status = "missing"
ts = "dede.ts:931 JSON.parse; dede.ts:938 JSON.stringify"
note = "The TypeScript rewrites package.json through JSON.parse and JSON.stringify. Rust does the same for objects, lists, strings, true/false/null and whole numbers (key order as JavaScript orders it). A number with a fraction or exponent (JavaScript would write it back in its own form), a lone surrogate escape, a package.json that is not an object, `scripts` or `devDependencies` that are not objects, or a file that is not JSON (the TypeScript ends in an uncaught SyntaxError after it has already updated .gitignore) go back before anything is written, and so do a byte order mark, a prepare script that is a list, a negative zero and nesting three hundred deep. Eight cases `setup: a package.json …` marked handback hold the line."

