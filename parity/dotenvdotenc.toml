status = "missing"
ts = "dede.ts:1077 an error that is not dede's own is thrown again; dede.ts:1084"
note = "Outside the per-file loop any error that is not dede's own ends the TypeScript in bun's report with source excerpt and stack: reading a directory in place of a file, a .env.keys that is a link to nowhere, a keys file or key-tree node with an unusable key, a directory that cannot be listed, a link keys link cannot make, and the setup situations of their own entry. Where Rust meets one of these before it has printed or changed anything it goes back, and the JavaScript prints that report. Inside the per-file loop the TypeScript prints `<file>: <ErrorName> (invalid key or file?)`; that is ported (cases `… a name every JavaScript object has`, `enc: an invalid key of that name`, rs/perm-compat.sh: a directory that cannot be written)."

