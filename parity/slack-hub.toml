# ───────────────────────────── Cross-cutting ─────────────────────────────

[[feature]]
name = "target forms (#channel, @user, permalink, raw id)"
status = "missing"
ts = "ts/slack.ts:1003 resolveChannel + ts/slack.ts:968 parseSlackPermalink"
note = "Handed back to the JavaScript. The first Rust version, which ran only without a package root, is kept in rs/src/legacy.rs but no longer reached; it differed as follows. Rust has #name (exact, case-insensitive), @user (normalised match on handle, real name, display name; existing DM only), app.slack.com/client/T…/C… links and raw ids. Absent: <workspace>.slack.com/archives/… permalinks (with ?thread_ts and &cid); `#C…` and `@U…` id forms; a bare U… id meaning the DM with that person; @me / @you / your own handle through auth.test; Slack Connect partners found through the DM list; the not-found error that says how many accounts were searched. Rust accepts any 9+ alphanumeric string as an id; TS requires C/D/G plus 8+ capitals or digits."

