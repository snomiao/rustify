# Parity ledger for dotenvdotenc (the `dede` command). Format and rules:
# parity/README.md.
#
# Written with the port, on the project's branch build/rust-port (the crate is
# rs/ there; nothing of it is on main yet, so read this ledger with
# `rustify audit dotenvdotenc --at <that worktree>`). TypeScript read in full
# at 18f80ca and left untouched: dede.ts (1,084 lines) and, of
# @dotenvx/primitives 3.0.3, the seven functions it calls.
#
# How the two fit together. The Rust binary is meant to be the installed
# `dede`. On Linux and macOS it answers every command of dede.ts itself and
# hands an invocation back to dede.ts only where it does not imitate the
# situation exactly (the `missing` and `partial` entries below say which;
# on macOS also a `get` that prints into a pipe or a socket); on Windows it
# hands everything back. It goes back before anything has been
# printed or changed: commands that only read collect their output and print
# it at the end, and enc, dec and setup first read everything they are going
# to read and foresee what they will make of it (the pre-read: rs/src/cli.rs
# precheck, Dede::foresee, setup.rs foresee_setup, rs/src/repo.rs). Status
# here is what the binary does on its own, so what goes back is `missing`.
#
# What "the TypeScript" turned out to mean. The published bin is dede.ts with
# `#!/usr/bin/env bun`, so before its first line bun loads .env, .env.local,
# .env.development and .env.development.local of the current directory into
# the environment (the project's own tests run with --no-env-file and do not
# see this). bun prints console.error in red when standard error is a
# terminal, or when FORCE_COLOR says so; when standard output is a terminal
# and standard error is not, it decides by TERM, COLORTERM, CI, TMUX and more.
# And bun's regular expressions give up on very large values where an
# ECMAScript engine in Rust does not. Each has its entry below.
#
# What the binary writes is meant to stay readable by a JavaScript-side dede
# (Windows, where everything is handed back, or DOTENVDOTENC_NO_NATIVE=1):
# it hands back before writing an .enc, a plaintext or a keys file that would
# come within a third of where bun's scanner gives up or half of where
# bun's upsert does (entry "values beyond bun's regular expressions").
#
# Proofs. All were run and seen passing on 2026-11-27 through
# rs/parity/proof.sh (the parity cases split into lanes run side by side,
# each TypeScript against the binary and then the hand-back check, beside
# the scripts below): on three machines against the branch at 00e176d, each
# with the bun it has, with 1.4.2 (what .bun-version pins and the parity job
# installs, through rustify's bun-pin.mjs) and with 1.4.5 (the latest, which
# the install test takes); and in CI at 6a3f40c, the parity job on
# linux-x64, darwin-arm64 and win32-x64 with bun 1.4.2 (on macOS GitHub's
# macos-26-arm64 image, a user with sudo, Homebrew's git 2.56.1). Between
# the two, the first CI runs on macOS called for three changes to the
# proofs themselves, none to the binary (the skip, tty-compat and
# perm-compat below); the counts here are those of 6a3f40c.
# - Linux x64: bun 1.4.0, 1.4.2 and 1.4.5, git 2.47.3, node 20.19.2, as root;
#   the glibc release binary with each, and with bun 1.4.2 also the static
#   musl binary the pipeline ships.
# - macOS 27.0.1 arm64: bun 1.4.4, 1.4.2 and 1.4.5, Apple Git 2.54.0
#   (Apple Git-157), python3 3.9.6; `node` there is bun 1.4.4 under node's
#   name; a binary built there; a user without sudo.
# - Windows 11 x64, in Git Bash: bun 1.4.2 and 1.4.5, Git for Windows
#   2.50.0, node 24.8.0; a binary built there (MSVC), the repository cloned
#   with core.autocrlf=true (.gitattributes keeps every file LF).
# rs/vectors.gen.mjs --check passed with every one of these buns, so what
# was read off bun 1.4.0 (hex and base64 leniency, scan, upsert and remove,
# node:path) is what each of them does; the parity cases and scripts hold
# the rest (its .env syntax, the colour rule, YAML and globs, the limits of
# its regular expressions, how it writes into a pipe) for each.
# - rs/parity.json (written by rs/parity.gen.mjs, with rs/parity.more.mjs, the
#   285 cases of a first independent verifier, and rs/parity.recheck.mjs, the
#   63 of a second check): 1,180 cases through rustify's parity runner,
#   TypeScript against the binary. Compared: stdout, stderr, the exit code,
#   the `after` probes (files and modes, the .enc read back with
#   @dotenvx/primitives, the sync record checked against the files, commits)
#   and, in every case the binary answers, the list of git calls it made, in
#   order, noted by a git placed in front of git. No normalisation rule is
#   used. The `get` cases print into regular files (the runner's "capture":
#   "files"), where both implementations write a value whole on every
#   system and every byte is compared; four keep the runner's pipes (entry
#   "get … into a pipe or a socket"). TypeScript against TypeScript the
#   cases are the same too: on Linux with bun 1.4.2 (1,180), on macOS with
#   1.4.4 (1,180), on Windows with 1.4.2 (the 1,100 that run there).
# - the same cases with `--handback`, as the cases say for each system:
#   Linux 999 answered by the binary, 181 handed back; macOS 997 and 182
#   (two cases of `get` printing a value into a pipe go back there), and 1
#   skipped there: a 70 KB value into a socket, handed back everywhere, so
#   both sides are dede.ts, and on macOS, where a socket takes 8,192 bytes
#   at once, how much bun gets out before its exit depends on how fast the
#   runner reads (CI saw the TypeScript lose the end; rs/pipe-compat.py
#   holds that get on macOS against readers it controls); Windows
#   all 1,100 that run handed back, 80 skipped there because they cannot
#   mean the same (65 with a symbolic link, which Git Bash's ln -s copies;
#   2 with a file name Windows does not keep; 11 with a PATH without git
#   made of links; 2 with a umask). A `verified` below rests only on cases
#   the binary answered, on Linux and macOS.
# - rs/cross-compat.sh (Linux, macOS): the two implementations taking turns
#   on the same files (14 checks), dotenvx 2.31.1 reading what the binary
#   encrypted and the binary reading what dotenvx encrypted (with
#   DOTENVX_NO_NATIVE=true: dotenvx 2.31 otherwise keeps the keys it makes in
#   the system's key store, the macOS Keychain among them).
# - rs/tty-compat.py (Linux, macOS): 53 scenes on a pseudo-terminal, under
#   several TERM, COLORTERM, CI, NO_COLOR and FORCE_COLOR values; a run with
#   a stand-in package checks that each is handed back, or answered, as it
#   says (on macOS the scene of get into a pipe goes back). It keeps its own
#   handle on each terminal until the command has been read: the terminal is
#   not the command's controlling terminal, and macOS drops what is unread
#   in such a terminal when the command exits and nothing else holds it (CI
#   on macOS lost 6 scenes' output so before 6a3f40c).
# - rs/pipe-compat.py (Linux, macOS): 18 scenes of `dede get` into a pipe or
#   a socket that is read only once the command has exited (empty, partly
#   filled, full, larger, left non-blocking, shared with standard error),
#   with the same stand-in check; on macOS the 17 that can be made there
#   (F_SETPIPE_SZ is Linux's), every one handed back.
# - rs/perm-compat.sh (Linux, macOS): 24 scenes where the file system
#   refuses something, with the same stand-in check: on Linux as root, run
#   as nobody; on the Mac, without sudo, the 19 that need only the user's
#   own file or directory without the permission (where the others make it
#   root's), the 5 that need a file of another user not run. In CI it runs
#   all 24 on Linux and macOS as the runner's user, with sudo making what
#   belongs to root: seen on macOS in CI at 6a3f40c, all 24 the same, once
#   the script took its work directory's real path (TMPDIR is under /var
#   there, a link to /private/var, which bun's error reports name).
# - `cargo test` in rs/: scan, upsert and remove on 340 dotenv sources, keys
#   and ciphertexts, node:path, UTF-8, hex and base64 decoding, globs, dates,
#   all against values recorded from bun and @dotenvx/primitives
#   (rs/vectors.gen.mjs writes rs/src/testdata/), the measured limits of
#   bun's regular expressions, and the hooks directory as git names it,
#   asked of git itself on 25 layouts of links, worktrees and .git files.
#   28 tests on Linux and macOS, the 27 that are compiled on Windows.
# - the project's own tests (dede.test.ts, `bun --no-env-file test`), with a
#   throwaway HOME: 105 pass on Linux (bun 1.4.0, 1.4.2, 1.4.5) and macOS
#   (1.4.4, 1.4.2, 1.4.5); on Windows 103 pass with 1.4.2 and 1.4.5, the two
#   about POSIX modes skipping themselves there.
#
# Not covered by any of it, by construction: linux-arm64 and darwin-x64,
# where the binary answers as on Linux x64 and macOS arm64 but no case runs,
# and win32-arm64, where it hands everything back as on Windows x64 (the
# parity job runs on linux-x64, darwin-arm64 and win32-x64; the install test
# runs the three smoke lines on all six); a disk that fails between two
# writes, output into a closed pipe, and anything about timing. For a pipe
# whose reader is slow the outcome under bun depends on what the pipe takes
# at the moment of each write: `dede get` is handed back unless the room is
# certain (entry "get … into a pipe or a socket"); console.log and
# console.error wait for the reader under bun, as every write of the binary
# does, except in a pipe that another program (bun among them) has left
# non-blocking, where both lose the messages there is no room for (seen the
# same in the scenes tried; the reader's timing beyond that is not covered).
#
# Rust-only behaviour (no TypeScript counterpart; to be blessed or removed):
# DOTENVDOTENC_NO_NATIVE=1 hands every invocation back, and
# DOTENVDOTENC_PACKAGE_ROOT tells the binary where the package is (both from
# rustify's template). A binary without the npm package beside it answers
# what it would hand back with one line and exit 1. And one line for what the
# pre-read cannot foresee: if something the port does not imitate shows only
# after enc, dec or setup has started to write, it prints `dede: stopped at
# something this build does not handle; run it again with
# DOTENVDOTENC_NO_NATIVE=1` and exits 1 instead of handing back. At 24d24a9
# an independent verifier reached it in five setup scenes and one enc scene;
# at 2c2a075 a second check reached it in nine setup cases and three scenes
# where a symbolic link decides whether the hooks path ends in /.husky/_ (git
# names the hooks directory with its links resolved, and the pre-read had
# worked the path out as configured). The pre-read now finds all of these:
# it names the hooks directory the way git resolves it (rs/src/repo.rs
# real_path_forgiving, held against git by a cargo test), and hands back
# where git would fail (cases `setup: …` and `recheck2: setup: …` marked
# handback, rs/perm-compat.sh, case `enc: a damaged sync record that git
# finds …`). What can still reach it: a write that fails after another
# succeeded for a reason the pre-read does not look at (a full disk, a file
# made immutable, another process changing the files meanwhile), and a
# core.hooksPath set in a system-wide git configuration kept somewhere other
# than /etc, beside the git on PATH, or Apple's places, that names a hooks
# directory that cannot be written. The TypeScript ends in bun's report of an
# uncaught error there; the binary says it stopped. None of the cases or
# scenes of the proofs reaches it now.

reconciled = "18f80ca"

# ───────────────────────────── Commands ─────────────────────────────

[[feature]]
name = "get NAME [file…]"
status = "verified"
ts = "dede.ts:613 get; dede.ts:1044 dispatch"
rs = "rs/src/dede.rs get; rs/src/cli.rs"
proof = "rs/parity.json cases `get: …` (169 answered by the binary on Linux, 167 on macOS; into regular files but for four); rs/cross-compat.sh; rs/tty-compat.py (the newline after the value on a terminal); rs/pipe-compat.py (into pipes and sockets: on Linux 9 of 18 scenes answered by the binary, on macOS none)"
note = "Raw value from the .enc, last assignment wins, several files, every refusal with its exit code. About 9 ms against 180 ms under bun on the machine it was measured on. A NAME that every JavaScript object has (constructor, toString, …) goes back: the TypeScript ends in an uncaught TypeError there. Printing into a pipe or a socket is native only where the whole value certainly fits; the next entry is the rest."

[[feature]]
name = "get of a value into a pipe or a socket without certain room for it"
status = "missing"
ts = "dede.ts:637 process.stdout.write; dede.ts:1084 process.exit"
rs = "rs/src/out.rs stdout_takes; rs/src/dede.rs get"
note = "The TypeScript prints the value with process.stdout.write and then calls process.exit(). Under bun that write does not wait for a pipe or a socket: what there is no room for at that moment is lost (measured on bun 1.4.0: `dede get BIG | slow-reader` gets 65,536 bytes of a value of 70,000; into a pipe already holding 1,000 bytes, 61,808; into a full one, nothing; `bun dede.ts get BIG | wc -c` gave 65,536 in one run and 98,198 in another). This is a TypeScript defect, copied rather than fixed. At 2c2a075 the binary printed the whole value. Now it answers into a file, a terminal or /dev/null, and on Linux into a pipe with room for the value after what is waiting in it and what this run prints there first (F_GETPIPE_SZ and FIONREAD, counted in whole pages, one more for a page partly read and one per earlier write), or into a Unix stream socket with nothing waiting and at most 32 KiB to take (half its send buffer less 4 KiB, if that is less). Everything else is handed back before anything is printed: a larger value, a socket of another kind, a socket standard error shares after a warning, and on macOS any pipe or socket with a value to print. In practice values up to 64 KiB into `| cmd` or `$(dede get …)`, and up to 32 KiB into a pipe node or bun gives a child (a socket), stay native on Linux. macOS: bun loses the same way there (macOS 27, bun 1.4.4: a pipe read after the exit gets 65,536 bytes of a larger value, a socket 8,192; 64,536 after 1,000 bytes already waiting), and the binary does not ask macOS for the room. What could be asked was measured on that Mac and is for the owner to weigh: fstat of a pipe's writing end gives the bytes waiting (st_size) and the buffer's size (st_blksize, 16,384 growing to 65,536), FIONREAD there gives 0, and a socket tells neither (SO_SNDBUF stays 8,192, SO_NWRITE 0). rs/pipe-compat.py: 18 scenes on Linux, 9 handed back; 17 on macOS, all handed back. Since the binary goes back after it has read the files, and git where get asks it (`git ls-files` of a plaintext beside the .enc), such a get on macOS asks git twice. The parity cases of get print into regular files, so that they hold on every system; four keep the runner's pipes, the two with a value marked handed back on darwin."

