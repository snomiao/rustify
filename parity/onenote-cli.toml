status = "missing"
ts = "src/index.ts:802; src/cache.ts:1326 isCacheEmpty; src/cache.ts:923 syncCache"
note = "No index, or one without pages: the TypeScript looks through the cache directory and starts a sync when that is empty too. Every user's first search. 2 cases."

[[feature]]
