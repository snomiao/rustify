# ─────────────────────── Shared by every step ───────────────────────

[[feature]]
name = "git commands echoed, their output passed through"
status = "missing"
ts = "src/index.tsx:6 snorun"
note = "Every git command is printed to stdout as `> <command>` in blue before it runs, and its stdout and stderr are piped through as they come, so diffs, logs and git's own errors show. The colour is chalk's: supports-color reads FORCE_COLOR, TERM, COLORTERM, CI variables and whether stdout is a terminal (not NO_COLOR), and also looks for --color, --no-color and their variants among the command's own arguments. Commands run through child_process.exec (a shell, the default buffer limit) and their exit codes are ignored."

[[feature]]
name = "errors end the program as unhandled rejections"
status = "missing"
ts = "src/cli.ts:5"
note = "cli() is called as `cli().then()`, so every throw above reaches the runtime as an unhandled rejection: node prints the file and line, the source line with a caret, the error and its stack and `Node.js v<version>`, and exits 1 (for a thrown string: node's ERR_UNHANDLED_REJECTION text naming it); bun, which runs it when node is missing, prints its own report. The paths of the installed files are part of that text, so it cannot be reproduced and these errors have to be handed back. Seen by running without arguments: `Missing description (desc)` and `commit type not found: undefined` under node 20, and the first under bun 1.4.0, each with exit code 1."

