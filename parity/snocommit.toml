# Parity ledger for snocommit. Format and rules: parity/README.md.
#
# First full pass, 2026-11-27, written by reading the code at a683fcd, the
# commit the project's branch build/rustify-pipeline starts from (that branch
# adds the crate, rs/, and changes no TypeScript). Read in full: everything
# under src/ (cli.ts, commitTypes.ts, index.tsx, promptT.ts; 288 lines
# without the two spec files), postbuild.ts, package.json, README.md, the
# release workflow, and the bundle `bun run build` makes of them (dist/cli.js),
# which is where the code of snorun, phpdie, package-up, tsa-composer and
# z-chat-completion was read. The openai SDK was not read.
#
# Nothing was run beyond the commands without arguments. snocommit has no
# --help or --version, and any command given arguments runs git (see the
# hazards below). Run: the built dist/cli-feat.js, dist/cli-chore.js and
# dist/cli.js with no arguments under node and bun, in an empty directory
# outside any git repository, with a home directory of its own and a `git`
# first on PATH that only logged its calls (it logged none); and the six
# installed commands with no arguments, through rustify's install smoke test.
# No test was run, no service was contacted. No entry cites a proof.
#
# How it fits together. `bun run build` bundles src/cli.ts into dist/cli.js
# (`#!/usr/bin/env node`, so node runs it), and postbuild.ts copies that file
# to dist/cli-<type>.js for the six commit types, the files `bin` names for
# chore, docs, feat, fix, refactor and styles. One program, which learns its
# commit type from the name of its own file. Given a scope and a description
# it stages files, asks OpenAI to write a conventional commit message from the
# diff, commits, pulls and pushes, printing every git command as it goes.
#
# Status. The crate on build/rustify-pipeline hands every invocation to the
# command's own dist/cli-<command>.js, so every feature below is `missing`.
# Nothing is `dropped`: that is the owner's decision.
#
# Grain. The six commands are one file with the type as its only difference,
# so they are one entry; then one per step of the pipeline, per source of the
# API key, and per behaviour shared by every step (the echo of git commands,
# how errors end the program).
#
# No entries, and why:
# - postbuild.ts: the build step that makes the command files; it is not run
#   by users. projects.toml counts only src/.
# - `breaking`: README.md lists it as a command, but it is not a commit type
#   and has no `bin`. The published 0.1.0 still carries a dist/cli-breaking.js
#   from an older build.
#
# What is published differs from main. npm's latest is 0.1.0 (2025-10-24),
# package.json on main says 0.1.1, and release.yml's semantic-release has
# npmPublish: false. 0.1.0's command files start with `#!/usr/bin/env bun`,
# so bun runs them there and loads the current directory's .env files first
# (an OPENAI_API_KEY in a project's .env is used); main's build is run by
# node, which loads none. 0.1.0 also has other dependencies (execa, ink,
# react). The bins are the same seven names in both, and in both `snocommit`
# names dist/cli-snocommit.js, which neither contains: npm and bun install no
# `snocommit` command (checked with both, into a prefix of their own).
#
# Hazards for whoever ports or tests this. Every command with a scope and a
# description runs `git add`, `git commit`, `git pull` and `git push` in the
# current directory, and sends the diff and recent commit subjects to OpenAI
# with the user's key. Without a description it stops before any git command
# (`Missing description (desc)`), and the generic form without a known type
# stops at `commit type not found`. Parity cases need a git repository of
# their own with a bare remote of their own, and a stand-in for the OpenAI API
# on 127.0.0.1 (the SDK reads OPENAI_BASE_URL); a `git` shim that logs its
# arguments shows what each side asked of git.

reconciled = "a683fcd"

# ───────────────────────────── Commands ─────────────────────────────

[[feature]]
name = "chore, docs, feat, fix, refactor, styles <scope> <description…>"
status = "missing"
ts = "src/cli.ts:8 cli; src/commitTypes.ts:2"
note = "The type is the name of the running file: process.argv[1] matched against /(?:cli-|bin\\/)(.*?)(?:\\.[mc]?[tj]s)?$/ and kept when it is one of fix, styles, feat, docs, chore, refactor. The first argument is the scope, the rest joined with single spaces is the description. The match takes the leftmost `cli-` or `bin/` anywhere in the path, so an install path with one before the package (a home directory such as /home/robin/) leaves the type unrecognised, and the command then behaves as the generic form with its first argument as the type. Before the binary, node saw the symlink's path for an npm install (`…/bin/feat`, which the `bin/` alternative catches); handed back, it sees the real path, dist/cli-feat.js; both give `feat`."

[[feature]]
name = "snocommit <type> <scope> <description…> (the generic form)"
status = "missing"
ts = "src/cli.ts:17"
note = "When the file name gives no type, the first argument is the type, the second the scope, the rest the description. An unknown or missing type throws `commit type not found: <first argument>` (`undefined` when there is none) before anything else runs. Not reachable as an installed command: `bin` points `snocommit` at dist/cli-snocommit.js, which the build never makes (postbuild.ts copies only the six types), so neither npm nor bun installs it; rustify.bins leaves it out for that reason. Reached by running dist/cli.js itself, or through an install path the type match misreads (previous entry)."

[[feature]]
