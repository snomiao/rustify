rs = "rs/src/url.rs:45 parse; rs/src/url.rs:34 ctl; rs/src/url.rs:81 plain_path; rs/src/net.rs:130 connect; rs/src/cli.rs daemon_message"
proof = "rs/parity.json; rs/parity/proof.sh"
note = "Native and proven for a daemon at http://localhost or http://127.x.y.z (plain decimal, a port without a leading zero, any path, no query, fragment or user): ws://…/ctl with `token=` form-encoded (URLSearchParams), `cannot reach daemon at <url> — is `comfy-ai serve` running?` for no connection, a refused or odd upgrade, a token whose tab closed. For pair's GET, a path that fetch sends as it is written: no dot segment (also not percent-encoded), nothing it would encode, and not // at its start (bun's fetch collapses a run of leading slashes; inner ones it keeps). Handed back: https/wss (needs TLS), other hosts (bun's DNS and connect rules), upper case, numeric shorthand, a query, an empty URL or one that is not a URL (bun's TypeError words). parseDaemonMsg as JSON.parse (any depth) and `v === 1`, binary frames read as their UTF-8 text, as bun's client does; messages up to 128 MiB, as bun's client takes them (above it list goes back and eval waits out its timer, see there)."

[[feature]]
