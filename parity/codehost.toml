note = "A bun HTTP and WebSocket server (hono, bun-pty). It listens on PORT (default 3001) on every interface, allows any origin, has no authentication, and prints `Codehost server listening on http://localhost:<PORT>`. Loading it writes the three zsh files of the directory-tracking entry into the temp directory. README calls it the legacy web terminal scaffold."

