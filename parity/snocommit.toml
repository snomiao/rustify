proof = "rs/parity.json (269 cases, 174 answered by the binary on Linux, 161 on macOS where node is bun); rs/parity/proof.sh"
note = "Native on Linux and macOS, for every situation the entries below do not hand back; on Windows see \"the six commands on Windows\". The type is the name of the running file: process.argv[1] matched against /(?:cli-|bin\\/)(.*?)(?:\\.[mc]?[tj]s)?$/ and kept when it is one of fix, styles, feat, docs, chore, refactor. The binary is started under the command's name and hands back unless the path of the JavaScript it would start gives that same type, as node spells it (path.resolve) and as bun does (the real path): the match takes the leftmost `cli-` or `bin/` anywhere in the path, so an install path with one before the package (a home directory such as /home/robin/) leaves the type unrecognised in the TypeScript, and the command then behaves as the generic form; the binary hands that back. The first argument is the scope, the rest joined with single spaces is the description. Each of the six has a plain case and a case without arguments; `feat` has the rest. Before the binary, node saw the symlink's path for an npm install (`…/bin/feat`, which the `bin/` alternative catches); handed back, it sees the real path, dist/cli-feat.js; both give `feat`."

[[feature]]
