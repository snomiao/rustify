note = "One-shot commands wait out Retry-After for up to 120 s in total, one stderr line per wait. Rust does not look at the HTTP status."

[[feature]]
name = "error messages and exit codes"
status = "partial"
ts = "ts/cli.ts:6142 + ts/cli.ts:1210 friendlySlackError + ts/cli.ts:8916"
rs = "rs/src/slack.rs:31 + rs/src/main.rs:180"
note = "Both exit 1 on a Slack API error. Text differs: Rust prints `Error: Slack error on <method>: <code>`; TS prints the bare message, with the query string after the method on GET calls, and maps common codes (missing_scope, channel_not_found, …) to guidance on write commands. Usage errors exit 2 in Rust (clap) and 1 in TS (yargs .fail). TS's command-specific codes have no Rust counterpart: 2 for refusals, ask 2..7, poll 3, stream 0/2/3, inbox nudge 1, 141 on a closed pipe."

[[feature]]
name = "--help and usage errors"
status = "partial"
ts = "ts/cli.ts:6135"
rs = "rs/src/main.rs:109"
note = "Rust has clap's generated help for its six commands; the text is not yargs'. Rust reads the token before parsing arguments, so `slack --help` without SLACK_MCP_XOXP_TOKEN fails with `Error: environment variable not found`. TS is strict (unknown commands and flags are errors) and prints the message, then the help, on a usage error."

[[feature]]
