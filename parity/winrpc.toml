# Parity ledger for winrpc. Format and rules: parity/README.md.
#
# First full pass, 2026-11-27, written by reading the code at 91cda75, the
# commit the project's branch build/rustify-pipeline starts from (that branch
# adds the crate, rs/, and changes no TypeScript). Read in full: every file
# under src/ (src/index.ts, server.ts, auth.ts, redact.ts, lease.ts,
# ui-lock.ts, ahk.ts, powershell.ts, screenshot.ts, ocr.ts, tray.ts; 1,802
# lines), the two PowerShell scripts the server runs (src/ps/), ocr.py and
# ocr-mac.py, the AutoHotkey templates in ahk/, scripts/, the three test
# files, README.md, SPEC.md, docs/ and package.json. No dependency was read
# (there is no node_modules and no lock file in the repository): what yargs,
# Elysia, systray2 and bun do around the program is assumed from what the
# code asks of them, and the notes say so.
#
# Nothing was run beyond --help: `winrpc --help` and the --help of serve,
# ahk-repl, lock and tray, installed from a locally packed release by
# rustify's smoke test with a home directory of its own, in an empty working
# directory. No server was started, no client command was run, no service
# was contacted, and no test was run. No entry cites a proof.
#
# How it fits together. `winrpc` is one bun program, src/index.ts (yargs). Its
# default command, `serve`, starts an HTTP server (Elysia on Bun.serve) that a
# Windows desktop is driven through: AutoHotkey v2 scripts, PowerShell,
# screenshots, OCR, and a UI lock that other programs on the machine share
# through a file. The other commands are its clients: `ahk-repl` and `lock`
# talk to a server over HTTP, `tray` shows a Windows tray icon for the server
# on this host. The access token is created by the server in ./.env.local on
# its first start, and everything the program prints is passed through a
# redaction of that token.
#
# Status. First port, 2026-11-28, on build/rustify-pipeline (the branch of
# pull request snomiao/winrpc#4), the TypeScript unchanged at 91cda75. The
# binary answers itself, on Linux, macOS and Windows: `lock` / `lock show`
# against an http URL of an IPv4 address, or of localhost on macOS and
# Windows (its GET, and what it prints of every answer a winrpc server
# gives; localhost on Linux goes back, entry `client URLs of localhost on
# Linux`), what every client command says before it sends anything (no
# URL, a URL that is not one,
# `lock acquire` without --owner, `lock renew|release` without a lease),
# the --help pages, the redaction of what it prints, and the plain part of
# bun's .env syntax. Everything else goes to src/index.ts before anything
# was printed or sent: `serve`, `tray`, every request that changes
# something (`lock acquire|renew|release`, `ahk-repl`), a connection that
# fails, usage errors, --version, and an answer bun would not get out
# whole through a pipe (entry `an answer bun would not get out whole`).
# WINRPC_NO_NATIVE=1 hands everything back (checked: all 381 cases that
# run without a terminal reach the JavaScript with it). Nothing is
# `dropped`: that is the owner's decision.
#
# Repaired after an independent verification (2026-11-28), which found two
# differences: for `localhost` bun asks ::1 first on macOS (and, as it
# turned out, on Windows), where the binary asked 127.0.0.1; and bun on
# Linux loses what a pipe has no room for, where the binary printed all of
# it. Both now go the TypeScript's way (entries `client URLs …` and `an
# answer bun would not get out whole`). The verifier's 70 cases are in the
# cases file (`verify: …`).
#
# Repaired again after CI (run 46115378859, bun 1.4.5 on ubuntu-24.04),
# where the Linux parity job found four localhost cases with servers on
# both ::1 and 127.0.0.1 in which the TypeScript reached ::1 and the binary
# 127.0.0.1. The repair had taken bun on Linux to ask 127.0.0.1 alone, as
# measured on one machine with bun 1.4.0: that was a property of that
# machine and of that bun. bun 1.4.0 asks getaddrinfo with AI_ADDRCONFIG,
# and glibc counts no loopback address for it, so where ::1 is the only
# IPv6 address (a container on an IPv4-only network, as that machine is)
# the answer is 127.0.0.1 alone, even from a hosts file that names ::1;
# where any other IPv6 address is configured, a link-local one too, both,
# ::1 first unless gai.conf says otherwise. bun 1.4.1 and later
# (oven-sh/bun#38818) answer localhost themselves, ::1 then 127.0.0.1,
# whatever the hosts file, gai.conf and the addresses are: measured on the
# same machine, bun 1.4.5 goes to ::1 and bun 1.4.0 to 127.0.0.1, and the
# binary of ed3c18e against the TypeScript gives CI's four differences
# there with bun 1.4.5 and none with bun 1.4.0. The binary cannot know
# which bun will run the JavaScript, so on Linux it now hands localhost
# back before it connects (entry `client URLs of localhost on Linux`);
# macOS and Windows are unchanged.
#
# The proof is rs/parity/proof.sh in the project: rs/parity.json (389
# cases, written by rs/parity.gen.mjs), every case run behind a stand-in
# winrpc server on 127.0.0.1 (rs/parity/with-mock.mjs, which also compares
# what each side asked the server), TypeScript against the binary, the
# --handback check, and on Linux and macOS the comparison again with stdout
# and stderr on a terminal; plus cargo test, which holds the URL reader and
# the redaction to what bun itself records for some 3,600 URLs and 4,100
# texts (rs/vectors.gen.mjs, checked again with each system's bun by
# proof.sh). Run at bdd5d63, all passing, each system with its own bun and
# with bun 1.4.5 (downloaded from its release into a directory of the
# proof's own; the same in both runs):
#   Linux x64      bun 1.4.0, 1.4.5: 256 answered by the binary, 133 handed back
#   macOS 27 arm64 bun 1.4.4, 1.4.5: 267 answered, 122 handed back
#   Windows 11 x64 bun 1.4.2, 1.4.5: 260 answered, 119 handed back, 10 skipped
#                  (8 need a terminal, 2 a symlink)
# CI at bdd5d63 (run 46121019987): all 17 checks pass, the parity job on
# linux-x64, darwin-arm64 and win32-x64 included, with bun 1.4.5.
# TypeScript against TypeScript, at 408659b: all 389 the same on Linux and
# macOS, 379 on Windows. (The first port's proofs, at da6aba6, also ran
# with bun 1.4.5 on all three.)
# The workflow runs it on linux-x64, darwin-arm64 and win32-x64. The binary
# also answers natively on linux-arm64, darwin-x64 and win32-arm64, which
# the pipeline builds and smoke-tests but no proof has run on.
#
# Seen on Windows when the package was unpacked without node_modules: the
# TypeScript then fails (`Cannot find package 'yargs'`) while the binary
# still answers its native commands. The binary does not look for its
# dependencies; an installed package always has them.
#
# Rust-only behaviour, for the owner to bless or have removed: the
# request headers of the binary's GET (see the note of `lock / lock show`).
#
# Grain. One entry per command and subcommand, per HTTP route, and per
# behaviour with its own module or test file (token, redaction, templates,
# AutoHotkey runner, lock file, lease, request queue). Minor flags and the
# variables that only switch one feature are in that feature's note.
#
# No entries, and why:
# - scripts/ (install-schtask.ps1, serve-loop.ps1, the .vbs launchers,
#   wx-tray.ps1): Windows supervisor scripts. They run `bun src/index.ts`
#   from a git checkout they keep up to date themselves, never the installed
#   command, so the port does not reach them. They are not TypeScript.
# - ocr.py and the PowerShell and AutoHotkey files are what the server runs;
#   they are part of the features that run them. ocr-mac.py is not run by
#   any code.
# - Code no route or command reaches (package.json has no `main` or
#   `exports`): ahkEscape (src/ahk.ts:25), runPowerShell (src/powershell.ts:3),
#   withUiLock (src/ui-lock.ts:153), withUiQueue (src/server.ts:42).
#
# Hazards for whoever ports or tests this. Plain `winrpc`, and `winrpc` with
# only --host or --port, is `winrpc serve`: it listens on 0.0.0.0:12371 by
# default and creates ./.env.local. A server answers anyone with the token by
# running AutoHotkey and PowerShell on the desktop. The client commands send
# the token to whatever URL they are given. Parity cases need a stand-in
# server on 127.0.0.1 for the clients, and `serve` cases need a port of
# their own and a working directory of their own.

reconciled = "91cda75"

