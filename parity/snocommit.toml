# Parity ledger for snocommit. Format and rules: parity/README.md.
#
# First full pass, 2026-11-27, written by reading the code at a683fcd, the
# commit the project's branch build/rustify-pipeline starts from (that branch
# adds the crate, rs/, and changes no TypeScript). Read in full: everything
# under src/ (cli.ts, commitTypes.ts, index.tsx, promptT.ts; 288 lines
# without the two spec files), postbuild.ts, package.json, README.md, the
# release workflow, and the bundle `bun run build` makes of them (dist/cli.js),
# which is where the code of snorun, phpdie, package-up, tsa-composer and
# z-chat-completion was read.
#
# Second pass, 2026-11-28: the port. The openai SDK the lock file pins
# (6.15.0) was read where the program touches it: the client takes its
# address from OPENAI_BASE_URL (trimmed; empty means
# https://api.openai.com/v1), also reads OPENAI_ORG_ID, OPENAI_PROJECT_ID,
# OPENAI_WEBHOOK_SECRET and OPENAI_LOG, sends JSON.stringify of the request,
# retries twice after a connection error, 408, 409, 429 or 5xx, parses the
# answer as JSON when its media type says so, and throws in its own words
# otherwise. So both implementations can be pointed at a stand-in on
# 127.0.0.1, and the cases compare the whole flow against it.
#
# Third pass, 2026-11-28: repairs after an independent verifier's run (porting
# guide, step 8). The verifier reproduced every proof below at 4ce844f and
# wrote 111 cases of its own; 9 differed on the Mac, 8 on Linux. Each was
# reproduced here first, against the binary as it was (Linux, and Apple git
# 2.54 on the Mac), then repaired or handed back:
# - git's output passed through as bytes, where node's exec passes it on as
#   UTF-8 text (U+FFFD for what is not UTF-8): repaired (rs/src/sh.rs);
# - a hook printing more than 1 MiB: exec kills the command (SIGTERM to the
#   shell, both pipes closed), so the TypeScript neither commits nor pushes,
#   and the binary did both: repaired, the same kill;
# - a post-index-change hook set in git's configuration (hook.<name>.event)
#   and a clean filter that writes into the work tree, both of which git ran
#   for the binary's copy of the index too (the filter made the binary stop
#   with exit 1 and the files staged): handed back now, with every setting
#   and variable through which git runs a program of the user's while it
#   adds, shows the status or diffs, and with submodules;
# - a `node` that is a hard link or a copy of bun was taken for node:
#   repaired (the binary asks that node what it is);
# - the copy of the index was readable by every user of the machine (0755
#   and 0644 in /tmp): its directory is 0700 now.
# Found here while repairing, by the whole cases file run on a terminal
# (which the porting guide asks for, and proof.sh now does):
# - the binary passed stdout and stderr on in another order than node when
#   both pipes were ready at once (git commit's error and the unmerged path
#   it prints at exit): it now takes them in the order the kernel reports,
#   as libuv does (epoll, kqueue);
# - bun's exec, unlike node's, leaves the pipes open when it kills a command
#   past 1 MiB: on the Mac (bun as node, bash as /bin/sh, which forks git) a
#   pre-commit hook printing 1.8 MB got its commit made and pushed on a
#   terminal; where bun may run the JavaScript, a repository with a hook is
#   handed back now.
# The verifier's cases are in rs/parity.json under their own names: four of
# them marked handed back since, one kept on pipes in the terminal run (the
# TypeScript itself orders its two streams either way there), and one marked
# for where node is bun instead of for macOS. Thirteen more pin the repairs.
#
# How it is proven. rs/parity.gen.mjs writes rs/parity.json, 269 cases, each
# in a git repository of its own with a bare repository under <ROOT> as the
# remote that is pulled from and pushed to, fixed names and dates for every
# commit (so hashes are equal), and rs/parity/with-mock.mjs in front of both
# sides: a server on 127.0.0.1 that answers in OpenAI's place (named in
# OPENAI_BASE_URL, which the SDK and the binary both read, and which the
# JavaScript a binary hands back to inherits; the wrapper refuses any other
# address), and a log of every request it got, method, path, Authorization,
# Content-Type, Accept and the body byte for byte, which every case prints
# afterwards. The TypeScript side is `node dist/cli-<command>.js`, what the
# binary hands back to and npm publishes; the binary is started under the
# command's own name. After each run a case prints the commits, the working
# tree, the remote's commits and the request log. rs/parity/proof.sh runs
# them in lanes, TypeScript against the binary, on Linux and macOS again with
# stdout and stderr a terminal (--tty stdout,stderr, the whole file), then
# the --handback check once per command (each command hands back to a file
# of its own). The workflow (.github/workflows/rust-npm-release.yml) runs it
# on linux-x64, darwin-arm64 and win32-x64.
#
# Run here, 2026-11-28, at commit 570b0ec (the last commit changing the
# crate or the cases), each run all 269 cases, the whole file again on a
# terminal where there is one, and the --handback check, with
# rs/parity/proof.sh:
# - Linux x64 (Debian, node 20.19.2, bun 1.4.0, git 2.47.3), 4 lanes: all
#   269 the same; 174 answered by the binary, 95 handed back, as the cases
#   say; on a terminal (--tty stdout,stderr) all 269 the same. cargo build
#   and clippy without a warning (also checked for macOS and Windows), cargo
#   test 27 passed.
# - macOS 27 arm64 (Apple git 2.54), where `node` is a link to bun 1.4.4, so
#   the TypeScript runs under bun, 3 lanes: all 268 the same (1 skipped:
#   APFS refuses a file name that is not UTF-8); 161 answered by the binary,
#   107 handed back (95, and 12 where node is bun); on a terminal all 268
#   the same; cargo test 27 passed.
# - Windows 11 x64 (node 24.8.0, bun 1.4.2, Git for Windows 2.50, in Git
#   Bash, a clone with core.autocrlf=true), 3 lanes: all 134 the same, all
#   134 handed back, as the cases say; 135 skipped (30 terminal cases, 93 of
#   the verifier's and 12 pinning repairs, all aimed at the native path,
#   which Windows does not take); cargo test 24 passed.
# The porter's earlier runs (at 4ce844f, 145 cases) also used bun 1.4.5 on
# all three systems; this pass did not. The project's own tests (bun test,
# 12) pass on Linux and the Mac with a throwaway HOME. The install rehearsal
# (pack.mjs and smoke.mjs, bun and npm, Linux x64, openai 6.15.0 and zod
# 4.3.5 served by a second local registry with no upstream, so nothing came
# from registry.npmjs.org) passed every smoke line of the workflow. Found on
# the Mac and repaired in the cases, not in the binary: under bun a proxy
# variable sends the stand-in's own request through the proxy (the case sets
# NO_PROXY), how often git runs a post-index-change hook depends on timing
# (the case's hook is silent), and the runner's terminal cases run with
# LC_CTYPE=UTF-8 there (terminal.py's python3 sets it for what it starts,
# PEP 538), in which macOS's tr writes \377 as two bytes (the case's hook
# uses LC_ALL=C). Found on Windows: the request log wrote the body as a JSON
# string, so the prompt's cwd was escaped twice, a spelling the runner does
# not recognise; it is written as it came now.
#
# Not covered by any proof: the real service (never contacted; see "the
# request to api.openai.com"), Linux arm64, macOS x64 and Windows arm64 (only
# the install test runs there), the musl build the pipeline ships (built in
# CI only), real node on macOS (CI runs it; the Mac here has bun as node, so
# the 12 cases marked for where node is bun are native only on Linux here),
# bun versions other than 1.4.0, 1.4.2 and 1.4.4 for these 269 cases (1.4.5
# only for the porter's 145), and the CI workflow itself (nothing pushed).
#
# How it fits together. `bun run build` bundles src/cli.ts into dist/cli.js
# (`#!/usr/bin/env node`, so node runs it), and postbuild.ts copies that file
# to dist/cli-<type>.js for the six commit types, the files `bin` names for
# chore, docs, feat, fix, refactor and styles. One program, which learns its
# commit type from the name of its own file. Given a scope and a description
# it stages files, asks OpenAI to write a conventional commit message from the
# diff, commits, pulls and pushes, printing every git command as it goes.
#
# How the binary does it (rs/src/commit.rs). The TypeScript stages first and
# only then finds out whether there is anything to commit, what the model
# answers and whether it answers at all; every failure after that ends it as
# an unhandled rejection. The binary may hand back only while it has printed
# and changed nothing, so it finds all of that out first, on a copy of the
# index (GIT_INDEX_FILE, in a directory of its own under TMPDIR, removed
# afterwards): it stages into the copy, reads the status and the diffs from
# it, reads the log, asks the model once and checks the answer. Only then
# does it run the TypeScript's git commands for real, in its order, through
# the same /bin/sh, with the same output, and the status, diffs and log must
# come out as they did on the copy (else it stops, see "Rust-only").
#
# What users see differently, and the owner should know before anything is
# announced:
# - Nothing is printed until the model has answered. The TypeScript prints
#   the git commands and "Generating commit message with gpt-4o..." first and
#   then waits for the model; the binary waits first and then prints all of
#   it at once (the same bytes). That is the price of handing back safely.
# - The common setup goes to the model over HTTPS at api.openai.com. The
#   binary does that natively (rustls, Mozilla's roots, no proxy), but no case
#   can run it, so it is the one unproven part of the native path (its own
#   entry below).
# - A machine where `git lfs install` has run (filter.lfs.* in ~/.gitconfig)
#   hands every invocation back, as does a repository with submodules, a
#   textconv or external diff, an fsmonitor or hooks set in git's
#   configuration (see "repository states"): git would run those programs
#   for the binary's copy of the index too. git-lfs is common.
#
# TypeScript defects found, reported to the owner, not copied where they are
# a hazard (the binary hands those situations back, so users see no change):
# - Security: the model's message goes to the shell inside -m"…" with only
#   `"` escaped, so `$(…)`, `${…}` and backquotes in it run (known to the
#   owner).
# - Security, found here: every line of `git status --porcelain` goes to the
#   shell unquoted as `git diff --cached -- <line>`, so a file name with `$(…)`
#   or a backquote in it (one git does not quote, such as `$(touch${IFS}x)`)
#   runs that command as soon as someone runs feat/fix/… in a repository that
#   has such a file, a cloned one for instance. Case "prompt: a file name with
#   a command in it".
# - Data loss, found here: a staged rename is the status line `R  old -> new`,
#   whose `>` the shell takes for a redirection: the diff of `old` is written
#   over the working-tree file `new` (the index keeps the content, the file on
#   disk is replaced by diff text). Case "prompt: a rename".
# - The scope, the user's own argument, goes to the shell unquoted too
#   (`feat 'a;touch x' …` runs touch). Case "scope: shell syntax".
# - Not hazards, reproduced as they are: the status letters become pathspecs
#   (`M  a.txt` asks git diff for `M` and `a.txt`), `??` is a shell glob, a
#   name starting with # comments out the rest of its line, from a
#   subdirectory every diff is empty (the status has paths from the root, git
#   diff reads them from the current directory), git's exit codes are ignored
#   ("Commit pushed successfully." after a failed commit or push), and the
#   log has no final line feed, so "Generating commit message…" follows the
#   last commit on the same line.
#
# Rust-only behaviour, with no TypeScript counterpart, for the owner to bless
# or remove:
# - SNOCOMMIT_NO_NATIVE=1 hands every invocation back (the template's way out).
# - SNOCOMMIT_PACKAGE_ROOT tells the binary where the package is.
# - RUSTIFY_HANDBACK_TRACE set to anything not empty makes the binary write
#   `rustify: handed back to the JavaScript` to stderr when it hands back
#   (hand-back helper v5; the install test's [native] and [handback] marks
#   read it). Neither the JavaScript nor git and its hooks get the variable.
# - The binary runs `git rev-parse --git-path index --git-path
#   hooks/post-index-change --git-dir --show-toplevel` and `git config
#   --get-regexp <the settings that run programs>` first, then every add,
#   status and diff twice (on the copy, then for real) with `git ls-files
#   --stage -z` on the copy between the add and the status, and the log twice
#   (once to read it, once for real). The copy's `git add` writes into
#   .git/objects the blobs the real one then finds there. git runs no program
#   of the user's for the copy: every setting and variable through which it
#   would (clean filters, textconv and external diffs, fsmonitor, hooks set
#   in the configuration, a post-index-change hook, gpg for log signatures,
#   trace files, submodules) hands back before the copy is made or used
#   (see "repository states"). The copy lives in a directory of its own
#   under TMPDIR, mode 0700, removed afterwards; killed (SIGKILL) while it
#   works on the copy, the binary leaves that directory behind.
# - Where none of the files bun reads is in the way, nothing more; otherwise
#   the binary runs the `node` on PATH once, `node -e` with a line that
#   prints whether it is bun, in the current directory, its output kept and
#   ten seconds at most, to know whether bun would run the JavaScript.
# - Interrupted while it waits for the model, the binary leaves nothing
#   staged; the TypeScript has staged the files by then.
# - Should the status, a diff or the log come out differently for real than
#   on the copy (something else changed the repository meanwhile), it commits
#   nothing and ends with a line naming SNOCOMMIT_NO_NATIVE=1, exit code 1,
#   with what `git add` staged left staged. The verifier reached it, every
#   time, with a clean filter that wrote a file into the work tree (git ran
#   the filter for the copy, so the real `git add .` found the file and took
#   it in). Such settings are handed back now, and no case reaches it since;
#   reaching it is a bug or a race.
# - Its request has User-Agent `snocommit/<version>` and none of the SDK's
#   X-Stainless-* headers, and no Accept-Encoding (not compared; the service
#   does not depend on them as far as is known).
# - Where node is older than 18 the TypeScript cannot reach the model (no
#   fetch), and the binary can.
# - Where there is no `node` on PATH at all, the published command did not
#   start before the port (`#!/usr/bin/env node`: env reports that node is
#   missing, exit code 127). Now the binary answers natively, or its hand-back
#   runs the JavaScript with bun (js_fallback's runtimes), which then works.
# - A binary without the npm package beside it answers what it would hand
#   back with one line and exit code 1.
#
# What is published differs from main. npm's latest is 0.1.0 (2025-10-24),
# package.json on main says 0.1.1, and release.yml's semantic-release has
# npmPublish: false. 0.1.0's command files start with `#!/usr/bin/env bun`,
# so bun runs them there and loads the current directory's .env files first
# (an OPENAI_API_KEY in a project's .env is used); main's build is run by
# node, which loads none. 0.1.0 also has other dependencies (execa, ink,
# react). The bins are the same seven names in both, and in both `snocommit`
# names dist/cli-snocommit.js, which neither contains: npm and bun install no
# `snocommit` command (checked with both, into a prefix of their own).
#
# Hazards for whoever ports or tests this. Every command with a scope and a
# description runs `git add`, `git commit`, `git pull` and `git push` in the
# current directory, and sends the diff and recent commit subjects to OpenAI
# with the user's key. Without a description it stops before any git command
# (`Missing description (desc)`), and the generic form without a known type
# stops at `commit type not found`. Never run it outside a case's own
# repository, and never without OPENAI_BASE_URL pointing at a stand-in.

reconciled = "a683fcd"

