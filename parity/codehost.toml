status = "missing"
ts = "src/web/conn-broker.ts:28; src/web/conn-shared-worker.ts:25"
note = "All tabs of the origin share one WebRTC connection per server: the owner tab holds the channels and the others send their fetch and WebSocket calls to it through a SharedWorker (messages hello, welcome, ping, bye, acquire, role, ready, release, rpc, rpc-reply, promoted, owner-gone). When the owner leaves, or is silent for 15 seconds, another tab is promoted and dials anew. Without a SharedWorker, or after 2.5 seconds without coordination, each tab connects directly. The daemon just sees fewer connections, and a fresh offer from another peer id after a failover. Candidate to stay TypeScript."

