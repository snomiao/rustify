# Parity ledger for Comfy-AI (npm package comfy-ai, command `comfy-ai`).
# Format and rules: parity/README.md.
#
# First written by reading the code at aa56999 (1.2.2), 2026-11-27; brought
# up to date with the port on the project's branch build/rustify-pipeline
# (pull request snomiao/Comfy-AI#1), 2026-11-28, and again after an
# independent verification of the port the same day (its 136 cases are in
# the cases file, named "v: …"). Read it with `rustify audit Comfy-AI --at
# <that worktree>`. The TypeScript has not changed since aa56999; the branch
# adds rs/, the workflow and .gitattributes only.
#
# What the binary answers itself: logout, pair, list, send, kill and eval,
# in their plain spellings, and a bare `comfy-ai`, on Linux, macOS and
# Windows. Everything else goes to dist/cli.js, before the binary has
# printed, written or sent anything: serve (the daemon), tail and attach,
# --help, --version, yargs's usage errors, and the situations the entries
# below name.
#
# The proof is rs/parity.json (479 cases, written by rs/parity.gen.mjs),
# run by rs/parity/proof.sh: TypeScript (dist/cli.js under bun) against the
# binary, the --handback check (exactly the cases marked "handback" for the
# system reach the JavaScript), and on Linux and macOS the comparison again
# with stdout and stderr a terminal. Run at the branch's e1c8ced (08df5cc
# after it changes a comment of the workflow only), all passing: Linux x64
# with bun 1.4.0 (4 lanes, 10.5 min), macOS arm64 (macOS 27) with bun 1.4.4
# (3 lanes, 15 min, cargo test beside it): 479 cases the same, 358
# answered by the binary, 121 handed back, the terminal run the same;
# Windows 11 x64 in Git Bash with bun 1.4.2 (3 lanes, 10 min, cargo test
# beside it): 445 the same, 326 answered by the binary, 119 handed back, 34
# skipped there (26 need a terminal, 3 a POSIX file mode, 3 a symbolic link,
# 1 a no_proxy that bun on Windows does not pass on, 1 a command line over
# Windows' limit). Not run with bun 1.4.5 after the repair. The workflow
# runs it on linux-x64, darwin-arm64 and win32-x64 (not yet run in CI:
# nothing was pushed). No
# case reaches a real daemon, a browser or the network: a case that talks to
# a daemon runs the TypeScript's own daemon (`serve --port 0`) with stand-in
# browser tabs and a recording proxy, or a fake daemon that answers by rules
# (rs/parity/stand-in.mjs), and compares every request, frame and close the
# command made, what the tabs received, the daemon's own log and the state
# file it left. Every case has COMFY_AI_DAEMON set, so none can reach a
# daemon on 127.0.0.1:7437.
#
# Rust-only behaviour, with no TypeScript counterpart, for the owner to bless
# or remove: COMFY_AI_NO_NATIVE=1 hands every invocation back;
# COMFY_AI_PACKAGE_ROOT tells the binary where the package is;
# RUSTIFY_HANDBACK_TRACE makes it say on stderr that it handed back; and a
# message `comfy-ai: …; this build does not handle that, run the command with
# COMFY_AI_NO_NATIVE=1 …`, exit 1, after a request that cannot be taken back,
# in these situations only (none of them in the cases, since the TypeScript
# answers them otherwise): a tab whose title (pair) or the daemon's error
# message (eval) is nested deeper than 1000 levels (the TypeScript manages up
# to about 4,200, where bun's String() runs out of stack); an eval stdout or
# stderr that is truthy but not a string (the TypeScript prints bun's
# TypeError report and waits out its 60 s); a connection that breaks before
# the whole answer to a pairing claim has come, or a claim answered by a 5xx
# that is not a JSON object (a comfy-ai daemon gives the first only when it
# dies, the second where its handler throws after the claim: see below);
# and a state file that cannot be written after the claim although it could
# be just before.
#
# For the owner, found on the way (the binary is bug-compatible, or hands the
# situation back, unless said otherwise):
# - eval: bun loses output through a pipe. cmdEval writes the tab's stdout
#   with process.stdout.write and the handler calls process.exit right
#   after, which drops what is still unwritten: of 3,000,000 bytes, 65,536
#   to 196,608 arrived through `| wc -c` (bun 1.4.0, measured by the
#   verifier and again after the repair). The binary writes all of it. Whether it should copy the
#   loss is the owner's decision; the cases compare such output in regular
#   files, where bun writes everything.
# - The daemon passes what a tab sends on unchecked: a title, an exitCode,
#   stdout and stderr of any JSON type. A title nested deeper than about
#   40,000 levels makes the daemon's Response.json throw after the claim:
#   the tab is told `paired` and a token is issued, but the CLI gets bun's
#   HTML error page with status 500 and fails with res.json()'s words (`error:
#   Failed to parse JSON` under bun 1.4.0, `error: JSON Parse error:
#   Unrecognized token '<'` under 1.4.4), so that pairing is lost; the binary
#   ends with its Rust-only message there. Deeper than about 4,200 levels the
#   TypeScript CLI writes the state and then fails with `error: Maximum call
#   stack size exceeded.`
# - bun's own words change between versions in two places the cases met:
#   res.json() of a body that is not JSON (`Failed to parse JSON` in 1.4.0,
#   JavaScriptCore's `JSON Parse error: …` in 1.4.2 and 1.4.4), and a
#   WebSocket message over 128 MiB (1.4.0 drops the connection and fires no
#   `error`, so `list` waits for ever; 1.4.4 fires `error`, and `list` fails
#   with `list failed`). Both go back where they can.
# - On Windows bun's mkdirSync('.', { recursive: true }) throws EEXIST, so
#   the TypeScript cannot write a state file in the current directory there
#   (COMFY_AI_CONFIG_DIR empty); `list` waits for ever when the daemon closes
#   without answering; `eval` with a non-string stdout or stderr prints
#   bun's TypeError report and then waits out its 60 s; bun's ws.close()
#   ends with code 1000 or with no code, by bun version and timing; bun
#   creates ~/.bun in the home directory it runs with; the state file keeps
#   the token in clear text with the umask's mode; /spa takes any origin, and
#   any /ctl client may act on any session (see the daemon entries).

reconciled = "aa56999"

# ───────────────────────────── The command ─────────────────────────────

[[feature]]
