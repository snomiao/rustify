note = "Linux and macOS. The expression itself is FTS5's: Rust hands SQLite the same MATCH text and the same SQL. An expression FTS5 rejects goes back (see the section-files entry); on macOS the TypeScript's SQLite is the system's 3.54.0 and the binary's 3.54.1, and every expression case agreed."

[[feature]]
name = "search output on a terminal (colours, clickable titles)"
status = "verified"
ts = "src/index.ts:12 isTTY; src/index.ts:30 colour helpers; src/index.ts:40 link"
rs = "rs/src/search.rs Paint; rs/src/main.rs machine"
proof = "rs/parity.json every case, run with `python3 rs/parity/terminal.py` in front of both implementations (a pseudo-terminal as stdin, stdout and stderr; what was written to it is compared byte for byte), on Linux and on macOS; rs/parity/terminal.py"
note = "Linux and macOS, where the search is ported. Whether stdout is a terminal is asked the same way by both there (isatty). terminal.py copies the terminal's output itself: python 3.9's pty.spawn, the python3 of macOS's command line tools, waits forever once the command has ended on macOS. Not on Windows (no pty; the binary hands a search on a console back anyway)."

[[feature]]
name = "search index: reading .onenote/search.db"
status = "verified"
ts = "src/cache.ts:500 SEARCH_DB_PATH; src/cache.ts:1555; src/cache.ts:529 schema"
rs = "rs/src/search.rs search_index"
proof = "rs/parity.json the `search state: an index …` and `search state: tags …` cases (an index closed cleanly, one as a finished sync leaves it, one whose rows are still in the write-ahead log, one without the full-text table), with the files left beside the index compared in every case"
note = "Opened read-only, as the TypeScript opens it; nothing but SQLite's own -shm/-wal files is written. The indexes in the cases are built by rs/parity/make-db.ts with the TypeScript's schema, not by a sync, and are left as a finished sync leaves them (an empty -wal file and the -shm file beside the index); 6 cases start from an index closed cleanly. On macOS the TypeScript reads with the system's SQLite, which needs the -wal file (see its entry). Ranking is SQLite's bm25: two pages whose ranks differ only in the last bit could come out in another order under another C library's log(); none of the cases is that close, on Linux or macOS."

[[feature]]
name = "search: the time of the last sync, and --since (time zone named in TZ)"
status = "verified"
ts = "src/index.ts:821 parseSince; src/index.ts:902 fmtDate; src/index.ts:1022 last synced"
rs = "rs/src/time.rs"
proof = "rs/src/time.rs every_zone_is_read_as_the_runtime_reads_it, run by `cargo test` in rs/ with rs/parity/runtime-time.ts on Linux and on macOS: all 598 zone names of the compiled-in database against bun started under that TZ, 22.9 million answers, 1.0 million of them --since spans (on macOS for editions 2026e and 2026f of the system's data); rs/parity.json the `search time: …` and `search since: …` cases; the other time::tests (values printed by bun)"
note = "Linux and macOS. Local time comes from the tz database compiled into the binary (jiff-tzdb 1.0.0: tzdb 2026f), the runtime's from ICU's (78.3 inside bun 1.4.0 on Linux; on macOS the system's ICU 78.1 and the edition of the data the system has, see the entry on macOS's zone data). On macOS rs/src/time.rs has a list of its own, from editions 2026e and 2026f: Cuba's winter of 2026 (2026e), and CST6CDT, EST5EDT, MST7MDT and PST8PDT at every time (macOS's ICU does not know these names under TZ and shows UTC); Western Canada, Morocco, Bogota and Tehran, which go back on Linux, agree there and are native. What follows is about Linux. The two are different editions and differ on 16 zone names: every winter from November 2026 on in Western Canada (America/Vancouver, Edmonton, Winnipeg, Inuvik, Yellowknife, Rainy_River, Canada/Pacific, Mountain, Central), the winter of 2026 in Cuba (America/Havana, Cuba), from September 2026 on in Morocco (Africa/Casablanca, El_Aaiun), one day of 1992 in America/Bogota and one hour of 1979 in Asia/Tehran and Iran. The independent verification found 13 of these; the test found Bogota and Tehran. rs/src/time.rs lists zone and stretch (READ_DIFFERENTLY_BY_THE_RUNTIME), and the binary hands back whenever the index's time, the present moment for a --since span, or the moment the span comes back to lies in a listed stretch or within three days of it. So in Western Canada, Cuba (until March 2027) and Morocco every search that prints `last synced` for a current index goes back today, and users there see no speed-up until bun carries newer data. Also handed back: any time before 1970 or after 2099 (not compared; before 1970 the two databases are known to differ in many zones), a --since day that does not exist or lies before the year 1000, and a span of more than four digits. The format is en-US whatever the locale: bun 1.4.0 does not read LANG or LC_*. The test asks bun for `--since` with the runtime's memory of clock changes cleared before each question, as it is in a process that works out one date: asked in a row, bun itself answers an hour off around clock changes less than three weeks apart (America/Argentina/Tucuman in 2004 and nine more zones). What the proof cannot reach: it compares with the bun that runs the test. A user's bun with another edition of ICU's data can differ from the binary in whichever zones changed between the editions, and nothing in the binary can see which edition the runtime has. CI runs the test with the bun it installs, so a new bun or a new jiff-tzdb that changes the list fails there and prints the lines to add. Handed back among the cases: 25 for a listed stretch or a time outside 1970 to 2099, 6 for a --since day or span Rust does not read, 14 for a TZ that is not a zone's name."

[[feature]]
name = "search: the system's time zone (no TZ in the environment)"
status = "partial"
ts = "src/index.ts:1023 toLocaleString"
rs = "rs/src/time.rs local_zone"
note = "The common setup on a desktop. Without TZ the runtime asks ICU for the system's zone; Rust takes the name the link /etc/localtime points at (…/zoneinfo/<name>; on macOS /var/db/timezone/zoneinfo/<name>) and then reads that zone from its own database, exactly as for a name in TZ, with the same listed stretches handed back. On macOS the 2 cases ran on a Mac whose zone is Asia/Tokyo and agreed; on Linux the cases compare it only where the system's zone is UTC (2 cases; the machine the cases ran on, and CI's runners): a private mount namespace to give the two another /etc/localtime was denied to the verifier and to the repair. Compared once by hand instead, and not kept as a test: with a preloaded library that answers readlink() and realpath() for /etc/localtime (bun and the glibc build of the binary both ask through libc; the static build that is shipped cannot be given one), 46 runs under 20 system zones behaved the same, 43 answered by the binary: Asia/Tokyo, Europe/Berlin, America/New_York and 11 more in winter and summer, zones whose file is itself a link on Debian 13 (UTC, GMT, America/Montreal, Arctic/Longyearbyen, Asia/Istanbul, America/Yellowknife), and --since spans. Where the link leads to a second link ICU follows to the end and Rust stops at the first name, which are two names of one zone. Until a test of this is kept and run in CI the status stays below `verified`. Handed back: no /etc/localtime, one that is a copy and not a link (slim container images), or a name that is not in the compiled-in database; what the runtime prints there could not be tried (setting TZ makes such a machine take the Rust path). On a machine whose zone is in Western Canada, Cuba or Morocco the two `search time: the system's zone` cases are handed back and the --handback check fails on them."

[[feature]]
name = "auth setup"
status = "verified"
ts = "src/index.ts:1103"
rs = "rs/src/main.rs auth_setup; rs/src/auth_setup.txt"
proof = "rs/parity.json the `auth setup: …` cases that are not marked handback (6; one of those, a package directory with `?` in its name, does go back in the comparison and is unmarked only because the --handback check gives every case a stand-in directory)"
note = "Prints the guide. Compiled for every platform and native on all of them; compared on Linux, macOS and Windows by the parity job (linux-x64, darwin-arm64, win32-x64: 6 cases on Linux and macOS, 5 on Windows, where the one with `?` in the package directory cannot be made), and the install test's smoke lines (`[native] onenote auth setup`, `[native] onenote-cli auth setup`) fail on any of the six platforms where the binary does not answer it itself (that test runs only in CI, and has not run with these lines yet). Only exactly `auth setup`; with any other argument it is yargs's. On a Windows console it is handed back: no console was ever compared, and Rust's standard library counts a Git Bash window as a terminal, which the runtime may not. The machine states under `search: machine states that go back` send it back too (a variable named for the runtime, a bunfig.toml, a .env file with the letters that matter, a package directory bun cannot load from); 3 cases and an unmarked one."

# ─────────────── Situations a ported command hands back ───────────────

[[feature]]
