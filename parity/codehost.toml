note = "A valid token after `#t=` is added to the joined rooms and removed from the address bar; with no deep link the page then connects by itself once that room has exactly one server. Several rooms can be joined at once, each with its own signaling socket; the token form applies the shared policy. localStorage keeps `codehost.rooms` (the joined tokens, in clear), `codehost.history` (repo key to token, hostId, kind, folder, name, host, lastConnected), the legacy `codehost.token` (read, never written) and `codehost.signal`, which overrides the signaling URL (default ws(s)://signal.<page host>, ws://localhost:8787 on localhost). A hidden tab does not reconnect to signaling and wakes on visibility, focus or coming back online. Candidate to stay TypeScript; the CLI's part is to keep printing the `#t=` form."

