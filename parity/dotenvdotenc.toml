rs = "rs/src/dede.rs check_sync_record; rs/src/repo.rs possible_records"
note = "A record that is not a JSON object, holds a number other than a whole one, or whose entry for the file is not an object of strings: the TypeScript goes on with whatever JavaScript makes of it (a list is `no record`, null is a TypeError). All of these go back. For enc and dec that has to be known before the first write, and git's answer comes later, so the pre-read looks at every record git could take: up the path as written and the real one, past a .git directory git passes over (at 24d24a9 an empty one made the binary stop half-way), in a parent repository too; and at every entry. A record of another shape anywhere there, or an entry of another file that is not of dede's shape, sends enc and dec back (conservative); so does GIT_DIR or GIT_COMMON_DIR in the environment. Only a hand-edited or damaged record gets there."

