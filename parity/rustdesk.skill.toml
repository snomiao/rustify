[[feature]]
name = "stdout that cannot be written (a reader that has gone, a full disk)"
status = "partial"
ts = "bin/rustdesk-skill.ts:61 printJson; bin/rustdesk-skill.ts:136 console.log"
rs = "rs/src/run.rs finish, stdout_unwritable; rs/src/main.rs bun_write_error"
proof = "rs/parity.json (r list: stdout…, r status: stdout…, r ocr…: stdout…, r connect: stdout…, r scroll: stdout…); rs/parity/run.sh PARITY_STDOUT"
note = "printJson (list, status, ocr --json, connect) writes with process.stdout.write, whose failure bun reports as an uncaught error with a stack trace through the installed files and its version line, exit 1 (EPIPE: broken pipe, write; ENOSPC: no space left on device, write). The binary cannot print that report: list, status and ocr --json hand back when their write fails before anything is out (stdout first when it is not the same file as stderr, whose order then cannot be seen), and the JavaScript fails the same way, status and ocr --json taking their screenshot and OCR again; connect hands back before its first act when stdout is closed, a pipe or socket nothing reads any more, or /dev/full. ocr's lines (console.log) and everything on stderr (console.error) ignore failures in bun as in the binary: native, exit 0. Not imitated: stdout that stops taking output while connect works, after it has acted (a reader that leaves during the seconds a real connect takes, a disk that fills up): the binary then exits 1 with the first lines of bun's report but without the stack trace and the version line. Linux: a gone reader and /dev/full; macOS: a gone reader (no /dev/full); Windows hands everything back (the cases are skipped there: no mkfifo in Git Bash). rs/parity/run.sh makes the gone reader without waiting for anyone (the FIFO opened for reading and writing, then for writing, the first closed), since a reader in the background raced the writer's open on macOS (see the fourth pass); the 9 cases ran 30 times on pipes and on a terminal on macOS and on Linux, the same every time."

