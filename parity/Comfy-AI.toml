note = "Only tail and attach print them, and both are handed back."

[[feature]]
name = "wire protocol v1 (JSON text frames between tab, daemon and CLI)"
status = "partial"
ts = "ts/protocol.ts"
rs = "rs/src/cli.rs frame; rs/src/cli.rs daemon_message"
proof = "rs/parity.json; rs/parity/proof.sh"
note = "The CLI side the ported commands speak, compared byte for byte against a recording stand-in and end to end against the TypeScript daemon: list, send, eval and abort frames out; sessions, evalResult and error in. subscribe (tail, attach) and the whole daemon side (serve) are not ported."
