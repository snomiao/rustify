note = "Rust reads TEXT (or NULL where the TypeScript copes with it), tag lines that are a JSON list of { tag, text }, and dates as Microsoft Graph writes them (YYYY-MM-DDTHH:MM:SS[.fraction] with Z or ±HH:MM). A NULL or blob title or body, tag lines of another shape, or a date in another notation (`March 1, 2026`, which Date reads) goes back; for several of these the TypeScript itself fails with yargs's help. 11 cases."

