# Parity ledger for onenote-cli. Format and rules: parity/README.md.
#
# Written with the port, on the project's branch build/rust-port (TypeScript
# at 9af05e1, untouched; read in full: src/index.ts, src/cache.ts,
# src/auth.ts, and the rest of src/ for what each command reaches). The crate
# is rs/ on that branch and nothing of it is on main yet, so read this ledger
# with `rustify audit onenote-cli --at <that worktree>`.
#
# What is ported: `onenote search <query>` where a synced Linux machine or
# Mac is (an index with pages in it), and `onenote auth setup` on Linux,
# macOS and Windows. On Windows the search is not compiled in and every
# search is handed back. Everything else is handed to src/index.ts, the file
# the published package runs (`npm view onenote-cli bin`), before anything
# is printed. Status below is what the binary does on its own, so what is
# handed back is `missing`.
#
# Per system. The cases (rs/parity.json, 572, written by rs/parity.gen.mjs)
# say for each system who answers each: Linux 381 the binary, 191 the
# JavaScript; macOS 388 and 183, 1 not run; Windows 5 and 563, 4 not run.
# The workflow's parity job runs them on linux-x64, darwin-arm64 and
# win32-x64 (`parity-platforms`), with rs/parity/proof.sh. linux-arm64,
# darwin-x64 and win32-arm64 run the same code and get only the install
# smoke lines.
#
# Every `verified` below was seen to pass on the branch at de8f69d, from the
# repository root after `bun install`, on three machines:
#
#   sh rs/parity/proof.sh <rustify>/templates/parity/parity.mjs <binary>
#
# Linux x64, against the static musl binary built with cargo-zigbuild as the
# pipeline builds it (bun 1.4.0, whose SQLite is 3.53.2 and whose time zone
# database is ICU 78.3's; the binary's SQLite is 3.54.1, the one rusqlite
# 0.43 bundles, and its zone database is tzdb 2026f, jiff-tzdb 1.0.0's):
#   → plain: all 572 case(s) behave the same
#   → terminal: all 572 case(s) behave the same
#   → handback: 381 case(s) answered by the binary, 191 handed back to the JavaScript, as the cases say (twice)
#   → zones: 598 zones, 22893434 answers compared with the runtime, 1021160 of them --since spans
#            test result: ok. 26 passed
#   and TypeScript against TypeScript, on pipes and on a terminal: all 572 the same.
#
# macOS 27.0.1 arm64, against the darwin-arm64 binary built with
# cargo-zigbuild on Linux, as the pipeline builds it (bun 1.4.4, which on
# macOS uses the system's ICU 78.1 with its time zone data, edition 2026e on
# that Mac, and the system's SQLite 3.54.0; python3 3.9):
#   → plain: all 571 case(s) behave the same (1 skipped on darwin)
#   → terminal: all 571 case(s) behave the same
#   → handback: 388 case(s) answered by the binary, 183 handed back to the JavaScript, as the cases say (twice)
#   → zones: 598 zones, 22955113 answers compared with the runtime, 1007924 of them --since spans;
#            the runtime's time zone data here: edition 2026e; test result: ok. 26 passed
#   and the zone test again with ICU_TIMEZONE_FILES_DIR pointing the system's
#   ICU at edition 2026f, which that Mac had downloaded beside it: ok.
#   and TypeScript against TypeScript: all 571 the same.
#
# Windows 11 x64, against the binary built there with cargo (MSVC), in Git
# Bash (bun 1.4.2, node 24.8): the comparison and the --handback check run in
# lanes, one parity run per group of cases (rs/parity.gen.mjs --groups):
#   → plain0..3: every group "all N case(s) behave the same" (568 cases, 4 skipped on win32)
#   → handback0..1: 5 case(s) answered by the binary, 563 handed back to the JavaScript, as the cases say
#   → unit: test result: ok. 5 passed
#   in 534 s on a machine with 24 threads; and TypeScript against TypeScript
#   (ts.py on both sides) for the `auth setup: ` and `cli: ` groups: all the
#   same.
#
# which is what CI runs (proof.sh says what it starts on each system, side
# by side):
#
#   node rs/parity.gen.mjs --check
#   P=<rustify>/templates/parity/parity.mjs
#   node $P --cases rs/parity.json --ts "sh rs/parity/ts.sh" --rs <binary>
#   node $P --cases rs/parity.json --rs <binary> --handback ONENOTE_CLI_PACKAGE_ROOT=src/index.ts
#   both again with `python3 rs/parity/terminal.py` in front of each
#   implementation, which gives it a pseudo-terminal (Linux and macOS);
#   cargo test --locked --manifest-path rs/Cargo.toml
#
# On Windows the TypeScript side is `python -I rs/parity/ts.py` instead of
# ts.sh: Git Bash's sh drops a TZ such as America/New_York on the way to a
# Windows program, and the TypeScript then showed the system's local time
# where the binary's hand-back showed the zone's (found there). There is no
# terminal run on Windows (no pty there, and the runner has none either), and
# no zone comparison: the search, which alone reads a zone, is not compiled
# for Windows.
#
# What the proof is. onenote keeps its search index in the directory it is
# installed in (<package>/.onenote/search.db), not in HOME, so every case
# gets a package directory of its own: a copy of src/ and package.json for
# the TypeScript (started from there by rs/parity/ts.sh), named to the binary
# in ONENOTE_CLI_PACKAGE_ROOT. Most cases first build an index into it with
# bun:sqlite, from the rows in rs/parity/db/ and rs/parity/rows/ and with the
# schema of src/cache.ts (rs/parity/make-db.ts), and leave it as a finished
# sync does: the index, an empty -wal file and the -shm file (a handful of
# cases start from an index closed cleanly instead). Compared: stdout,
# stderr, the exit code, the listing of the working directory and HOME, the
# index and the files SQLite leaves beside it (sizes), the index's
# modification time, and ~/.onenote-cli (rs/parity/files.mjs, the same on
# every system). One normalize rule is in use, in three cases that are
# handed back: the process id in the warning bun prints under NODE_DEBUG (on
# Windows also under node_debug, since a variable's name is the same in any
# case there). A `verified` below rests only on cases the binary answered.
#
# 198 of the cases come from an independent verification of the port (its
# 196, two of them split in two because they printed more than the
# TypeScript reliably gets through a socket), 42 from the repair that
# followed it, the rest from running the cases on macOS and Windows. That
# verification found the binary answering differently in four situations;
# all four now go back to the JavaScript, and each has cases: a time zone at
# a time for which the two time zone databases differ; a variable in the
# environment that the runtime reads for itself (NODE_DEBUG, BUN_JSC_*,
# MIMALLOC_VERBOSE); an index last written in the last 122 ns of a second;
# and a package directory bun cannot load from. Running the cases on a Mac
# found three more, which go back there: an index without its -wal file
# (macOS's SQLite cannot open it read-only, and the TypeScript syncs), the
# zone names CST6CDT, EST5EDT, MST7MDT and PST8PDT (macOS's ICU shows UTC),
# and Cuba's winter of 2026 under the edition of the zone data that Mac had.
#
# Time zones are compared apart from the cases, because they are too many
# for cases: a unit test (rs/src/time.rs,
# every_zone_is_read_as_the_runtime_reads_it; `cargo test` runs it, and CI
# with it on Linux and macOS) takes every zone name of the compiled-in
# database, starts bun under that TZ (rs/parity/runtime-time.ts), and
# compares what both make of "last synced" for every 31 hours from 1970 to
# 2099 and around every clock change, and of `--since` spans that come back
# to every clock change. It fails for a difference that rs/src/time.rs does
# not list as left to the runtime (one list for Linux, one for macOS), and
# prints the line to add; on macOS it also fails when the system's edition
# of the zone data is not one listed as compared. It is a test of the same
# sources and Cargo.lock, not of the binary that is shipped.
#
# Nothing in the cases reaches Microsoft: HOME is empty, so there is no
# client id and no token, and every Graph command ends at the "Please
# configure your Azure AD app credentials" notice (also the case that a sync
# would start: without an index the TypeScript syncs). `auth login`, `auth
# logout`, `init` and `open` are not run at all, and no Graph command was run
# against a stand-in server: all of them are `missing` from a reading of the
# code only.
#
# Not covered: the pipeline's CI itself (nothing is pushed; its macOS runner
# has an edition of the zone data that could not be known here, see the
# entry on macOS's zone data, and how long the Windows job takes there could
# not be measured), linux-arm64, darwin-x64 and win32-arm64 (no parity run),
# a bun other than 1.4.0 on Linux and 1.4.4 on macOS, a macOS other than
# 27.0.1, an index written by a real `onenote sync`, output longer than about
# 280 lines (see the search entry), and a Linux machine whose own time zone
# is anything but UTC (see the entry for the system's time zone).
#
# Rust-only behaviour (no TypeScript counterpart; to be blessed or removed):
# ONENOTE_CLI_NO_NATIVE=1 hands everything back; ONENOTE_CLI_PACKAGE_ROOT
# tells a binary outside the package where the package is; a binary without
# the npm package beside it answers what it would hand back with one line and
# exit 1; a bug that makes a ported command panic hands back instead of
# crashing (it has printed nothing by then); RUSTIFY_HANDBACK_TRACE=1 makes
# the binary say on stderr when it hands back (rustify's helper v5, for the
# install smoke test); `onenote search` writes all of its output even to a
# reader that is slow, where the TypeScript loses lines (confirmed by the
# verification: of 6,014 lines to a reader that waits two seconds, 1,896
# arrived from the TypeScript, three runs out of three. This is a defect of
# bun's that the binary does not copy; whether a search with much output
# into a pipe should go back to the JavaScript so that it keeps losing lines
# is the owner's decision).

reconciled = "9af05e1"

# ───────────────────────────── Ported ─────────────────────────────

[[feature]]
name = "search <query> (local index, on Linux and macOS)"
status = "verified"
ts = "src/index.ts:734 command; src/index.ts:802 handler; src/cache.ts:1326 isCacheEmpty; src/cache.ts:1548 searchLocal; src/cache.ts:1461 cleanSnippet"
rs = "rs/src/search.rs; rs/src/main.rs search"
proof = "rs/parity.json the `search: …`, `search query: …`, `search expression: …`, `search options: …`, `search paging: …`, `search since: …`, `search tags: …`, `search text: …`, `search ties: …`, `search time: …`, `search env: …`, `search state: …` and `search rows: …` cases that are not marked handback for the system, run by rs/parity/proof.sh on Linux (375 of them) and on macOS (382); three of those on each, a package directory with `?` or a backslash in its name, do go back in the comparison and are unmarked only because the --handback check gives every case a stand-in directory"
note = "Native on Linux and macOS, proven on both by the parity job (linux-x64, darwin-arm64); handed back on Windows (see `search on Windows`). The darwin-x64 and linux-arm64 binaries answer the same way and are not run by the parity job. With an index that has pages: -n/--notebook, -s/--section, -a/--account, -l/--limit, -p/--offset, -g/--group, -c/--compact, -m/--max-lines, --since; the three layouts; the excerpt; the last line with its paging hint and `last synced` time. Bugs of the TypeScript are kept (each has a case: a quoted phrase is searched as two words, #discuss needs all three of its tags, pages titled in Cyrillic and other scripts are counted but never shown, a line with little ASCII is shown as `[binary content, no clean preview]`). On macOS bun:sqlite is the system's SQLite (3.54.0 on macOS 27.0.1) and the zone data the system ICU's: the cases ran there against it, TypeScript against the binary, with the index as a sync leaves it, and two situations go back there (their own entries). One difference cannot be had: with stdout a pipe or socket the TypeScript loses output once the reader falls behind (src/index.ts:12 touches process.stdout, after which bun 1.4.0 drops console.log lines that do not fit the pipe: beyond 64 KB into a pipe, beyond about 280 lines into a socket such as Node's child_process gives). Rust always writes everything. The independent verification confirmed it (1,896 of 6,014 lines arrived), and two of its cases, 302 lines each, differed TypeScript against TypeScript in 17 of 48 runs on a busy machine; they are two cases each now. The cases stay below that, so nothing compares output that long. Whether a search with that much output into a pipe should go back to the JavaScript, to keep losing lines as before, is the owner's decision; today it does not."

[[feature]]
name = "search on Windows"
status = "missing"
ts = "src/index.ts:1023 toLocaleString; src/cache.ts:6 bun:sqlite"
rs = "rs/src/main.rs search"
note = "Handed back whole, so users there see no difference yet: the search modules and their dependencies (SQLite, jiff, serde_json) are not compiled for Windows. The parity job runs every case on win32-x64 all the same: the --handback check shows that each of the 531 search cases that run there reaches the JavaScript (3 cannot be made there: a file name with `?`, one with a backslash), and the comparison that each behaves as the TypeScript started directly. What porting it would take: bun's SQLite, its time zone data and its idea of a console on Windows, none of which was compared; a Windows console is handed back even for `auth setup` (rs/src/main.rs machine)."

[[feature]]
name = "search on macOS: an index without its -wal file"
status = "missing"
ts = "src/cache.ts:1326 isCacheEmpty; src/cache.ts:1555"
rs = "rs/src/search.rs openable_by_the_runtime"
note = "macOS's own SQLite, which bun:sqlite is there, cannot open an index in WAL mode read-only while the -wal file beside it is missing (SQLITE_CANTOPEN; a missing -shm file it makes itself), seen with bun 1.4.4 on macOS 27.0.1. The TypeScript then takes the cache for empty and starts a sync. Linux's bun and the binary's SQLite make the files and read on, so on macOS the binary hands back whenever the -wal file is not there, whatever the journal mode. A sync leaves the file there (its last connection is never closed), so after a sync the search is native; an index something closed cleanly has none. 6 cases, native on Linux and handed back on macOS."

[[feature]]
name = "search on macOS: zone data of an edition that was not compared"
status = "missing"
ts = "src/index.ts:1023 toLocaleString"
rs = "rs/src/time.rs compared_data, MACOS_EDITIONS_COMPARED"
note = "On macOS bun uses the system's ICU, which reads the zone data from /var/db/timezone/icutz, a link to the edition the system has installed; macOS moves it on by itself, so two Macs can read a zone differently (seen on one Mac: 2026e in use, 2026f downloaded beside it, and ICU's own data, under ICU_TIMEZONE_FILES_DIR=/nonexistent, older still and different in Morocco and Alberta). The binary answers a search only where that link leads to an edition that was compared with every zone (2026e and 2026f), and hands back everything else, the search on a Mac without the link included. Every search prints a local time, so on such a Mac no search is native. The parity job's macOS runner has an edition that could not be known here: if it is not one of the two, the --handback check fails there (every search goes back) and the zone test says which edition it found; comparing it is one line in rs/src/time.rs."

[[feature]]
name = "search query language (#tag, tag:name, AND / OR / NOT, quotes)"
status = "verified"
ts = "src/cache.ts:503 TAG_ALIASES; src/cache.ts:576 buildFtsParam; src/cache.ts:588 parseTagsFromQuery; src/index.ts:810 quote stripping; src/index.ts:862"
