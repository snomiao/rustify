ts = "src/auth.ts:15 autoLoadEnv"
rs = "rs/src/runtime.rs; rs/src/time.rs; rs/src/main.rs machine, loadable"
note = "Handed back. (1) Any variable in the environment whose name begins with BUN_, NODE_, MIMALLOC_ or ICU_, whatever its value, except BUN_INSTALL: the runtime and the libraries inside it read these for themselves (NODE_DEBUG prints a warning, BUN_JSC_* and MIMALLOC_VERBOSE report on stderr, BUN_RUNTIME_TRANSPILER_CACHE_PATH leaves files behind, NODE_ENV and BUN_ENV choose the .env files, BUN_OPTIONS and NODE_OPTIONS add options), and none of it is imitated. Worth knowing: this includes NODE_EXTRA_CA_CERTS and NODE_TLS_REJECT_UNAUTHORIZED, which machines behind a company proxy often have set, and NODE_PATH; with them every search goes back although the output would be the same (compared for 50 such names by hand, not kept as cases). BUN_INSTALL, which bun's installer puts into the shell's profile, is compared and answered natively, and so is what `bun run` and `npm run` add (NODE, npm_*). 15 cases. (2) A .env* file in the current directory, or .env.local/.env in the package directory, in which the letters TZ, BUN, NODE or ICU appear anywhere, or which is not a plain file (bun and src/auth.ts load those files, and TZ changes the printed time; files without those letters are ignored, ONENOTE_CLIENT_ID and the like included). 10 cases. (3) A bunfig.toml in the directory, the home directory or XDG_CONFIG_HOME. 4 cases. (4) No HOME (no case: the runner always sets one). (5) A TZ that is a rule, a path, lower-case or empty (the runtime reads those its own way). 14 cases. (6) A zone and time for which the two time zone databases differ: see the entry on the time of the last sync; this one is the common case in Western Canada, Cuba and Morocco. 25 cases. (7) An index last written in the last millisecond of a second: the runtime turns the file's time into milliseconds in floating point and bun 1.4.0 shows the next second from 122 ns before it; Rust leaves the whole last millisecond to it, one index in a thousand. 3 cases. (8) A package directory with `?` or a backslash in its path, or reached through a link from one: bun cannot load a program from there and the TypeScript ends with `Module not found`. 4 cases, which cannot be marked (the --handback check gives every case a stand-in directory). For the system's own time zone see its entry. On Windows the names of variables are the same in any case, so there `node_debug` is NODE_DEBUG (a case). ONENOTE_CACHE_DIR is not read by Rust at all: with an index that has pages the TypeScript never looks at the cache directory either (a case)."

