note = "There is no .fail() handler: a handler's rejection goes to yargs, which prints the help to stderr and then the error as bun prints it (message, source excerpt, stack of the bundle), exit 1. By reading; not run. At dec02fd this is what all three commands end in. The text cannot be reproduced natively, so these are handed back for good (porting.md)."

[[feature]]
name = "what bun does before the program"
status = "missing"
ts = "cli.ts:1"
note = "bin/cli.js starts with `#!/usr/bin/env bun`. bun first reads .env files, bunfig.toml and package.json/tsconfig.json of the current directory (and the ones above), which for this command is the user's project; see porting.md, `What the TypeScript means`. A native command has to hand back wherever that changes what the program sees."

