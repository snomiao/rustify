status = "missing"
ts = "webrtc.ts:201; webrtc.ts:294; e2e.ts:13 MAX_CHUNK"
note = "JSON frames inside the sealed channel: the client sends {t: req, id, method, path, ct?, body?} or {t: abort, id}; the host sends {t: res, id, status, ct}, {t: data, id, b64} in chunks of at most 12000 bytes, and {t: end, id, error?}. Only the content type header travels; request bodies are text. Streaming, abort and back-pressure must behave the same."

[[feature]]
name = "rech-e2e-1 end-to-end encryption"
status = "missing"
ts = "e2e.ts:12 PROTO; e2e.ts:42 deriveDirKeys; e2e.ts:54 transcriptHash; e2e.ts:75 seal; e2e.ts:87 open"
note = "AES-256-GCM keys per direction from HKDF-SHA256(secret, salt = transcript hash, info `rech/rech-e2e-1/key/host->client` or `client->host`); the transcript hash covers the sorted sha-256 DTLS fingerprints, setup and ice-ufrag of offer and answer, and requires sha-256 fingerprints on both sides. Frame: version 1, flags, a 12-byte nonce (4 zero bytes and a 64-bit counter), ciphertext and a 16-byte tag, with header and transcript as AAD; the first frame must be counter 0 and any replay, reordering, tampering, wrong secret or rewritten fingerprint closes the channel. The byte layout and the SDP parsing must match the TypeScript host, client and the browser page exactly. Test: secret.test.ts:93."

