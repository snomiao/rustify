status = "missing"
ts = "src/index.ts:31 resolveClient; src/index.ts:62 postJson"
rs = "rs/src/url.rs; rs/src/http.rs addresses, localhost"
proof = "rs/parity.json lock: localhost, …, verify: lock: localhost, servers on both ::1 and 127.0.0.1; rs/src/http.rs where_localhost_goes (cargo test)"
note = "Handed back before anything is sent: https (no TLS in the binary), a host name other than localhost (the binary resolves no names: a remote client's usual http://<token>@<host name>:12371 goes back; an IPv4 address does not), IPv6, IPv4 in other spellings (127.1), percent escapes, a query or fragment, dot segments or an empty path segment, a scheme other than http(s), and anything not printable ASCII; a proxy variable in the environment; localhost on Linux (entry `client URLs of localhost on Linux`). On macOS and Windows localhost goes where bun goes, measured with one server on ::1 and another on 127.0.0.1 of the same port, and with each alone: on macOS (bun 1.4.4) and Windows (bun 1.4.2) ::1 first, which bun prefers, not only falls back to, and 127.0.0.1 when ::1 refuses. Those bun versions answer localhost themselves, ::1 then 127.0.0.1, without asking the system (oven-sh/bun#38818, bun 1.4.1 and later); what bun 1.4.0 and earlier did there, through the system's resolver, was not measured. The binary does the same, for the hosts file each system comes with: on macOS one that names 127.0.0.1 and ::1 for localhost and nothing else, on Windows none (its resolver answers for localhost itself); any other hosts file, one that cannot be read, and a ::1 that takes more than 30 s, go back. bun tries the two at once (up to four attempts) and the binary one after the other; on loopback a connection is taken or refused at once, so both end at the same server (a ::1 whose listen queue is full is where they could part). Until the first repair the binary asked 127.0.0.1 everywhere and so, with two servers, the other server than bun on macOS (found by the verifier) and on Windows. The banner's WINRPC_URL names localhost, so on Windows the common local client stays native."

[[feature]]
name = "client URLs of localhost on Linux"
status = "missing"
ts = "src/index.ts:62 postJson"
rs = "rs/src/http.rs localhost"
proof = "rs/parity.json lock: upper-case scheme and host, lock: localhost, …, verify: lock: localhost, servers on both ::1 and 127.0.0.1; rs/src/http.rs where_localhost_goes (cargo test)"
note = "On Linux `lock` against an http URL of localhost goes to the JavaScript before anything was sent (the seven cases marked handback on linux), because where bun goes for localhost there depends on bun's version and on the machine, and the binary cannot know which bun will run the JavaScript. bun 1.4.0 asks getaddrinfo with AF_UNSPEC, SOCK_STREAM and AI_ADDRCONFIG, again without AI_ADDRCONFIG only when nothing comes back. glibc's AI_ADDRCONFIG counts no loopback address (sysdeps/unix/sysv/linux/check_pf.c): on a machine whose only IPv6 address is ::1 it asks for IPv4 alone, and its files backend gives the hosts file's ::1 line as 127.0.0.1. Measured on such a machine (a Debian container, glibc 2.41, /etc/hosts naming 127.0.0.1 and ::1 for localhost, gai.conf all comments): getaddrinfo with AI_ADDRCONFIG answers 127.0.0.1 twice, without it ::1 then 127.0.0.1; `getent ahosts localhost`, which sets AI_ADDRCONFIG, shows 127.0.0.1 alone; bun 1.4.0 reaches the 127.0.0.1 server of two and is refused where only ::1 listens, and with BUN_FEATURE_FLAG_DISABLE_ADDRCONFIG=1 reaches ::1. Where any other IPv6 address is configured (a link-local one counts) glibc answers both, in the order of RFC 6724 and gai.conf, ::1 first by default. bun 1.4.1 and later (oven-sh/bun#38818: is_localhost_name and localhost_results in src/runtime/dns_jsc/dns.rs) never ask the system for localhost, *.localhost or localhost.: they answer ::1 then 127.0.0.1 on every system, whatever the hosts file, gai.conf and the addresses say. Measured on the same machine with bun 1.4.5: ::1 of two servers, ::1 alone, 127.0.0.1 when ::1 refuses. That is what CI found (run 46115378859, bun 1.4.5 on ubuntu-24.04): the TypeScript reached ::1 and the binary, which asked 127.0.0.1 alone on Linux until this repair, 127.0.0.1. Answering natively would need the binary to know bun's version, or to answer only where every bun agrees (getaddrinfo with bun 1.4.0's hints giving ::1 then 127.0.0.1 and nothing else, through the same libc as bun); not done. What it costs: a client on Linux of a server on the same machine starts bun; a Linux client of a Windows desktop by its name (which goes back anyway) or its IPv4 address (native) is unaffected."

[[feature]]
name = "an answer bun would not get out whole (a pipe without room for it)"
status = "missing"
ts = "src/index.ts:56 printLeaseHeld; src/index.ts:62 postJson; src/index.ts:33 resolveClient; src/index.ts:198"
rs = "rs/src/room.rs; rs/src/main.rs answer"
proof = "rs/parity.json room: …"
note = "A TypeScript defect, for the owner: bun does not always wait for a pipe, and what there is no room for when the program ends is lost. Measured with a reader that starts after the program has ended: on Linux (bun 1.4.0) every write, once yargs has looked at process.stdout: `winrpc lock | wc -c` gets exactly 65,536 bytes of a larger answer (the verifier: 136,893 printed, 65,536 arrived, 6 of 6 runs; into a file all of it), and into a pipe that already holds 64 KiB nothing at all, not even a refusal or a help page. On macOS (bun 1.4.4) and Windows (bun 1.4.2) only the lease-held line of a 423, which is process.stderr.write followed by process.exit: 65,536 bytes of 100,000 on macOS, none on Windows; console.log and console.error wait for the reader there. Into a regular file, a terminal (Linux and macOS, also with a late reader) or /dev/null nothing is lost. Until the repair the binary printed all of it. Now it answers only where every write that bun would not wait for certainly fits, and hands the rest back, so that the JavaScript loses the same: a regular file (on Windows a file on a disk) always; on Linux and macOS a terminal or /dev/null; on Linux a pipe with room for it (F_GETPIPE_SZ and FIONREAD, counted in whole pages, one more for a page partly read and one per earlier write of the answer) or a Unix stream socket with nothing waiting and at most 32 KiB to take, 4 KiB counted for each write (node and bun give a child such sockets as its pipes); everything else goes back, on macOS and Windows every 423 into a pipe or a socket, or onto a Windows console. For lock show that is after its GET, which the JavaScript then makes again. What stays native in practice: on Linux answers up to 64 KiB into `| cmd` and up to 32 KiB into a pipe node or bun gives a child; the JSON of a 200 and every error answer on macOS and Windows whatever their size. A winrpc server's /lock answer is a few hundred bytes and never a 423, so this goes back only for huge answers of other servers, for a pipe that is already nearly full, and (macOS, Windows) for the 423 of another server. Not copied: the loss itself; whether the binary should lose the same way, or the TypeScript be fixed (await the writes, or no process.exit right after process.stderr.write), is the owner's decision. Cases `room: …` give the command a real pipe, empty or full, that is read only once it has ended (rs/parity/with-mock.mjs `pipe`); the 423 cases of `lock: …` print into regular files. Also seen: the TypeScript's redaction regular expression takes time that grows with the square of a run of letters (about 4 s for 70,000 on a busy machine), and the binary's, which follows it, the same."

