note = "yargs's, and they stay there. Any error a command throws is reported as the command's whole help text followed by `Error: …`, exit 1. --version is handed back on purpose: yargs reads it from package.json (and, by rustify's porting notes, prints `unknown` when the package was installed globally with bun). Rust takes a search only in the plain spellings (rs/src/search.rs parse_args: one query, each option at most once as `--name value`, `--name=value` or `-n value`, bare --group/-g and --compact/-c) and hands back the rest: unknown or repeated options, `-l5`, `-gc`, `--no-group`, `--group=true`, camel-case names, `--`, empty arguments, values starting with a dash, counts that are not plain digits, options before the command. 55 cases with a command line that is yargs's to read (39 `search yargs: …`, 12 among the verification's, 4 for `auth setup`), 9 for the command line as a whole."

