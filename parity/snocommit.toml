note = "Prints `Generating commit message with gpt-4o...`, then one chat completion (z-chat-completion over the openai SDK, which also reads OPENAI_BASE_URL, OPENAI_ORG_ID, OPENAI_PROJECT_ID and its other variables) with the model gpt-4o, a strict JSON schema {type: one of the six, scope, title of 1 to 72 characters, body of 1 or more, is_BREAKING_CHANGE} and one system message: the current directory, the suggested type, the suggested scope as `(<scope>)` (`none` for `.` or no scope; `(-)` and `(@)` for those two), the description, the recent commits, the status lines and their diffs in a ```diff block, and the format. The message is `<type>(<scope>)<! when breaking>: <title>`, a blank line and the body; an empty scope leaves out the parentheses, one already in parentheses keeps a single pair. An empty answer throws `NO_CONTENT: No content returned from OpenAI chat completion.`; an answer that fails the schema throws zod's error; the SDK's own errors pass through."

