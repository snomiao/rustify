# Parity ledger for rustdesk.skill (npm package rustdesk-skill, commands
# `rustdesk-skill` and `rds`). Format and rules: parity/README.md.
#
# First pass, 2026-11-27, written by reading the code at c759994. Every line
# of the TypeScript was read: bin/rustdesk-skill.ts and the seven files of
# src/ (1,317 lines), with test/unit.test.ts, the two OCR scripts in ocr/,
# package.json, README.md, SKILL.md and CLAUDE.md.
#
# Second pass, 2026-11-28, with the port on branch build/rust-port: every
# command is native on Linux and macOS in its plain spellings, on a machine
# the binary finds plain (see the entries for what goes back), and handed
# back on Windows. The proof is rs/parity/proof.sh, which the workflow runs
# on linux-x64, darwin-arm64 and win32-x64 (first in CI at 9b1b75d: see the
# fourth pass):
#
# - rs/parity.json (written by rs/parity.gen.mjs): 553 cases, TypeScript
#   against the binary, then the binary against a stand-in package (the
#   --handback check: exactly the cases marked "handback" for the system
#   reach the JavaScript), then once more with stdout and stderr on a
#   terminal (not on Windows). No case reaches a browser, a screen, OCR or a
#   clipboard: rs/parity/run.sh puts stand-ins for playwright-cli, python3,
#   xclip and pbcopy first on PATH (rs/parity/shim.mjs, which also stands in
#   RDS_PW_BIN), and they and a logging git write down every call with its
#   arguments, directory, stdin and a digest of its environment; the cases
#   compare that log, stdout, stderr, the exit code and the files left
#   behind (names, modes, contents).
# - rs/src/compare.rs (cargo test): the argument gate against the project's
#   own yargs chain (buildParser) over 134,123 generated command lines;
#   toLowerCase and trim of every code point, os.tmpdir(), String(x),
#   toFixed(2) and Math.round against bun; and for what connect answers
#   after it has acted: String(x) of 140,000 doubles, Number(s) of 40,000
#   strings, Number(v) of 30,000 JSON values, src/ocr.ts normalizeBoxes and
#   matchText themselves on 20,000 generated OCR outputs, the order
#   `(a, b) => a.y - b.y` gives 6,000 lists with NaN and infinities
#   (rs/src/jssort.rs is JavaScriptCore's own sort), and connect's fixed
#   texts among 40,000 texts of scripts whose lower case is not certain.
#
# Third pass, 2026-11-28, after an independent verification (rustify's
# docs/porting.md, step 8) found 7 differences in 67 cases of its own: a
# step printing between 1,000,000 bytes and bun's mebibyte, a program that
# never stops printing, stdout that cannot be written, and, once connect had
# acted, a capital sigma on screen, viewports and OCR output of unusual
# shapes and a password field at -0. Each is now answered as the TypeScript
# answers it, or looked at before the first act; the verifier's cases are
# in rs/parity.json (v …), with cases for each repair (r …), 553 in all.
#
# Fourth pass, 2026-11-28, after the first CI run (46115487466, at 9b1b75d,
# bun 1.4.5): win32-x64 passed, linux-x64 and darwin-arm64 failed.
# - On both, cargo test: compare::lower_case_and_white_space_as_bun_has_them
#   found 18 code points (U+AB6C, U+AB6D and 16 capitals from U+1DF40 to
#   U+1DF7E) that the binary lower-cased and bun keeps. CI builds with the
#   runner's stable Rust, 1.100, whose tables are Unicode 18; bun 1.4 and the
#   Rust here (1.97, and 1.99 on the Mac) have Unicode 17. The binary's lower
#   case came from Rust's to_lowercase, so it followed the toolchain that
#   built it. It now comes from rs/src/unicode.rs, recorded from bun by
#   rs/unicode.gen.mjs (`--check` in proof.sh), and a character goes back
#   when the table's Unicode does not assign it or the building toolchain's
#   tables disagree with the table (see text matching). The test stays, as
#   the alarm against the bun CI runs. Nothing else in the crate asks Rust's
#   Unicode tables (white space and the controls are listed).
# - On macOS, the cases of a stdout whose reader has gone differed at random
#   (12 differences in 8 of the 9 cases, on pipes and on the terminal):
#   `<ROOT>/tmp/stdout.N: Interrupted system call` from rs/parity/run.sh, on
#   either side. The FIFO's writer opened while a reader started in the
#   background came and went; when the reader had left before the open saw
#   it, the open waited and SIGCHLD failed it. run.sh now opens the FIFO for
#   reading and writing, then for writing, and closes the first: nothing
#   waits and no process comes and goes.
# - On the macOS terminal, `r pw: a step that never stops printing` differed
#   in how many y's bun kept (557,056 lines in the TypeScript, 540,540 in the
#   binary), which the case's rule is there to make the same: XNU ends a line
#   in CR CR LF every 341 lines of y, where the terminal's output queue was
#   full, so the rule's half a million lines in a row never matched there.
#   The case takes the CRs before a line feed off first.
#
# Run with rs/parity/proof.sh at 9bbba53 of build/rust-port on Linux x64
# (bun 1.4.0 with Rust 1.97.1; bun 1.4.5 with the binary and cargo test both
# built by Rust 1.100.1, Unicode 18, as CI builds them): 423 cases answered
# by the binary, 130 handed back; on macOS arm64 (bun 1.4.4 and 1.4.5, Rust
# 1.99.0): 422 and 129 (paste without pbcopy goes back there; 2 skipped: no
# /dev/full); on Windows 11 x64 (bun 1.4.2): 301 handed back, 252 skipped
# (they need a stand-in on PATH, a terminal, a pipe made with mkfifo or
# /dev/full, or a command line longer than Windows takes). The terminal run:
# 553 of 553 on Linux, 551 of 551 on macOS. cargo test: 44 on Linux and
# macOS (against bun 1.4.0, 1.4.5 and 1.4.4), 3 on Windows. rs/src/unicode.rs
# is what bun 1.4.0, 1.4.2, 1.4.4 and 1.4.5 say. clippy -D warnings passes
# with Rust 1.97.1 and 1.100.1 on Linux, 1.99.0 on macOS, 1.96.1 on Windows.
# CI at 9bbba53 (run 46121022956): all 16 checks pass, the parity job on
# linux-x64, darwin-arm64 and win32-x64 included, with bun 1.4.5.
# A statement that is a deduction from the code, not something a case
# asserts, says `read, not run`.
#
# How it fits together. Every command except `list` drives a browser tab
# through Microsoft's `playwright-cli` (@playwright/cli), started once per
# step with `-s=<session>` so that separate invocations share one tab on
# https://rustdesk.com/web/. The RustDesk web client is a Flutter canvas, so
# the program reads it by screenshot and OCR (a Python script in ocr/:
# PaddleOCR, or macOS Vision) and acts by coordinates. State: passwords and
# recent IDs under ~/.config/rustdesk-skill (RDS_CONFIG_DIR), the session
# name in the environment or ./.env.local, screenshots in the temp directory.
# The package has no `exports` and no library entry; the commands are the
# whole interface. The binary still starts playwright-cli and python3 for
# every step, as the TypeScript does: a port saves the start of bun and
# yargs per invocation, not the work.
#
# Handing back. The binary declines before it has printed, started or
# changed anything that shows: a command line yargs has to answer, a machine
# it does not imitate (the situations below). A command keeps what it would
# print until its first step that acts on the page (any playwright-cli step
# but `screenshot` and `eval`, once it has started), sets the clipboard or
# writes a file of the user's; until then it can still decline after a step
# that only looks (a screenshot, the address, the viewport, OCR), and the
# JavaScript takes that step again: a second screenshot and OCR, which costs
# time, not more. A program that cannot be started has started nothing, and
# goes back too. After the first act every outcome is reported as the
# TypeScript reports it: a step's output past bun's buffer, E2BIG, and for
# connect any OCR output and viewport (see connect).
#
# What is still not imitated after the first act, none of it reachable by
# what the OCR scripts and playwright-cli print, read, not run unless a
# case is named: a value connect has to turn into a number that nests lists
# or objects more than 200 deep (JavaScript answers, or overflows its stack
# somewhere past 3,000); a program found on PATH that then cannot be
# started for a reason other than E2BIG or ENOENT (no process left, no
# memory); a screenshot file that cannot be read for a reason other than
# being a directory (a FIFO, no permission when not root); a store that
# cannot be written for a reason other than a full disk although it was
# writable before the first act. These end with `[rustdesk-skill] stopped:
# this build does not handle what it met after acting on the page; nothing
# further was done`, exit 1, without another step and without advising to
# run it again. And a stdout that stops taking output while connect works
# ends with exit 1 and the first lines of bun's report, without its stack
# trace (see "stdout that cannot be written").
#
# Rust-only behaviour (no TypeScript counterpart; to be blessed or removed):
# RUSTDESK_SKILL_NO_NATIVE=1 hands everything back; RUSTDESK_SKILL_PACKAGE_ROOT
# tells the binary where the package is; and the stop just described.

reconciled = "c759994"

# ───────────────────────────── Commands ─────────────────────────────

[[feature]]
name = "connect / c <id> [pw] [--remember-password] [--new]"
status = "verified"
ts = "bin/rustdesk-skill.ts:95; src/connect.ts:180 connect; src/connect.ts:58 enterId; src/connect.ts:74 triggerConnect"
rs = "rs/src/connect.rs; rs/src/commands.rs"
proof = "rs/parity.json (connect: …); rs/parity/proof.sh"
note = "Resolves the password first (see the password store), then opens the RustDesk tab (navigates only when not on it already, or always with --new), OCRs the screen and clicks the first box containing リモートID / Remote ID / Control Remote / ID, types the id and presses Enter, OCRs again and clicks 接続 / Connect, handles the password dialog once, saves the password with --remember-password, records the id in the recents, and prints {ok, id, connected, note} as JSON (two-space indent). `ok` is always true and the id is recorded whatever happened on screen. 37 cases of the port, 19 of the verifier's and 64 of the repair on Linux and macOS: the whole flow against scripted screens, a retina screenshot, open failing and goto taking over, RDS_PW_BROWSER, a missing playwright-cli, OCR and clicks failing on the way, the stores in every shape below. Before its first step the binary reads both stores, checks that the config directory and both files can be written, that the OCR's PNG has an absolute path and that stdout still takes output; a store in a shape it does not write as JavaScript does (a list, values that are not text, __proto__), an id named like a member of Object.prototype, a config directory that cannot be written, a relative temp directory and a stdout whose reader has gone (or /dev/full) go back. Once it has acted (with --new or off the client from `open` on, otherwise from the first click), it reads every screen as JavaScript reads any output of the OCR script: a list, a string (boxes without text), anything else (`{} is not iterable`, `number is not iterable`, `null is not an object (evaluating 'r of raw')`), boxes of any shape (`null is not an object (evaluating 'r.x1_norm')`; corners in strings, lists, true or objects turned into numbers as JavaScript does, `No default value` for an object with a toString of its own; a text that is not a string fails as `b.text.trim()` fails, in JavaScriptCore's words), a lone surrogate (U+FFFD, as bun prints it), a non-JSON report cut inside a character; a viewport of any shape; a remote screen in any script (Greek with its capital sigma, Glagolitic, Adlam: connect's fixed texts are ASCII, kana and CJK, which no such character lower-cases to); numbers of every size as JavaScript writes them (Infinity, NaN, 1e+300, 1152921504606847000); and E2BIG for a remembered password longer than one argument may be (Linux). The cases show each, rs/src/compare.rs holds the pieces against bun. What is left is listed at the top."

