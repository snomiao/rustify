note = "stdout carries PCM and nothing else: each output frame (exactly one 20 ms frame = rate x channels x 2 / 50 bytes: 640 at 16 kHz mono, 1280 at 16 kHz stereo, 1920 at 48 kHz mono, 3840 at 48 kHz stereo) is written as it arrives, before stdin reaches EOF; when the stdout pipe is full the pump waits for drain, and a frame is acknowledged to the gateway only after it was written. stderr: after the handshake exactly `audio stream: s16le <rate>Hz <channels>ch; stdin/stdout are PCM only` (after rech's usual `[rech] connecting to <host>:<port> (identity: ...)` line). stdin is read in chunks of any size and cut again into exact frames; each frame waits for credit (a window of 8 frames). At EOF a remaining partial frame is zero-padded to a full frame when it is a whole number of samples (length divisible by channels x 2); otherwise the stream fails with exit 1 and nothing on stdout (audio-stream.test.ts:168 feeds one byte). After the last frame `end-input` is sent and output keeps flowing until the stream ends. Exit 0 when the final reason is `stopped`, `cancelled`, `renderer-ended` or `duration-limit`; any other reason (`disconnected`, `connection-error`, `slow-consumer`, `capability-expired`, `renderer-error`, `invalid-...`, `input-overflow`) is a failure, exit 1 with the generic audio failure line. A write error on stdout (the reader went away) cancels and is reported as a failure, exit 1, not as a clean cancel (audio-stream.test.ts:180). Frames already received get 2 s to reach stdout after the socket closes; past that the reason becomes `slow-consumer`. Read, not run, and covered by no test: SIGINT or SIGTERM cancels both directions and, `cancelled` being a clean reason, ends with exit 0 and no message; if the stream closes while the input pump is blocked waiting for credit, the pending write fails, the pump is marked failed and the exit code can be 1 even for a clean reason, while a pump that was waiting for stdin data gives 0. The page arms its own stop timer at --max-seconds (audio-bridge-browser.ts:899); the gateway's own limit comes 30 s later. A port has to turn a broken stdout into exit 1 and SIGINT into exit 0, which are not Rust's defaults."

