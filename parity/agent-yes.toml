# Parity ledger for agent-yes. Format and rules: parity/README.md.
#
# First full pass, written by reading the code at 30116f1 (nothing was built
# or run except where a proof below says so):
#   TypeScript  ts/cli.ts (the entry of every bin), ts/subcommands.ts
#               runSubcommand and the modules it calls, ts/index.ts (the
#               TypeScript agent loop), ts/serve.ts (the serve daemon)
#   Rust        rs/src/main.rs + rs/src/cli.rs (the `agent-yes` runner),
#               rs/src/bin/ayrs.rs + rs/src/serve/ (the `ayrs serve` daemon),
#               and the modules they call
#
# How the two fit together today: ts/cli.ts is what every npm bin runs. It
# runs the management subcommands itself and, for an agent run, spawns the
# Rust runner by default (`--rust` is on; `--no-rust` keeps the TypeScript
# loop). `ay serve` hands the invocations `ayrs serve` can express to ayrs.
# The Rust `agent-yes` binary implements no management subcommand: given one,
# rs/src/cli.rs maybe_delegate_subcommand re-executes the JavaScript launcher.
# Status here is what the Rust binaries do on their own, so every such
# subcommand is `missing`, and so is everything ts/cli.ts does before it hands
# an agent run to Rust (auto-update, spawn gate, cwd warning, nested fork,
# --detach, --stream, --append-prompt) unless Rust has its own code for it.
# Where the Rust daemon has a route for what a command does, the command's
# note says so; the route has its own entry under the serve API.
#
# Proofs:
# - ts/tests/shared-e2e.spec.ts runs each case once with `--no-rust` and once
#   with `--rust`. CI (matrix-test.yml, Linux) builds rs/ first, so the Rust
#   half really runs there; it passed at 7d24910, which differs from 30116f1
#   only in the version lines of package.json and rs/Cargo.toml. Case 5
#   expects a Rust-only result (`40 120`, from COLUMNS/LINES) on the Rust
#   leg and passed, so that leg did not silently fall back to TypeScript.
#   Its assertions are coarse (a substring, a time bound, an exit code that
#   is not -1), so it proves only the one feature whose assertion is the
#   feature itself. Where it touches other features, their notes say what it
#   checks.
# - tests/fixtures/identity-cases.json and tests/fixtures/ay-init-msg.golden.txt
#   are asserted both by ts/*.spec.ts and by Rust unit tests (rs/src/identity.rs,
#   rs/src/init_msg.rs; they pass locally at 30116f1). They pin the pure
#   formatters only, and no workflow runs `cargo test`. Both features are
#   `partial` for other reasons; see their notes.
# - ts/subcommandMirror.spec.ts compares source text, not behaviour, and
#   ts/tests/rust-cwd.spec.ts is excluded from vitest. Neither is a proof.

reconciled = "30116f1"

