note = "With fewer than two arguments after the type (nothing, or a scope alone), throws `Missing description (desc)` before any git command. `--help`, `--version` and every other flag are not options: they are taken as the scope or as words of the description."

# ─────────────────────────── The pipeline ───────────────────────────

[[feature]]
name = "staging by scope: -, ., @, or a path"
status = "missing"
ts = "src/index.tsx:48 gitAddByScope"
note = "`-` stages nothing; `.` runs `git add .`; `@` runs `git add <directory of the nearest package.json, searched from the current directory upwards>` and throws the string `No package.json found for \"@\" scope.` when there is none; anything else runs `git add <scope>`. Each goes through a shell unquoted (a scope with spaces is several paths; shell syntax in it is interpreted). A failing `git add` is not noticed: the program goes on."

[[feature]]
name = "what counts as changes, and `No files staged to commit.`"
status = "missing"
ts = "src/index.tsx:67 getStagedFileChanges; src/index.tsx:33"
note = "`git status --porcelain`, each line trimmed, empty ones dropped. That lists unstaged and untracked files too, not only staged ones. No lines: prints `No files staged to commit.` and ends with exit code 0, also when git failed (outside a repository git's error goes to stderr, stdout is empty, so the result is the same message and exit code 0, as read). With scope `-` and nothing staged but other changes present, it goes on to the commit, which fails unnoticed (see that entry)."

[[feature]]
name = "the staged diff sent with the prompt"
status = "missing"
ts = "src/index.tsx:75 getTruncatedGitDiffOfFiles"
note = "For each status line, `git diff --cached -- <the whole trimmed line>` through a shell, so the status letters become a pathspec (`M src/a.ts` asks for `M` and `src/a.ts`; `??` is a shell and pathspec glob). A diff longer than 2,000 characters is cut to its first 1,000, `\\n\\n... (diff truncated) ...\\n\\n` and its last 1,000. Each diff is also printed as it runs (see the echo entry). As read, not run: a staged rename's line `R  old -> new` makes the shell redirect that git command's output into the working-tree file `new`, overwriting it (the index, and so the commit, keep the real content)."

[[feature]]
name = "recent commits sent with the prompt"
status = "missing"
ts = "src/index.tsx:224 getRecentCommits"
note = "`git log -n 5 --pretty=format:\"%h<TAB>%an<TAB>%ad<TAB>%s\" --date=short`, each line made `- <hash> | <author> | <date> | <subject>`; `(no recent commits found)` when git prints nothing (also when it fails). The `(unable to read recent commits)` branch cannot be reached, as snorun never rejects. Also exported from the library (see that entry) and tested by src/index.spec.ts."

[[feature]]
name = "OpenAI API key: ~/.snocommitrc.json, then OPENAI_API_KEY, then asked and saved"
status = "missing"
ts = "src/index.tsx:166 getOpenAIApiKey; src/index.tsx:211 validApiKey; src/index.tsx:15 zSnocommitRC; src/promptT.ts:5"
note = "Asked only after the files are staged and the diff is read, so without a key the program stops with the files staged. The home directory is $HOME, else $USERPROFILE. First .snocommitrc.json there: JSON whose OPENAI_API_KEY matches /^sk-/; any error is ignored. Then $OPENAI_API_KEY. A key is accepted when it starts with `sk-` and is longer than 20 characters, then trimmed. Then `Please enter your OpenAI API Key (sk-...):` on stdout through readline, the answer trimmed; an accepted answer is written to <home>/.snocommitrc.json as two-space JSON without a final newline, with the default file mode, and `Saved OpenAI API Key to <path>` printed. Otherwise throws the string `No valid OPENAI_API_KEY provided. Please set it as an environment variable or in ~/.snocommitrc.json`. As read, not run: with stdin at its end the question is never answered and the program ends there, exit code 0. The comments number the environment variable first; the code reads the file first. The key is put into process.env.OPENAI_API_KEY for the SDK."

[[feature]]
