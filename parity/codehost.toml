status = "missing"
ts = "src/tunnel/host.ts:111; src/tunnel/client.ts:98; src/tunnel/node-datachannel.ts:22"
note = "Both ends switch on the opcode with no default branch, so an unknown opcode is dropped silently; frames for a stream id nobody holds are dropped; the transports drop text messages. This absence of an error path is what makes new opcodes compatible, and Rust has to keep it on purpose. A frame shorter than 5 bytes or with bad JSON is another matter: see the header."

