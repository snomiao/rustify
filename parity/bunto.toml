[[feature]]
name = "the help in the user's language (yargs's y18n)"
status = "partial"
ts = "cli.ts:7"
rs = "rs/src/runtime.rs Runtime::startup; rs/src/runtime.rs ordinary_locale_file"
note = "yargs takes the locale from LC_ALL, LC_MESSAGES, LANG or LANGUAGE (else en_US), cut at `.` or `:`, and y18n reads `<locale>.json` (or the language's) from `locales` beside the package's directory (`resolve(bin/cli.js, \"../../../locales\")`). There is none in any install, so y18n is told the file is not there and prints the English texts: native for a locale that is a plain name (letters, digits, `_`, `-`, `@`) whose file's path is at most 240 bytes (cases `gate: LANG=de_DE.UTF-8 is still English`, `gate: LANG=sr_RS@latin …`, `gate: LC_ALL=80 letters …`, `verify: a locale named constructor`, …). Handed back: a `locales` directory, or anything of that name, beside the package (as given, or its real path; seen: German help with locales/de.json); a locale with any other character (a path, a space, non-ASCII); a longer path. y18n rethrows every error but ENOENT, so past what the system takes (from about 4080 letters on Linux, 1000 on macOS) bin/cli.js ends with bun's report of ENAMETOOLONG instead of the help (cases `verify: LANG of 5000 letters, --help`, …; found by the verifier). On Windows bun 1.4.2 printed the English help for every such locale tried (5000 letters, `*`, `<`, a space); one rule holds there all the same."

