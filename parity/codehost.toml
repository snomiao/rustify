# ═════ The tunnel (HTTP and WebSocket over a data channel) ═══════════════════
# The daemon is the host half (src/tunnel/host.ts). The client half
# (src/tunnel/client.ts) runs in the page and stays TypeScript; it is also what
# src/tunnel/tunnel.test.ts drives the host with, over an in-memory transport.

# ───────────── Frames ─────────────

[[feature]]
name = "tunnel frame format and the 64 KiB frame limit"
status = "missing"
ts = "src/tunnel/protocol.ts:61 encodeFrame; src/tunnel/protocol.ts:84 decodeFrame; src/tunnel/protocol.ts:41; src/tunnel/protocol.ts:34; src/cli/rtc-daemon.ts:132"
note = "One binary data-channel message is one frame: byte 0 the opcode, bytes 1 to 4 the stream id as a big-endian unsigned 32-bit number, the rest the payload (raw bytes, or UTF-8 JSON for control frames). There is no length field and an empty payload is legal. Senders cap a frame at 65,536 bytes (5 of header, at most 65,531 of payload) and split anything larger; receivers accept any size, which is what lets older 16 KiB peers and current ones work together. That rests on the WebRTC stacks: 64 KiB messages are safe only because Chrome, Firefox and libdatachannel all negotiate an SCTP max-message-size of 256 KiB (the comment at protocol.ts:34-40), and the daemon gives node-datachannel nothing but its ICE servers, so the value is libdatachannel's default. A daemon on another WebRTC stack has to advertise a=max-message-size of at least 65,536 in its answer, accept 64 KiB messages from current pages and 16 KiB ones from old pages, and never send more than the browser advertises. tunnel.test.ts has the codec round trips."

