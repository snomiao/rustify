note = "The page creates both data channels and the offer and trickles its candidates. A dial that has not opened the interactive channel within 15 seconds fails (`connection failed`); the states are idle, connecting (`negotiating WebRTC…`), pending, provisioning, connected, failed and denied; one session is shown at a time. From the connection's statistics it shows `LAN` when both chosen candidates are host candidates, else `p2p`. When Connect reuses a background connection that the same tab already holds, neither the badge nor the handler that marks a session failed is attached. Candidate to stay TypeScript."

[[feature]]
