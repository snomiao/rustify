note = "43 `list:` cases, against the TypeScript daemon (two tabs, none, a title with U+2028; the age normalized there to `+<AGE>s`, 0 or 1) and a fake daemon: `(no SPA tabs connected)`, ids and titles of every JSON type as template literals write them (no format codes applied, a lone surrogate as U+FFFD, numbers to the last digit, arrays nested to 1000 levels), `(untitled)`, ages by toFixed(0) (also negative, NaN, 1e+297), a field nested 300 or 100,000 levels deep, a frame of 17 MB, frames it ignores (not JSON, null, v other than 1), a binary frame (bun reads it as text), a refused upgrade, nothing listening, the daemon closing (also with 4000) or dropping the connection or never answering (it waits for ever, as the TypeScript does: compared for 2.5 to 20 s), --daemon against COMFY_AI_DAEMON (also ws:) and the paired daemon, a state file nested 300 levels deep naming the daemon. Handed back: the built-in daemon (own entry), wss:/https and other hosts or spellings (also --daemon ws:), and after the request an answer no comfy-ai daemon gives (sessions not a list or missing, a session not an object, an id or title nested deeper than 1000 levels) or a message over 128 MiB (bun 1.4.0 waits for ever, 1.4.4 fails with `list failed`): the JavaScript asks again, read-only, one more /ctl connection."

