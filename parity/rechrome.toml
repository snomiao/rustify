note = "Written down for other programs in docs/audio-duplex.md as the `PCM duplex v1 contract`. Upgrade on GET /stream: the Origin header (absent counts as `null`) must equal the ticket's clientOrigin and the ticket must be unused, not stopped and not expired, else 403; 429 when the gateway already counts 4 WebSockets (Bun's pendingWebSockets); 400 when the upgrade itself fails; every error body is `Unavailable`. Limits: 16 KiB per message, 30 s of idleness. A socket that has not authenticated 2 s after opening is closed with 1008 `authentication timeout`. The first message must be text of at most 2048 characters: {type: `hello`, version: 1, capability, sourceId, destinationId, input, output, frameMs: 20}, with the capability compared in constant time and the ids and both formats equal to the stream's (a format may carry no extra key); anything else closes with 1008 `invalid handshake` and does not consume the capability. Then, client to gateway: binary frames of exactly maxFrameBytes, only after `ready`, never more than the window unacknowledged; text of at most 1024 characters: {type: `output-ack`, sequence} strictly in order and only for frames already sent, {type: `end-input`} once, {type: `cancel`} or {type: `stop`}. Gateway to client: {type: `ready`, version: 1, sourceId, destinationId, input, output, frameMs: 20, maxFrameBytes, inputWindowBytes, outputWindowBytes}; {type: `credit`, bytes: <one frame>, inputSequence} for each input frame the page accepted; {type: `frame`, sequence, sampleOffset: sequence x rate / 50, byteLength, sourceId: <the destination>, destinationId: <the source>} followed directly by one binary frame; {type: `input-ended`}; last {type: `closed`, reason} and a close with 1000 `audio stream closed`. A message on a stream that has already stopped closes with 1000 `closed`. No reconnect: a new stream needs a new ticket. The message rules are simple and fully specified; the work is in matching the status codes, close codes, size limits and t