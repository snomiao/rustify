note = "pm2 has no boot service on Windows, so rech wires `pm2 resurrect` at logon itself. Check only (used by `rech status`): `reg.exe query HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run` (reg.exe under %SystemRoot%\\System32, 5 s limit, hidden, stderr discarded); a failed query throws `Cannot inspect Windows logon autostart (HKCU Run).`; all REG_SZ and REG_EXPAND_SZ values are read; it is wired when PM2_HOME is unset and some value is a direct resurrect command, or when some value, under any name, equals the wanted command and the wrapper script exists. A direct command is `<exe> resurrect` with nothing after it, where exe (quoted or not, slashes and letter case ignored) is the pm2 in use or a bare pm2, pm2.exe, pm2.cmd or pm2.bat; `echo pm2 resurrect`, the path of another installation and `pm2 resurrect && other` do not count. Install (run by the daemon registration under pm2 after `pm2 save`, and by setup step 1 on Windows when the daemon was already running, to repair older installs): creates the Run key when the query failed (`reg add <key> /f`), returns at once when a direct command already covers it, refuses a command longer than 260 characters (`Windows logon command exceeds the Run key's 260-character limit.`), always writes the wrapper script again (next entry), runs `reg add <key> /v RechromePm2 /t REG_SZ /d <command> /f` unless that command is already registered (`Cannot register pm2 resurrect at Windows logon (HKCU Run).` on failure), then checks again; a false result makes the caller throw `Windows pm2 autostart verification failed.` The wanted command is `\"<SystemRoot>\\System32\\WindowsPowerShell\\v1.0\\powershell.exe\" -NoProfile -NonInteractive -WindowStyle Hidden -ExecutionPolicy Bypass -File \"<home>\\.rechrome\\pm2-logon.ps1\"`. The logic is pure and takes its registry runner as an argument, but its effects (reg.exe, the Run key, PowerShell at logon) exist only on Windows. Tests: windows-autostart.test.ts:5 (which commands count as d