status = "missing"
ts = "src/cache.ts:1628; src/cache.ts:1483 searchSection; src/cache.ts:1362 findAllInBinary"
note = "The TypeScript falls back to scanning .onenote/cache/*/*.json and the .one files beside them whenever SQLite throws: no index, a broken one, one from before the full-text table, or a query like `plan AND`. Rust hands back as soon as SQLite reports an error, having printed nothing. Rare once synced; the fallback only looks one directory deep and so finds nothing in a cache a current sync wrote (a case). 21 cases, 16 of them expressions FTS5 rejects."

