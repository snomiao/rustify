[[feature]]
name = "a directory inside a JavaScript project: package.json, tsconfig.json, jsconfig.json here or above"
status = "missing"
ts = "bin/qqdocs.ts:1 (bun reads them before the program starts)"
rs = "rs/src/env.rs startup, PROJECT_FILES"
note = "Found by the verification. bun reads these three files in the current directory and in every directory above it, whatever script it runs, and writes what it finds wrong with them to standard error before the program's own output: a file it cannot parse, a key given twice, a `type` it does not know, an `exports` it does not accept. It takes comments and trailing commas, so what it accepts in silence is its parsers' to say. Rust therefore hands back whenever a file of one of these names exists in the current directory or above it, in any state (20 cases handed back, and rs/tests/handback.rs for directories further up; one more case shows that files of other names change nothing). Files of other names (package-lock.json, bun.lock, tsconfig.base.json) and project files below the current directory or above the installed package are not read by bun and change nothing. This is common: a command run from anywhere inside a JavaScript or TypeScript project gets the JavaScript. A narrower rule (taking a package.json that is plain JSON with fields bun does not warn about) would need its own proof."

