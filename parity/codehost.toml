note = "setup ends with `✓ GitHub auth: ready — private repos will clone`, or `⚠ GitHub auth: none found — private repos won't clone until you run:` and `gh auth login && gh auth setup-git`, with `(install gh first: https://cli.github.com)` appended when gh is absent. It rests on the two probes of the entry `GitHub credential probe`."

[[feature]]
