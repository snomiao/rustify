note = "startCapture puts the generation in phase capturing (a second call is a no-op), attaches a MediaRecorder to every redirected output that exists and to each one created later, and arms a timer for maxCaptureMs that stops the bridge by itself (audio-bridge-browser.test.ts:500, 100 ms). No recorder exists before an explicit start (test :364). Each recorder is one stream `s-1`, `s-2`, ... in creation order, MIME `audio/webm;codecs=opus` when supported, else `audio/webm`, else a failure; started with a 250 ms timeslice. Every fragment's size is reserved against the buffer limit (2 MiB, shared with queued input) before it is converted; a fragment that does not fit is counted in droppedBytes and fails the bridge with `buffer-overflow`, keeping what was already accepted (test :442: 900 bytes kept, 200 dropped, phase failed). Fragments are converted to base64 one after another, so order holds even when a conversion is slow, and drain waits for conversions in progress (test :385). drain() returns {...status, streams: [{id, mimeType, seq, chunks, final}]}: per stream only the fragments since the last drain, `seq` the index of the first of them, `final` true once the recorder has ended; a stream with nothing new is left out, except that a finished stream is reported once with final true even when it is empty (test :550); fragments arriving after the recorder has ended are dropped and counted. Draining frees the budget. While a PCM stream is on, no recorder is started. Runs in the page: stays JavaScript."

