# ───────────────────────────── Behaviour ─────────────────────────────

[[feature]]
name = "where store and key come from (--gitstore, GENVX_STORE, GENVX_KEY, GENVX_CONFIG_DIR, ./.env.local, ./.env, ~/.genvx)"
status = "verified"
ts = "src/index.ts:233 loadEnvConfig; src/index.ts:265 getEncryptionKey; src/index.ts:277 getGitstoreConfig; src/cli.ts:53 resolveGitstore"
rs = "rs/src/env.rs load_config"
proof = "rs/parity.json cases `config: …`"
note = "Order, the simple line format (no quotes, no comments after a value), that every variable in those files also reaches git, and that the files are only read when the store or the key is first asked for. A config file that exists and cannot be read makes the TypeScript crash with bun's error dump: that goes back. So does GENVX_CONFIG_DIR with a `..` after a directory name, and on Windows any GENVX_CONFIG_DIR."

[[feature]]
name = ".env files bun loads by itself before the program starts"
status = "partial"
ts = "src/cli.ts:1 (#!/usr/bin/env bun)"
rs = "rs/src/env.rs startup; rs/src/env.rs read_plain_dotenv"
note = "Not written anywhere in the TypeScript, but real: bun puts .env.development.local, .env.local, .env.development and .env of the current directory into process.env, so a key in ./.env.development works, quotes around a value in ./.env are stripped, and all of it reaches git. Rust reproduces the order and the syntax where a value is literal: KEY=value, KEY=\"value\", KEY='value', a # comment after it, blank lines, CRLF (covered by the cases `branch: .env …` and several `config: …`). Not ported, so the invocation goes back: $VAR expansion, backslash escapes, values over several lines, `export`, indented lines, keys with . or -, a quote inside a value; NODE_ENV, BUN_ENV, BUN_OPTIONS or NODE_OPTIONS in the environment; a bunfig.toml in the directory or the user's config; a .env that sets HOME, PATH, NODE_*, BUN_* and the like. A project whose .env uses such syntax therefore runs every genvx command through the JavaScript, as today."

[[feature]]
name = "encrypted files, format v2 (written and read)"
status = "verified"
ts = "src/index.ts:122 encrypt; src/index.ts:142 decryptV2"
rs = "rs/src/crypto.rs"
proof = "rs/parity.json cases `pull: …` (fixed ciphertexts written by the TypeScript) and `push: …` (what Rust wrote, decrypted with node:crypto); rs/cross-compat.sh; rs/src/crypto.rs tests"
note = "scrypt (N = 2^17 written, 2^1 to 2^17 read, as bun allows under the TypeScript's memory limit) and AES-256-GCM with a 16-byte IV. bun would also read an IV of any other length; Rust reads 16 and 12 and calls the rest undecryptable. genvx has only ever written 16."

