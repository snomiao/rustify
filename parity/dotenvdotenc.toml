note = "The package's own regular expressions, run on an ECMAScript engine (the regress crate), so quoting, line ends, repeated names and odd input follow the package rather than a re-reading of it. That engine does not give up where bun's does; very large values are the next entry."

[[feature]]
name = "values beyond bun's regular expressions (very large quoted values, very large escaped values)"
status = "missing"
ts = "dede.ts:216 values (scan of @dotenvx/primitives 3.0.3); dede.ts:224 rewrite (upsert)"
rs = "rs/src/primitives.rs QUOTED_SPAN_LIMIT; rs/src/primitives.rs longest_quoted_span; rs/src/dede.rs foresee; rs/src/dede.rs merged_enc_bound"
note = "Measured on bun 1.4.0: the scanner's quoted alternatives stop matching when one repetition runs over more than 540,669 UTF-16 code units in single quotes, 442,366 in double quotes or 393,214 in backticks (twice that of escaped quotes); bun then does not see that value nor any assignment after it, an unclosed quote running to the end of the text. upsert refuses to build an expression longer than 1,048,576 code units (36 plus the escaped name and old value), a SyntaxError. So the TypeScript refuses such files (enc: `would commit part of its value as plaintext`, `SyntaxError (invalid key or file?)`) or reads them short (get: `not found`; dec exits 0 with ciphertext left in the plaintext file, a TypeScript bug of its own). The binary hands back any text it would scan where a value could repeat over more than 131,072 units, and any upsert expression longer than 524,288 (a third and a half of the limits), for every file it reads (env files, .enc, keys files, key-tree nodes), and before writing, for what it will write: each new ciphertext's length is known in advance (a quoted value of 98,198 bytes is the largest that stays native, a bare one of 196,487); a keys file a new key would push past goes back. A three-way merge is foreseen too, and since whether one happens is for the sync record to say, which git names later, enc and dec look at it whenever both files are there and differ, an ordinary edit included: two files over 120,000 units together go back; and for enc, an .enc of the merge that could pass 131,072 units, counted as both files twice, plus per name and place the longest ciphertext it can get (new, or kept from the .enc), in quotes, plus the header (rs/src/dede.rs merged_enc_bound). So an edited file of 23 values of 1,000 bytes stays native and one of 24 goes back; with values of 10 bytes the line is at 597 values. (At 2c2a075 every ciphertext of both sides was counted, and an edited file of 450 such values, about 10 KB, went back.) So an .enc the binary writes stays readable by a JavaScript-side dede (Windows, DOTENVDOTENC_NO_NATIVE=1). Cases `large: …` and the large-value cases of `recheck2: …` (28 answered by the binary, 34 handed back) sit on both sides of the margin; rs/src/primitives.rs tests hold the measured limits."

