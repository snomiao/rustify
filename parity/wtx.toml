# Parity ledger for wtx (npm package @snomiao/wtx, command `wtx`). Format
# and rules: parity/README.md.
#
# Written by reading, 2026-11-27, at 2c1b22f (v0.3.4, the published version;
# `npm view @snomiao/wtx bin` is `wtx: wtx.mjs`). Read in full: wtx.mjs,
# src/cli.ts, src/index.ts, src/server.ts, src/term-summary.ts (987 lines),
# their three test files, package.json, README.md, docs/wtx.md,
# docs/protocol.md and the two workflows. lib/ is the separate browser
# package @snomiao/wtx-react (keep_ts) and has no entries.
#
# Nothing was run beyond what proves the hand-back is safe. wtx has no
# `--help`: wtx.mjs reads no arguments, and every command line starts the
# server and keeps it running. So wtx was only ever started with a temp
# directory name no file system accepts, where src/server.ts throws at its
# first mkdir (line 78), before Bun.serve and before it writes a file: once
# directly with bun, and through the install smoke test of the branch
# build/rustify-pipeline (bun and npm, Linux x64), which also ran the
# binary's `--rustify-version`. No port was bound by wtx, no PTY started,
# no test of the project run. Every note below comes from the source; none
# was seen to happen, and no test is cited as a proof.
#
# How it fits together. `wtx` is one foreground bun process: Bun.serve on
# 127.0.0.1:3004 by default, answering a small HTTP API and WebSockets.
# Each session is one PTY (bun-pty) running a shell or a given command,
# with a 1 MB buffer of its output that a client gets again when it
# attaches. Sessions live in the process's memory only and outlive their
# WebSocket clients, not the process. The same module is the package's
# library API (src/index.ts), which other bun programs import to run the
# server inside their own process and to add sessions to it.
#
# Status. The crate (rs/ on build/rustify-pipeline) hands every command
# line to wtx.mjs, so every feature below is `missing`. Nothing is
# `dropped`: that is the owner's decision. The binary answers exactly one
# line itself, `wtx --rustify-version` (prints its version, exit 0), which
# has no TypeScript counterpart: it exists because the install smoke test
# needs a command that exits, and no command of wtx does. It is in the note
# of `wtx (the command)` and has to be removed or blessed.
#
# Candidates to stay TypeScript (the owner decides; nothing is `dropped`):
#   - the library API: a binary cannot satisfy an import, and the functions
#     work on the session map of the importing process
#   - the WebSocket and HTTP protocol itself is shared with
#     @snomiao/wtx-react (lib/), which stays TypeScript; a Rust server has
#     to keep the frames byte for byte
#
# Traps for an exact port, found while reading:
#   - every argument is ignored; `wtx --help` and `wtx --version` start the
#     server like plain `wtx`
#   - the start-up line prints the parsed TERMINAL_WS_PORT, not the port
#     Bun.serve took (`port 0` for 0); parseInt takes `3004abc` as 3004, and
#     what Bun.serve does with NaN, a negative or a too large port, or an
#     empty TERMINAL_WS_HOST was not checked
#   - <temp dir>/koho-term-zshrc is one fixed directory, rewritten at every
#     start by every user and instance; a failure there ends wtx before it
#     listens
#   - query numbers go through parseInt and Math.max: `cols=abc` gives NaN,
#     which reaches the PTY of a new session and is skipped when sizes are
#     negotiated
#   - route keys: /sessions/:key/buffer and /sessions/:key/input use the key
#     as it is in the URL, /sessions/:key and /sessions/:key/git decode it
#   - a working directory that does not exist is created (mkdir -p) by a
#     WebSocket `?cwd=` or a POST, and `..` is refused only as `/../`
#   - /sessions/:key/git trims git's whole porcelain output, so the first
#     line loses its leading space: a file changed only in the worktree is
#     counted as staged when it comes first
#   - /summary renders only the last non-blank line of the screen (tail 1),
#     and summarises that line alone
#   - a JSON body of `null` for POST /sessions/:key throws outside the try
#     (what bun answers then was not checked)
#   - PTY input from a binary frame or an /input body is decoded as UTF-8
#     with replacement before it is written; the queries the server answers
#     (DA, CPR) and the OSC 7 sequence are looked for in each chunk alone
#   - replacing or deleting a session leaves its clients attached to the
#     old one: they get its `[session ended]`, and what they type goes to
#     whatever session holds the key afterwards
#   - with TERMINAL_ACCESS_KEY unset every route is open to whoever reaches
#     the address (loopback by default since 0.3.2)

reconciled = "2c1b22f"

