note = "What the stream's page relay calls on `window.__rechAudioBridge`; no case of audio-bridge-browser.test.ts exercises them. startPcm({sampleRate: 16000|48000, channels: 1|2, maxSeconds: 1..300}): `busy` when a stream or a capture is on, bytes are buffered or recorders exist; `pcm-config` for other values; it creates its own AudioContext and an AudioWorklet (`rech-pcm`, loaded from a Blob URL; `pcm-worklet` when that fails, so a page whose content security policy forbids blob: worklets cannot stream - read, not run), feeds every redirected output into it, sets phase capturing and a timer of maxSeconds that stops the bridge; `pcm-start` when starting fails. The worklet converts the page's output to the requested rate by picking samples (no filter), mono as the average of the input channels, into signed 16-bit little-endian frames of 20 ms (rate/50 samples), each handed to the page and queued as base64; more than 65536 queued bytes or a frame of another size fails the bridge with `buffer-overflow`. readPcm() returns {id, phase, frames: [base64...]} and empties the queue. feedPcm(base64) takes exactly one frame in canonical base64 (`pcm-frame` otherwise; `pcm-input-closed` without a stream or after endPcmInput; `stopped` once the bridge has stopped), waits while more than 0.18 s is queued (up to 2 s, then `pcm-backpressure`), and schedules it on the virtual microphone like a WAV clip. endPcmInput() marks the input closed. endPcmInput and readPcm throw `pcm-unavailable` when no stream was started. While a stream is on, the WebM recorders are not used. Page code including an AudioWorklet processor written as a JavaScript string: stays JavaScript."

