note = "Joins the room as a client, answers the host's offer using the ICE servers sent in it, and gives up after 25 s. Distinct errors: nobody is answering this link (close 4404 or hostPresent false), the host left before the connection finished, the signal server refused this link (1008), timed out (with advice about TURN or a Tailscale or LAN share), and failed key confirmation."

[[feature]]
