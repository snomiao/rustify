rs = "rs/src/pw.rs pw; rs/src/proc.rs"
proof = "rs/parity.json (pw: …, scroll: …); rs/parity/proof.sh"
note = "Each step starts `playwright-cli -s=<session> <args>` (RDS_PW_BIN replaces the command and is split on JavaScript's white space, so it may carry arguments) in the session directory, RDS_SESSION_DIR or <temp>/rustdesk-skill, created when missing, with the whole environment; the binary finds the program as bun's lookup does and starts it by that path with its name as argv[0]. Not found: the message naming @playwright/cli, RDS_PW_BIN and RDS_PW_BROWSER, exit 5. A failed step: `playwright-cli <subcommand> failed (exit <n>): <stderr, else stdout, else unknown error>`, exit 1. Commands run one after another, each waiting for the last. bun reads a step's stdout and stderr 64 KiB at a time; once a stream holds more than a mebibyte (1,048,576 bytes) it sends the program SIGTERM, stops reading and reports ENOBUFS, so the step has status 1 when the signal ended it (`playwright-cli <subcommand> failed (exit 1): <what it kept>`, a little more than a mebibyte, as many bytes as the reads took) and its own status otherwise; the binary reads and stops the same way, a program that never ends its output included (r cases: a mebibyte, a mebibyte and one byte, two megabytes on stdout and stderr, `sh -c yes`). Handed back: a program bun cannot start (not executable, a directory, no #! line, a relative path; one that the system refuses to start, before the first act), a PATH with a relative entry, a session directory that is relative, has `..` or is a file, and a step that only looks and passes the mebibyte (before the first act; the JavaScript takes it again). After the first act E2BIG is `E2BIG: argument list too long, posix_spawn '<command>'` as bun says it. The programs get pipes, where bun gives them /dev/null (or a memfd holding the input) and socket pairs; nothing the cases' stand-ins do shows the difference (read, not run)."

