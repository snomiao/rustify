[[feature]]
name = "macOS"
status = "verified"
ts = "dede.ts"
rs = "rs/src"
proof = "rs/parity/proof.sh on macOS 27 arm64 with bun 1.4.4, 1.4.2 and 1.4.5 (the parity job runs it on darwin-arm64): rs/parity.json (997 answered by the binary, 182 handed back, as the cases say, 1 skipped there), rs/cross-compat.sh, rs/tty-compat.py, rs/pipe-compat.py, rs/perm-compat.sh (19 of 24 scenes without sudo on the Mac, all 24 with sudo in CI), cargo test; and the parity job on darwin-arm64 at 6a3f40c, all of it passing"
note = "On macOS the binary answers every command natively, as on Linux (rs/src/cli.rs platform_is_proven is cfg!(unix)), and hands back the same situations, and one more: a `get` that prints into a pipe or a socket (entry `get … into a pipe or a socket`). On the first runs there every case and scene behaved the same, apart from that get (93 cases went back where they said native, 6 of them asking git twice; the get cases now print into files) and apart from the proofs' own tools: GNU stat, sha256sum and sed -i in the cases had been replaced beforehand (rs/parity/files.mjs, sed -i.bak), and the runs showed node -e arguments read differently where node is bun (8 key-tree cases could not be set up), node:path's vectors taken against /tmp, which is /private/tmp there, and dotenvx trying to keep a throwaway key in the Keychain (it failed; cross-compat.sh now sets DOTENVX_NO_NATIVE=true). Apple's git, the case-insensitive file system and BSD file semantics showed no difference in these cases; no case was written for case-insensitive names in particular, and every case runs git with GIT_CONFIG_NOSYSTEM=1, so Apple's system configuration (which setup's pre-read looks for in Apple's places) is not exercised. The first CI runs on macOS showed three things the Mac had not: perm-compat's scenes differed in their own directory's name (/var against /private/var), the 70 KB get into a socket came out of bun in parts of varying size, and tty-compat lost a scene's output when it was read late (see the header); none was a difference of the binary. Not proven: darwin-x64, where the same code answers natively without a proof of its own."

[[feature]]
name = "Windows"
status = "missing"
ts = "dede.ts:58 WIN; dede.ts:277 rel"
note = "Every invocation is handed back on Windows (rs/src/cli.rs platform_is_proven): its path rules, the absence of mode bits and its symlinks are not ported. The parity job runs rs/parity/proof.sh on win32-x64: every case is marked handed back on win32, and with bun 1.4.2 and 1.4.5 on Windows 11 x64 the 1,100 that run reach dede.ts through the binary and behave as dede.ts started directly does; 80 are skipped there as unable to mean the same (65 with a symbolic link, which Git Bash's ln -s copies, or cannot make where there is nothing to copy; 2 with a file name Windows does not keep, a tab and a dot at the end, one of which crashed the parity runner; 11 that make a PATH without git out of links, which Git Bash makes copies without .exe; 2 with a umask). cargo test compiles and passes there (27 tests). cross-compat, tty-compat, pipe-compat and perm-compat are not run on Windows: they would compare dede.ts with itself, or need a pseudo-terminal, a pipe the binary looks at, or POSIX modes and owners. The install test's three smoke lines are marked [handback:win32]. The crate type-checks for x86_64-pc-windows-msvc and win32-arm64 has no case of its own."
