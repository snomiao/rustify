status = "missing"
ts = "audio-stream-server.ts:15 createPcmGateway; audio-stream-server.ts:25 stop; audio-stream-server.ts:48 control; audio-stream-server.ts:55; audio-stream-server.ts:225"
note = "For each `audio stream open` the daemon starts its own HTTP and WebSocket server on 127.0.0.1 with a random port (request bodies up to 128 KiB) and makes two secrets of 32 random bytes each, in base64url: the capability, which goes into the ticket, and a relay key, which only the page relay receives. The capability must be used within 30 s, enforced by a timer (reason `capability-expired`) and against the clock at the upgrade and at the hello. The whole stream ends at --max-seconds x 1000 + 30 000 ms (`duration-limit`). One client only: the first valid hello consumes the capability, only then is the page relay started, and `ready` is sent to the client when the relay calls /start. A stream stops once, with a reason: the input queue is dropped, waiting requests are woken, timers are cancelled, the client gets `closed {reason}` and a close with code 1000 `audio stream closed`, the audio handler is told, and the server is shut down 1 s later so that a pending relay request can still read the stop. Reasons: `stopped` (the default of a direct stop; the daemon itself never uses it), `cancelled` (the client's `cancel` or `stop`, or `rech audio stream stop`), `renderer-ended` (the relay returned, called /close, or reported phase stopped or failed), `renderer-error` (the relay call threw), `duration-limit`, `capability-expired`, `slow-consumer` (a message could not be sent: no client, more than 64 KiB buffered towards it, the send reported backpressure, or the 8-frame output window stayed full for 2 s), `invalid-credit` (an /ack with nothing outstanding), `invalid-control` (an unknown, oversized or repeated control message), `invalid-renderer-output` (a malformed /output body), `input-overflow` (input before `ready`, after `end-input`, of the wrong size, or beyond the window), `disconnected` (the authenticated socket closed). Both directions are windowed at 8 frames (160 ms). Hard to port exactly: a three-party concurrent state machine (client socket, relay long-polls, timers) whose stop reasons rest on Bun server primitives (the buffered amount, the return value of send, the count of open sockets) that Rust has to rebuild. Tests: audio-stream.test.ts:57 (one use; a wrong Origin starts no relay), :68 (at most 8 unacknowledged output frames, and cancel still works), :195 (an expired capability fails at the handshake even before the timer runs)."

