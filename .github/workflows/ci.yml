# rustify's own checks. The `pipeline` job runs the reusable workflow that
# projects use, on a toy binary: six platforms built, packed, then installed
# with bun and npm and run on real Linux, macOS and Windows machines. Nothing
# is published anywhere.

name: ci

on:
  pull_request:
    paths-ignore: ["docs/**", "parity/**", "**.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "parity/**", "**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool:
    name: tool and local rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: cargo build --release
      - run: cargo test --release
      # The hand-back helper is a template; the toy compiles it, so its tests run there.
      - run: cargo test --manifest-path tests/e2e/toy/Cargo.toml
      - run: node --test tests/unit/*.test.mjs
      - name: End-to-end rehearsal (bun launcher)
        run: tests/e2e/run.sh
      - name: End-to-end rehearsal (node launcher)
        run: RUNTIME=node tests/e2e/run.sh

  unit:
    name: unit ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/unit/*.test.mjs
      # The hand-back helper's own tests: `attempt` and the panic hook.
      - run: cargo test --manifest-path tests/e2e/toy/Cargo.toml

  pipeline:
    uses: ./.github/workflows/rust-npm-build.yml
    with:
      manifest: tests/e2e/toy/Cargo.toml
      bins: toy
      smoke: toy --version
      # A release passes its version in; do the same, so stamping it into
      # Cargo.toml and package.json is exercised on every platform.
      version: 0.0.0-ci.${{ github.run_number }}
      # The toy package is hybrid: `legacy` is still JavaScript, and `toy js`
      # stands for a command the binary hands back to it.
      #
      # The marked lines ask who answered. `toy check` and `answer` are the
      # binary's own; `toy js` and `decline` go to the JavaScript; so does a
      # panic, also one in a worker thread, without a word, and with its
      # report where the trace is on (a marked line switches it on). The
      # JavaScript does not get the trace variable (`toy js trace`). A panic
      # after commit() ends the command with Rust's exit code 101.
      #
      # `toy where` shows which variables point into the home directory the
      # test hands out: every one that is set, on every system. The JavaScript
      # sees the same directory, whether the binary or the package manager's
      # own shim starts it. `[real-home]` gives the runner's home back.
      smoke-extra: |
        toy-alias check => toy-alias
        legacy hello => js cli: hello
        [handback] toy js handed back => js cli: js handed back
        [native] toy check => args=["check"]
        [native] toy-alias answer => toy answers natively
        [native:linux,darwin,win32] toy answer => toy answers natively
        [handback] toy decline politely => js cli: decline politely
        [handback] toy js trace => js cli: js unset
        toy panic quietly => js cli: panic quietly !> panicked
        toy panic-thread => js cli: panic-thread !> panicked
        [handback] toy panic loudly => a bug in a ported command
        [101] toy panic-late => a bug after the first output !> js cli
        toy where rustify-smoke- HOME USERPROFILE APPDATA LOCALAPPDATA XDG_CONFIG_HOME XDG_DATA_HOME XDG_STATE_HOME XDG_CACHE_HOME => HOME:inside USERPROFILE:inside !> :outside
        toy js homedir => rustify-smoke-
        legacy homedir => rustify-smoke-
        [real-home] toy where rustify-smoke- HOME USERPROFILE => HOME: !> :inside
      package: tests/e2e/toy/package.json
      # Stands for a project's parity tests: the freshly built binary is there
      # and runs, and so is the parity runner, on every system a project may
      # ask for (Git Bash on Windows).
      parity-platforms: '["linux-x64", "linux-arm64", "darwin-arm64", "darwin-x64", "win32-x64", "win32-arm64"]'
      parity: |
        "$RUSTIFY_BIN_DIR/toy" --version | grep -q "version=0.0.0-ci."
        node "$RUSTIFY_PARITY" --cases tests/e2e/toy/parity.json --ts "$RUSTIFY_BIN_DIR/toy" --rs "$RUSTIFY_BIN_DIR/toy"

  # The parity job of rust-npm-build.yml hands the bun a project pins to
  # setup-bun. This repository pins none, so the pipelines take the unpinned
  # way; here the parity job's own steps run with a pin, to a bun older than
  # the latest, in the checkout's root as a project has it (fixtures in
  # tests/e2e/bun-pin). `none` is the unpinned way on its own.
  bun-pin:
    name: parity job's bun (${{ matrix.pin }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pin: .bun-version, bun: 1.4.2 }
          - { pin: .tool-versions, bun: 1.4.0 }
          - { pin: none, bun: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pin bun as a project does
        if: matrix.pin != 'none'
        run: cp "tests/e2e/bun-pin/${{ matrix.pin }}" .
      # From here on the parity job's steps, with the script at its path here.
      - name: Find the bun the project pins
        id: bun-pin
        run: node templates/parity/bun-pin.mjs >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: steps.bun-pin.outputs.file == ''
      - uses: oven-sh/setup-bun@v2
        if: steps.bun-pin.outputs.file != ''
        with:
          bun-version-file: ${{ steps.bun-pin.outputs.file }}
      - name: bun version
        run: node templates/parity/bun-pin.mjs --check
      - name: The pinned bun is the one in PATH
        if: matrix.bun != ''
        run: test "$(bun --version)" = "${{ matrix.bun }}"

  # The publish action, run for real against a throwaway registry on this
  # runner: publish what the pipeline packed, publish it again, then install
  # from that registry the way rust-npm-verify does. What it cannot cover is
  # npm's own side: trusted publishing and provenance.
  publish-rehearsal:
    name: publish action (local registry)
    needs: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY: http://127.0.0.1:4873
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Start a throwaway registry
        run: |
          node templates/npm/registry.mjs "$RUNNER_TEMP/registry" 4873 > "$RUNNER_TEMP/registry.url" &
          for i in $(seq 50); do [ -s "$RUNNER_TEMP/registry.url" ] && break; sleep 0.2; done
          test "$(cat "$RUNNER_TEMP/registry.url")" = "$REGISTRY"
      - uses: ./actions/publish
        with:
          registry: ${{ env.REGISTRY }}
          provenance: "false"
      - name: Publishing the same release again changes nothing
        run: |
          node templates/npm/pack.mjs publish --out npm-dist --registry "$REGISTRY" | tee again.log
          test "$(grep -c "already published" again.log)" = 7
      - name: Install from that registry and run
        run: |
          node templates/npm/smoke.mjs --dist npm-dist --run "toy --version" --registry "$REGISTRY" \
            --also "legacy hello => js cli: hello" --also "[handback] toy js handed back => js cli: js handed back" \
            --also "[native] toy answer => toy answers natively"
