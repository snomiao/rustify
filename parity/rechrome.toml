note = "The part of `rech audio stream` that lives in the audio handler (same queue per session, same two log lines, same single failure reply as the other audio commands). `audio stream ...` needs a bridge installed in this session and no `upload` in the request. `audio stream stop` (exactly three arguments) cancels the session's stream with reason `cancelled` if there is one and answers {id, phase} either way. Anything else must be `audio stream open ...` and is refused when a stream already exists, when the remembered phase is not `ready` (so not after capture start, stop, failure or an earlier stream) or when a drained batch still awaits its acknowledgement; the options are checked again; then a gateway is created, remembered as the session's stream, and its ticket returned in the reply field `audioStream` beside stdout {id, phase}. While a stream exists, the session's other audio commands (status, feed, capture start, drain, stop, install) are refused. When a client authenticates on the gateway, the daemon runs the page relay as one run-code call on the session's socket with a limit of (--max-seconds + 45) seconds, passing the bridge id and origin; when that call ends, however it ends, the stream is detached and the bridge becomes `stopped` with stop and drain both marked confirmed if the relay's result confirms the stop (the session is then retired and can be reinstalled at once), else `failed` and not retired. A gateway that ends before any client authenticated (expired, or stopped) is just detached and the bridge stays `ready`. On a profile-scoped listener or with a share credential `audio` is refused earlier, HTTP 403. It can only be ported together with the daemon and its session-socket client. Test: audio-stream.test.ts:209 (stop cancels the relay and a new install succeeds afterwards)."

