note = "The order: the environment, then what bun loads from the current directory (.env.development.local, .env.local, .env.development, .env), then ~/.qqdocs/.env.local as src/env.ts reads it (quotes and a trailing comment stay part of the token there). A missing or empty token is the TypeScript's error to report and goes back; so does a token that is not plain ASCII."

