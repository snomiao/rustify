# Parity ledger for genvx. Format and rules: parity/README.md.
#
# Written while porting, on branch feat/rust-port of snomiao/genvx (the crate
# is rs/ there; nothing of it is on main yet, so read this ledger with
# `rustify audit genvx --at <that worktree>`). Read in full at 8809766:
# src/cli.ts, src/index.ts, src/hooks.ts.
#
# How the two fit together. The Rust binary is meant to be the installed
# command. rs/src/args.rs lists the plain invocations it answers itself;
# every other invocation goes back to src/cli.ts, and so does an invocation
# whose surroundings the binary does not imitate (a terminal to ask on, a
# `.env` file in syntax bun interprets, a bunfig.toml, NODE_ENV — see the
# entries below). It always goes back before anything is printed or changed.
# Status here is what the binary does on its own, so what goes back is
# `missing`.
#
# Rust-only behaviour with no TypeScript counterpart: `GENVX_NO_NATIVE=1`
# hands every invocation back (the template's way out for users), and
# `GENVX_PACKAGE_ROOT` tells the binary where the package is.
#
# Proofs. All were run and seen passing on Linux x64 with bun 1.4.0 and
# git 2.47 on 2026-11-26, against rs/target/release/genvx:
# - rs/parity.json (written by rs/parity.gen.mjs): CASES_TOTAL cases through
#   rustify's parity runner, TypeScript against the binary. Compared: stdout,
#   stderr, exit code and the `after` probes (files, modes, git state, and
#   what was pushed, decrypted with node:crypto). Normalised: the `[Nms]`
#   timings, the timestamp in backup directory names, the generated key.
# - rs/parity-native.mjs: the same cases against a stand-in package, which
#   shows who answered. CASES_NATIVE cases were answered by the binary itself and
#   CASES_HANDBACK were handed back, each as its case says it should be. A `verified`
#   below rests only on cases the binary answered.
# - rs/cross-compat.sh: both implementations on one gitstore, each reading
#   what the other wrote (CROSS_CHECKS checks).
# - `cargo test` in rs/: the crypto, base64/hex, parseInt and UTF-8 decoding
#   against values recorded from bun.
#
# Nothing is verified on macOS or Windows: the cases need a POSIX shell and
# GNU stat, and the pipeline's parity job runs on Linux. See the last entry.

reconciled = "8809766"

