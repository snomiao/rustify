note = "yargs's, and they stay there: its text follows the user's locale and the terminal's width. Rust takes a command line only in the plain spellings (rs/src/args.rs: `--name value`, `--name=value`, `-n value`, bare flags, each once, numbers as plain digits) and hands back the rest: unknown or repeated options, `-n5`, `--no-json`, `--json=true`, values starting with a dash or a quote, empty arguments, options before the command or between a command and its subcommand. --version is handed back on purpose: yargs reads it from package.json (and prints `unknown` when installed with bun). yargs also prints a command's help when the last word that is not an option or an option's value is `help` (`qqdocs search help`, `qqdocs ls -d help`); which word that is depends on what yargs knows about the options at each of its passes, so Rust hands back every command line that has the word `help` as an argument anywhere (24 `help:` cases, 20 of them handed back; `Help`, `helpdesk` and `--parent=help` are ordinary). Before the verification the binary ran `search help` as a search. 91 cases are handed back as yargs's, these 20 among them."

