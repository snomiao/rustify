status = "partial"
ts = "package.json:7 bin; package.json:30 build:cli; ts/cli.ts:1; ts/cli.ts:273"
rs = "rs/src/main.rs; rs/src/cli.rs:52 parse; rs/src/bun.rs:17 startup"
proof = "rs/parity.json; rs/parity/proof.sh"
note = "The bin is ./dist/cli.js, a `bun build --target bun` bundle of ts/cli.ts with yargs 18.0.0 inside it; the binary hands back to it. The binary takes the command lines of logout, pair, list, send, eval and kill in their plain spellings (positionals, `-s <id>`, `--session <id>`, `--session=<id>`, `--daemon <url>`, `--daemon=<url>`, in either order, words such as `version`, `completion`, `HELP`, `help me` that yargs takes as values) and an empty one; it hands back every other shape (53 `argv:` cases), and every invocation where bun does more than run the program (the `startup:` entry). `serve`, `tail` and `attach` are not ported."

