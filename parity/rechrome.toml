note = "Labelled lines: `serve:` (running with listener and bind, `not reachable at <url>`, or `✗ <url> answers HTTP n, not a rechrome daemon — ...`), `via:` (a WebRTC bridge), `config:` (where RECHROME_URL came from, `(machine-wide)` for the global file), `secret:` warnings, `share:` (label, device, waiting for approval, expiry), `auth:` (401 key rejected, 403 reason), `stale:`, `chrome:`, `relay:` (degraded, with the timeout count and a restart hint), `daemon:` (the manager and process name, `not installed`, or `not installed (no oxmgr or pm2 on PATH)`, which must not fail: cli.test.ts:294), `profile:` and what the listener serves, the tailscale block on a host, then a `More:` line. Without RECHROME_URL: `serve:    not configured` plus the setup hints. Probes use a 2 s timeout; exit 0. On a share link it prints the share and device lines (share-webrtc.integration.test.ts)."

