# Reusable workflow: Rust binaries → npm packages → install test on every OS.
#
#   jobs:
#     build:
#       uses: snomiao/rustify/.github/workflows/rust-npm-build.yml@releases/v1
#       with:
#         manifest: rs/Cargo.toml
#         bins: mycli
#         smoke: mycli --version
#
# It builds the listed cargo bins for every supported platform, packs them as
# npm packages (artifact `npm-dist`), then installs that release from a
# throwaway local registry on real Linux, macOS and Windows machines, x64 and
# arm64, with bun and with npm, and runs it. It never publishes: publishing is
# a job in the calling repository (see actions/publish).
#
# The platform list lives here and in templates/npm/platforms.json. Callers
# never name a platform.

name: rust-npm-build

on:
  workflow_call:
    inputs:
      manifest:
        description: "Path to the crate's Cargo.toml"
        required: true
        type: string
      bins:
        description: "Cargo bin names to build and ship, space separated. Not needed with prebuilt."
        required: false
        default: ""
        type: string
      smoke:
        description: "Command that must exit 0 and print the released version (or `smoke-expect`), e.g. `mycli --version`. A leading `[N] ` says it is meant to exit N instead, for a program that never exits 0 on its own."
        required: true
        type: string
      package:
        description: "package.json that carries the `rustify` configuration"
        required: false
        default: package.json
        type: string
      version:
        description: "Version to build, without a leading v (default: the version in Cargo.toml)"
        required: false
        default: ""
        type: string
      npm-tag:
        description: "npm dist-tag the release is packed for"
        required: false
        default: latest
        type: string
      pre-build:
        description: "Shell command run in the repository root before cargo (generated files, config copies)"
        required: false
        default: ""
        type: string
      js-build:
        description: "hybrid mode: command that builds the JavaScript the package still ships"
        required: false
        default: ""
        type: string
      smoke-expect:
        description: "Text the smoke command must print (default: the version)"
        required: false
        default: ""
        type: string
      smoke-extra:
        description: "More commands to run after installing, one per line: `<command> [args] => <text it must print>`, optionally followed by ` !> <text it must not print>`. Markers may lead a line, each followed by a space: `[<exit code>]` when the command is meant to fail; `[native]` when the binary must answer it itself and `[handback]` when it must hand it to the JavaScript, both of which can be limited to platforms (`[native:linux,darwin] [handback:win32]`) and need the hand-back helper v5 in the crate; `[real-home]` when the command needs the runner's own home directory. Use it for commands that are still JavaScript or handed back to it, and to see on every platform who answers a ported one."
        required: false
        default: ""
        type: string
      prebuilt:
        description: "Skip the build here. An earlier job of your workflow has built the binaries itself and uploaded one artifact per platform, named native-<platform key> (linux-x64, darwin-arm64, win32-x64, …), with the binaries at its top level. For projects whose build needs its own runners or steps. Stamping the version into those binaries is then your build's job; this workflow only stamps package.json."
        required: false
        default: false
        type: boolean
      parity:
        description: "Command that proves the Rust binary behaves like the TypeScript. Runs with the freshly built binaries in $RUSTIFY_BIN_DIR, on each platform of `parity-platforms` (Linux x64 unless that says otherwise), and has to pass before anything can be published. Example: `bun install --frozen-lockfile && bun test tests/parity.test.ts`"
        required: false
        default: ""
        type: string
      parity-platforms:
        description: "Platforms the parity command runs on, as a JSON list of platform keys: linux-x64, linux-arm64, darwin-arm64, darwin-x64, win32-x64, win32-arm64. Each runs on a runner of that platform, with its binaries in $RUSTIFY_BIN_DIR and its key in $RUSTIFY_PLATFORM, in bash (Git Bash on Windows). Default: [\"linux-x64\"]. A binary that answers a command natively on a platform should be proven there; until it is, it should hand that platform back."
        required: false
        default: '["linux-x64"]'
        type: string
      smoke-env:
        description: "Environment for the smoke commands, one NAME=value per line. For switching off a fallback the test must not take, such as a download. The smoke commands get a home directory of their own (HOME, USERPROFILE, and on Windows APPDATA and LOCALAPPDATA; the XDG_*_HOME variables are removed); a variable set here wins over that."
        required: false
        default: ""
        type: string
      scripts-ref:
        description: "Use the packer and smoke test from another ref of rustify. Default: the commit this workflow file was loaded from, so the two always match."
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: "The version that was built"
        value: ${{ jobs.pack.outputs.version }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.key }}
    if: ${{ !inputs.prebuilt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux and macOS binaries are cross-compiled on Linux with
          # cargo-zigbuild; its image carries zig and the macOS SDK, so no
          # macOS runner is needed to build. Linux binaries are static (musl)
          # and run on glibc and musl distributions alike.
          - { key: linux-x64, target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { key: linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { key: darwin-x64, target: x86_64-apple-darwin, os: ubuntu-latest, zig: true }
          - { key: darwin-arm64, target: aarch64-apple-darwin, os: ubuntu-latest, zig: true }
          - { key: win32-x64, target: x86_64-pc-windows-msvc, os: windows-latest }
          - { key: win32-arm64, target: aarch64-pc-windows-msvc, os: windows-latest }
    env:
      MANIFEST: ${{ inputs.manifest }}
      BINS: ${{ inputs.bins }}
    steps:
      - uses: actions/checkout@v4

      # The npm version and the binary's own version must be the same string.
      - name: Stamp version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i.bak -E "0,/^version = \".*\"/s//version = \"$VERSION\"/" "$MANIFEST"
          rm -f "$MANIFEST.bak"
          grep -m1 '^version = ' "$MANIFEST"

      - name: Pre-build
        if: inputs.pre-build != ''
        shell: bash
        run: ${{ inputs.pre-build }}

      - name: Check inputs
        shell: bash
        run: |
          if [ -z "$BINS" ]; then echo "::error::the bins input is empty: name the cargo bins to build"; exit 1; fi

      - name: Build (cargo-zigbuild)
        if: matrix.zig
        run: |
          flags=""; for b in $BINS; do flags="$flags --bin $b"; done
          docker run --rm -v "$GITHUB_WORKSPACE":/io -w /io -e CARGO_TERM_COLOR=always \
            ghcr.io/rust-cross/cargo-zigbuild:latest \
            bash -c "rustup target add ${{ matrix.target }} && cargo zigbuild --release --target ${{ matrix.target }} --manifest-path $MANIFEST --target-dir target-rustify $flags"

      - name: Build (cargo)
        if: ${{ !matrix.zig }}
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}
          flags=""; for b in $BINS; do flags="$flags --bin $b"; done
          cargo build --release --target ${{ matrix.target }} --manifest-path "$MANIFEST" --target-dir target-rustify $flags

      - name: Collect binaries
        shell: bash
        run: |
          ext=""; case "${{ matrix.key }}" in win32-*) ext=".exe" ;; esac
          mkdir -p "native/${{ matrix.key }}"
          for b in $BINS; do
            cp "target-rustify/${{ matrix.target }}/release/$b$ext" "native/${{ matrix.key }}/$b$ext"
          done
          ls -la "native/${{ matrix.key }}"

      # A cross build that silently produced a host binary would only show up
      # on a user's machine. Check the file format here.
      - name: Check binary format
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.key }}" in
            linux-x64) want="ELF 64-bit.*x86-64" ;;
            linux-arm64) want="ELF 64-bit.*aarch64" ;;
            darwin-x64) want="Mach-O 64-bit.*x86_64" ;;
            darwin-arm64) want="Mach-O 64-bit.*arm64" ;;
          esac
          for f in native/${{ matrix.key }}/*; do
            file "$f"
            file "$f" | grep -Eq "$want" || { echo "::error::$f is not a ${{ matrix.key }} binary"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.key }}
          path: native/${{ matrix.key }}
          if-no-files-found: error
          retention-days: 7

  # The project's own proof that Rust and TypeScript behave the same, run
  # against the binary that was just built. The packer and the parity runner of
  # this repo are available in .rustify/templates.
  parity:
    # On Linux x64 the check keeps the name it has always had.
    name: ${{ matrix.key == 'linux-x64' && 'parity (Rust against TypeScript)' || format('parity (Rust against TypeScript) on {0}', matrix.key) }}
    needs: build
    # `build` is skipped for prebuilt binaries; that must not skip this job.
    if: ${{ !cancelled() && inputs.parity != '' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ${{ fromJSON('{"linux-x64":"ubuntu-latest","linux-arm64":"ubuntu-24.04-arm","darwin-arm64":"macos-latest","darwin-x64":"macos-15-intel","win32-x64":"windows-latest","win32-arm64":"windows-11-arm"}')[matrix.key] || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        key: ${{ fromJSON(inputs.parity-platforms || '["linux-x64"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Platform
        env:
          KEY: ${{ matrix.key }}
        run: |
          case "$KEY" in
            linux-x64|linux-arm64|darwin-arm64|darwin-x64|win32-x64|win32-arm64) echo "parity on $KEY ($RUNNER_OS $RUNNER_ARCH)" ;;
            *) echo "::error::parity-platforms: unknown platform key '$KEY' (linux-x64, linux-arm64, darwin-arm64, darwin-x64, win32-x64, win32-arm64)"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.scripts-ref || job.workflow_sha }}
          path: .rustify
          sparse-checkout: templates
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The proof runs on the bun the project pins. setup-bun reads only
      # package.json by itself (packageManager, then engines.bun), so a pin in
      # .bun-version or .tool-versions is handed to it; a project that pins
      # nothing there gets setup-bun as before. Steps run in the workspace,
      # which is the project's checkout (rustify's scripts are in .rustify).
      # (Scripts from an older scripts-ref have no bun-pin.mjs: then setup-bun
      # decides, as it did there.)
      - name: Find the bun the project pins
        id: bun-pin
        run: |
          pin=.rustify/templates/parity/bun-pin.mjs
          if [ -f "$pin" ]; then node "$pin" >> "$GITHUB_OUTPUT"; fi
      - uses: oven-sh/setup-bun@v2
        if: steps.bun-pin.outputs.file == ''
      - uses: oven-sh/setup-bun@v2
        if: steps.bun-pin.outputs.file != ''
        with:
          bun-version-file: ${{ steps.bun-pin.outputs.file }}
      # Prints `bun --version`; a pin to one exact version has to be it.
      - name: bun version
        run: |
          pin=.rustify/templates/parity/bun-pin.mjs
          if [ -f "$pin" ]; then node "$pin" --check; else bun --version; fi
      - uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.key }}
          path: .rustify-bin
      - if: runner.os != 'Windows'
        run: chmod +x .rustify-bin/*
      - name: Run the parity tests
        env:
          RUSTIFY_BIN_DIR: ${{ github.workspace }}/.rustify-bin
          RUSTIFY_PARITY: ${{ github.workspace }}/.rustify/templates/parity/parity.mjs
          RUSTIFY_PLATFORM: ${{ matrix.key }}
        run: ${{ inputs.parity }}

  pack:
    name: pack npm packages
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.scripts-ref || job.workflow_sha }}
          path: .rustify
          sparse-checkout: templates/npm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: .rustify-downloaded
      - name: Lay out one directory per platform
        run: |
          mkdir -p .rustify-native
          for d in .rustify-downloaded/native-*; do mv "$d" ".rustify-native/${d#.rustify-downloaded/native-}"; done
          ls -R .rustify-native
      - name: Resolve version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          version="$VERSION"
          if [ -z "$version" ]; then
            version="$(grep -m1 '^version = ' "$MANIFEST" | sed -E 's/version = "(.*)"/\1/')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"
      # JavaScript that reads its own version at build time must see the same
      # version the binary was stamped with.
      - name: Stamp package.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE: ${{ inputs.package }}
        run: |
          node -e '
            const fs = require("fs");
            const file = process.env.PACKAGE;
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '
          grep -m1 '"version"' "$PACKAGE"
      - uses: oven-sh/setup-bun@v2
        if: inputs.js-build != ''
      - name: Build JavaScript (hybrid mode)
        if: inputs.js-build != ''
        run: ${{ inputs.js-build }}
      # The manifest tells the packer where the crate is: a package without a
      # `files` list ships its whole directory, and the crate is left out of it.
      - name: Pack
        run: |
          node .rustify/templates/npm/pack.mjs pack --package "${{ inputs.package }}" \
            --manifest "${{ inputs.manifest }}" \
            --artifacts .rustify-native --version "${{ steps.version.outputs.version }}" \
            --tag "${{ inputs.npm-tag }}" --out npm-dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: npm-dist
          if-no-files-found: error
          retention-days: 7

  # Installs the packed release from a throwaway local registry on every OS and
  # CPU family, with bun and with npm, and runs it. Nothing is public yet. The
  # commands it runs get an empty home directory of their own, not the runner's.
  smoke:
    name: smoke ${{ matrix.os }}
    needs: pack
    if: ${{ !cancelled() && needs.pack.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest # linux-x64
          - ubuntu-24.04-arm # linux-arm64
          - macos-latest # darwin-arm64
          - macos-15-intel # darwin-x64
          - windows-latest # win32-x64
          - windows-11-arm # win32-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.scripts-ref || job.workflow_sha }}
          path: .rustify
          sparse-checkout: templates/npm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Users run whatever bun they have, so this job takes setup-bun's
      # default (the latest bun) and not the version the project pins for its
      # parity tests. Nothing of the project is checked out here.
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: npm-dist
      # Artifacts do not keep the executable bit.
      - name: Restore executable bits
        if: runner.os != 'Windows'
        run: chmod +x npm-dist/*/bin/*
      - name: Install and run
        shell: bash
        env:
          SMOKE: ${{ inputs.smoke }}
          EXPECT: ${{ inputs.smoke-expect }}
          EXTRA: ${{ inputs.smoke-extra }}
          SMOKE_ENV: ${{ inputs.smoke-env }}
        run: |
          set -- --dist npm-dist --run "$SMOKE"
          if [ -n "$EXPECT" ]; then set -- "$@" "--expect=$EXPECT"; fi
          while IFS= read -r line; do
            if [ -n "$line" ]; then set -- "$@" --also "$line"; fi
          done <<< "$EXTRA"
          while IFS= read -r line; do
            if [ -n "$line" ]; then set -- "$@" --env "$line"; fi
          done <<< "$SMOKE_ENV"
          node .rustify/templates/npm/smoke.mjs "$@"
