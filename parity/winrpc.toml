proof = "rs/parity.json ahk-repl: …"
note = "Native: its refusals before it reads stdin (no URL: `error: provide <url> / --url or set WINRPC_URL`, exit 2; a URL `new URL` throws on: `error: invalid URL: <text>`, exit 2), for `ahk-repl [url] [--lease <id>]` in the plain spellings of rs/src/args.rs. With a URL it goes to the JavaScript before anything was read or sent: it then POSTs each line of stdin to /ahk-eval, which runs AutoHotkey on the server, and a hand-back after a request would run a script twice. Each line of stdin, trimmed, if not empty, is POSTed as text/plain to <url>/ahk-eval. The answer's stdout and stderr go to stdout and stderr with a newline added when missing; `ok: false` without stderr prints `[exit <exitCode or ?>]`; a failed request prints `[request failed] <message>`; 423 prints the lease-held line and exits 75. On a terminal: `winrpc ahk-repl → <base>  (Ctrl-D to exit)` on stderr and an `ahk> ` prompt; through a pipe nothing else. As read: lines are not awaited one by one, so piped lines are all sent at once and their answers print in the order they arrive; and a body that is not JSON (a 401's text) is read twice, so the second read fails and what shows is `[request failed]` with the runtime's message, not the body. These writes do not go through console, so redaction does not apply to them."

